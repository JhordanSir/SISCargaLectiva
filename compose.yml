# =============================================================
#  SISCargaLectiva · prototipo funcional de CU-001
# =============================================================
# Pensado para desplegar en Dokploy. El enrutado y el certificado los
# gestiona Dokploy desde su pestaña Domains, que genera las etiquetas de
# Traefik por su cuenta: por eso aquí no hay ninguna etiqueta traefik.*
# ni se publica ningún puerto.
#
# En la pestaña Domains hay que poner:
#
#   Service Name     prototipo
#   Host             nohagotuchamba.wayrasimi.tech
#   Path             /
#   Container Port   8000        <-- el prototipo escucha aquí, no en el 80
#   HTTPS            activado
#
# En la pestaña Environment:
#
#   GOOGLE_CLIENT_ID   el ID de cliente OAuth
#   SIS_DOMINIO        ulasalle.edu.pe   (opcional, es el valor por defecto)
#
# Si GOOGLE_CLIENT_ID no está definido el contenedor arranca igual: la
# aplicación muestra su pantalla de configuración en vez de fallar.
#
# En local este archivo no sirve para abrir el prototipo, porque no publica
# puertos. Para eso:  cd docs/prototipo/funcional && python3 servir.py

services:

  prototipo:
    image: python:3.13-slim
    working_dir: /app
    command: ["python3", "servir.py"]
    restart: unless-stopped

    volumes:
      # Solo lectura: servir.py no escribe ningún archivo.
      - ./docs/prototipo/funcional:/app:ro

    environment:
      # Dentro del contenedor hay que escuchar en todas las interfaces
      # para que Traefik alcance el servicio por la red de Docker.
      SIS_BIND: "0.0.0.0"
      SIS_PUERTO: "8000"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      SIS_DOMINIO: "${SIS_DOMINIO:-ulasalle.edu.pe}"

    networks:
      - dokploy-network

    healthcheck:
      # python3 está en la imagen; curl no. Se comprueba con la biblioteca estándar.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/index.html', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Red que ya existe en el servidor y en la que escucha Traefik.
  # No la crea este compose: se conecta a ella.
  dokploy-network:
    external: true

