# =============================================================
#  SISCargaLectiva · prototipo funcional de CU-001
# =============================================================
# Pensado para desplegar detrás del Traefik que ya tienes delante de
# wayrasimi.tech. Traefik llega al contenedor por la red compartida; el
# contenedor no publica ningún puerto al exterior.
#
#   Desplegar:  docker compose up -d
#   Ver logs:   docker compose logs -f prototipo
#   Retirar:    docker compose down
#
# Variables que hay que definir en el entorno del servidor (o en .env):
#
#   PROTOTIPO_HOST        nohagotuchamba.wayrasimi.tech
#   TRAEFIK_NETWORK       red externa donde vive Traefik
#   TRAEFIK_CERTRESOLVER  nombre del resolver de certificados de tu Traefik
#   GOOGLE_CLIENT_ID      ID de cliente OAuth
#
# Los dos valores de Traefik dependen de cómo esté montado tu servidor:
# comprueba con `docker network ls` y con la configuración estática de
# Traefik antes del primer despliegue. Los valores por defecto de abajo
# son los de una instalación de Dokploy.

services:

  prototipo:
    image: python:3.13-slim
    working_dir: /app
    command: ["python3", "servir.py"]
    restart: unless-stopped

    volumes:
      # Solo lectura: servir.py no escribe ningún archivo.
      - ./docs/prototipo/funcional:/app:ro

    environment:
      # Dentro del contenedor hay que escuchar en todas las interfaces
      # para que Traefik alcance el servicio por la red de Docker.
      SIS_BIND: "0.0.0.0"
      SIS_PUERTO: "8000"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?define GOOGLE_CLIENT_ID en el entorno o en .env}"
      SIS_DOMINIO: "${SIS_DOMINIO:-ulasalle.edu.pe}"

    # Permite definir las variables en un .env junto al compose. En el
    # servidor es más habitual inyectarlas desde la plataforma.
    env_file:
      - path: .env
        required: false

    networks:
      - proxy

    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-dokploy-network}"

      # Enrutado del dominio público hacia este contenedor.
      traefik.http.routers.siscargalectiva.rule: "Host(`${PROTOTIPO_HOST:?define PROTOTIPO_HOST, por ejemplo nohagotuchamba.wayrasimi.tech}`)"
      traefik.http.routers.siscargalectiva.entrypoints: "websecure"
      traefik.http.routers.siscargalectiva.tls: "true"
      traefik.http.routers.siscargalectiva.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.services.siscargalectiva.loadbalancer.server.port: "8000"

      # Redirige el tráfico sin cifrar al mismo dominio en HTTPS. Google
      # Identity Services no funciona sobre http en un dominio público.
      traefik.http.routers.siscargalectiva-http.rule: "Host(`${PROTOTIPO_HOST}`)"
      traefik.http.routers.siscargalectiva-http.entrypoints: "web"
      traefik.http.routers.siscargalectiva-http.middlewares: "siscargalectiva-https"
      traefik.http.middlewares.siscargalectiva-https.redirectscheme.scheme: "https"
      traefik.http.middlewares.siscargalectiva-https.redirectscheme.permanent: "true"

    healthcheck:
      # python3 está en la imagen; curl no. Se comprueba con la biblioteca estándar.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/index.html', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  # Red que ya existe en el servidor y en la que escucha Traefik.
  # No la crea este compose: se conecta a ella.
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK:-dokploy-network}"

# -------------------------------------------------------------
#  Para trabajar en local
# -------------------------------------------------------------
# Este archivo no publica puertos, así que en tu equipo no sirve para
# abrir el prototipo en el navegador. En local basta con:
#
#   cd docs/prototipo/funcional && python3 servir.py
#
# -------------------------------------------------------------
#  Pendiente: servicios del backend
# -------------------------------------------------------------
# Cuando exista el proyecto Spring Boot habrá que añadir los servicios
# backend (Java 21 + Flyway) y db (PostgreSQL, con volumen propio). Sus
# variables se acuerdan con el equipo y se documentan en .env.example en
# el mismo cambio en que se empiecen a usar.
