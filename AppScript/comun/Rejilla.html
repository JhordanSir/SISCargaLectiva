<script>
"use strict";
/* ============================================================
   Rejilla de pegado y lectura de archivos, común a la carga masiva de la oferta
   (cu001/CargaOferta.html, CU-001 pasos 21 a 30 y FA-020 a FA-037) y a la de asignaciones
   docentes (cu002/AsignacionCarga.html, CU-002 pasos 25 a 34 y FA-018 a FA-027). No llama
   al servidor: el contenido se interpreta en el navegador.
   ============================================================ */

/* SheetJS pesa casi 1 MB: se descarga al entrar en una carga masiva, no al abrir la
   página. Si no se puede descargar, los archivos se leen como texto. */
const URL_SHEETJS = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
let descargaSheetJS = null;
/**
 * Descarga SheetJS del CDN la primera vez que hace falta (solo en las cargas masivas).
 * @returns {Promise<boolean>} false si no se pudo descargar.
 */
function cargarSheetJS(){
  if (typeof XLSX !== "undefined") return Promise.resolve(true);
  if (!descargaSheetJS) descargaSheetJS = new Promise(resolve => {
    const s = document.createElement("script");
    s.src = URL_SHEETJS;
    s.onload = () => resolve(typeof XLSX !== "undefined");
    s.onerror = () => { descargaSheetJS = null; s.remove(); resolve(false); };
    document.head.appendChild(s);
  });
  return descargaSheetJS;
}

/**
 * Pregunta qué hoja de un libro leer. Devuelve su nombre o null si se cancela.
 * @param {string[]} nombres
 * @param {string} titulo
 * @param {string} boton
 * @returns {Promise<string|null>}
 */
async function preguntarHoja(nombres, titulo, boton){
  const r = await preguntar({
    titulo: titulo,
    cuerpo: '<p class="ficha">Elige la hoja que quieres importar.</p>' +
      '<div class="campo"><label for="sel-hoja">Hoja</label><select id="sel-hoja">' +
      nombres.map(n => "<option>" + esc(n) + "</option>").join("") + "</select></div>",
    acciones: [{ texto:"Cancelar", valor:null }, { texto:boton, clase:"primario", valor:() => $("#sel-hoja").value }]
  });
  return r ? r() : null;
}

/**
 * Lee un archivo como libro de cálculo y, si no lo es o no se puede, como texto. No hay
 * extensiones prohibidas. elegirHoja(nombres) => Promise<nombre|null> decide la hoja
 * cuando el libro tiene varias. Devuelve {matriz, hoja} o null si se canceló.
 * @param {File} file
 * @param {function(string[]): Promise<string|null>} elegirHoja
 * @returns {Promise<{matriz: string[][], hoja: (string|null)}|null>}
 */
async function leerArchivoComoMatriz(file, elegirHoja){
  const ext = ((file.name.match(/\.([^.]+)$/) || [])[1] || "").toLowerCase();
  if (["xlsx", "xlsm", "xlsb", "xls", "ods"].includes(ext) && await conEspera(cargarSheetJS)) {
    try {
      const libro = await conEspera(async () => XLSX.read(await file.arrayBuffer(), { type:"array" }));
      const hoja = libro.SheetNames.length > 1 ? await elegirHoja(libro.SheetNames) : libro.SheetNames[0];
      if (!hoja) return null;
      const matriz = XLSX.utils.sheet_to_json(libro.Sheets[hoja], { header:1, raw:false, defval:"" })
        .map(f => f.map(c => String(c == null ? "" : c).trim()));
      return { matriz: matriz, hoja: hoja };
    } catch (e) { /* si no se deja leer como libro, se intenta como texto */ }
  }
  let texto = "";
  try { texto = await file.text(); } catch (e) { texto = ""; }
  return { matriz: matrizDesdeTexto(texto), hoja: null };
}

/* Nombre de columna al estilo de una hoja: A, B, … Z, AA, AB… */
function letraColumna(i){
  let s = "";
  for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
}

/**
 * Rejilla con aspecto de hoja de cálculo donde se pega un rango.
 * op: {
 *   hoja, scroll, vacia: elementos de la rejilla, de la tabla y del estado vacío,
 *   pie (opcional): elemento donde se resume la lectura,
 *   botones: elementos que se habilitan cuando hay contenido,
 *   activa: () => bool; el pegado se escucha en todo el documento, solo con la rejilla a la vista,
 *   filaCabecera: matriz => índice de la fila de cabeceras o -1,
 *   maxFilas: tope de filas dibujadas (se procesan todas),
 *   alPegar: matriz => void (opcional), alSoltarArchivo: file => void (opcional)
 * }
 * @param {Object} op
 * @returns {{pintar: function((Array<Array<*>>|null)): void, limpiar: function(): void, matriz: (Array<Array<*>>|null)}}
 */
function crearRejillaPegado(op){
  let matriz = null;

  function pintar(m){
    matriz = m && m.length ? m : null;
    const hay = !!matriz;
    op.botones.forEach(b => { b.disabled = !hay; });
    op.scroll.hidden = !hay;
    op.vacia.hidden = hay;
    if (op.pie) op.pie.hidden = !hay;
    if (!hay) { op.scroll.innerHTML = ""; return; }

    const columnas = matriz.reduce((n, f) => Math.max(n, f.length), 0);
    const filaCab = op.filaCabecera ? op.filaCabecera(matriz) : -1;
    const visibles = matriz.slice(0, op.maxFilas);
    op.scroll.innerHTML = "<table><thead><tr><th></th>" +
      Array.from({ length: columnas }, (_, j) => "<th>" + letraColumna(j) + "</th>").join("") + "</tr></thead><tbody>" +
      visibles.map((f, i) => "<tr" + (i === filaCab ? ' class="fila-cabecera"' : "") + "><th>" + (i + 1) + "</th>" +
        Array.from({ length: columnas }, (_, j) => {
          const v = f[j] == null ? "" : f[j];
          return "<td" + (v === "" ? ' class="vacia"' : "") + ' title="' + esc(v) + '">' + (v === "" ? "" : esc(v)) + "</td>";
        }).join("") + "</tr>").join("") + "</tbody></table>";

    if (!op.pie) return;
    const partes = ['<span><span class="dato">' + matriz.length + "</span> fila(s) × " + '<span class="dato">' + columnas + "</span> columna(s)</span>"];
    if (filaCab >= 0) partes.push('Cabeceras detectadas en la fila <span class="dato">' + (filaCab + 1) + "</span>");
    else partes.push('<span class="falta">No se reconocen las cabeceras</span>');
    if (matriz.length > op.maxFilas) partes.push("Se muestran las primeras " + op.maxFilas + "; se procesarán todas");
    op.pie.innerHTML = partes.join(" · ");
  }

  document.addEventListener("paste", e => {
    if (!op.activa()) return;
    const texto = (e.clipboardData || window.clipboardData).getData("text/plain");
    if (!texto || !texto.trim()) return;
    e.preventDefault();
    const m = matrizDesdeTexto(texto);
    if (!m.length) return brindis("El contenido pegado está vacío.", "aviso");
    pintar(m);
    if (op.alPegar) op.alPegar(m);
    brindis("Pegadas " + m.length + " filas");
  });
  op.hoja.addEventListener("click", () => op.hoja.focus());
  if (op.alSoltarArchivo) permitirSoltarArchivo(op.hoja, op.alSoltarArchivo);

  return {
    pintar: pintar,
    limpiar: () => pintar(null),
    get matriz(){ return matriz; }
  };
}

/**
 * Deja soltar un archivo sobre el elemento: lo resalta mientras está encima y, al
 * soltarlo, llama a alSoltar con el archivo.
 * @param {Element} el
 * @param {function(File): void} alSoltar
 * @returns {void}
 */
function permitirSoltarArchivo(el, alSoltar){
  ["dragenter", "dragover"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add("encima"); }));
  ["dragleave", "drop"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove("encima"); }));
  el.addEventListener("drop", e => {
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) alSoltar(f);
  });
}
</script>
