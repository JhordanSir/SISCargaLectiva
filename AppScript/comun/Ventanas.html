<!-- ===== Ventanas: diálogo, avisos breves y espera «Wayrasiming» ===== -->
<dialog id="dlg" class="ventana" aria-labelledby="dlg-titulo">
  <div class="dlg-cab"><h3 id="dlg-titulo"></h3></div>
  <div class="dlg-cuerpo" id="dlg-cuerpo"></div>
  <div class="dlg-pie" id="dlg-pie"></div>
</dialog>

<div class="brindis" id="brindis" role="status" aria-live="polite"></div>

<div class="espera" id="espera" hidden>
  <div class="espera-tarjeta" role="status" aria-live="polite">
    <div class="espera-anillo" aria-hidden="true"><span class="espera-marca"></span></div>
    <p class="shimmer">Wayrasiming</p>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Ventanas: el diálogo de cada pantalla, los avisos breves (el «Aviso» de los CU, que
   desaparece solo) y los errores del servidor
   ============================================================ */

/**
 * Aviso breve que desaparece solo. tipo: "ok" (por defecto), "info", "aviso", "error" o
 * "pestana". El texto del elemento es solo el mensaje; el ícono lo pone la hoja de estilos.
 * @param {string} texto
 * @param {string=} tipo
 * @returns {void}
 */
function brindis(texto, tipo){
  const d = document.createElement("div");
  d.className = "brindis-msg " + (tipo || "ok");
  d.textContent = texto;
  $("#brindis").appendChild(d);
  setTimeout(() => {
    d.classList.add("saliendo");
    setTimeout(() => d.remove(), 220);
  }, 3400);
}

/**
 * Nota fija para un aviso del servidor ({tipo, nivel, texto}; Dominio.aviso).
 * @param {{nivel: string, texto: string}} a
 * @returns {string}
 */
function notaDeAviso(a){
  const clase = { aviso: " aviso", error: " error" }[a.nivel] || "";
  return '<div class="nota' + clase + '">' + esc(a.texto) + "</div>";
}

/* Una pregunta nueva sustituye a la que esté abierta, que se resuelve con null. */
const dlg = $("#dlg");
let terminarPregunta = null;
/**
 * Diálogo genérico. acciones: [{texto, clase, valor}]; se resuelve con el valor de la acción
 * elegida (o null si se cierra). Un «valor» que sea función puede leer los campos del
 * diálogo, porque se resuelve antes de cerrarlo.
 * @param {{titulo: string, cuerpo: string, acciones: Array<{texto: string, clase?: string, valor: *}>}} opciones
 * @returns {Promise<*>}
 */
function preguntar({ titulo, cuerpo, acciones }){
  if (terminarPregunta) terminarPregunta(null);
  return new Promise(resolve => {
    let resuelto = false;
    /* El evento close llega después de cerrar; si para entonces ya se abrió otra
       pregunta, pertenece a la anterior y se ignora. */
    const alCerrar = () => { if (!dlg.open) terminar(null); };
    function terminar(v){
      if (resuelto) return;
      resuelto = true;
      dlg.removeEventListener("close", alCerrar);
      if (terminarPregunta === terminar) terminarPregunta = null;
      resolve(v);
    }
    terminarPregunta = terminar;

    $("#dlg-titulo").textContent = titulo;
    $("#dlg-cuerpo").innerHTML = cuerpo;
    $("#dlg-cuerpo").scrollTop = 0;
    const pie = $("#dlg-pie");
    pie.innerHTML = "";
    acciones.forEach(a => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn " + (a.clase || "");
      b.textContent = a.texto;
      b.onclick = () => { terminar(a.valor); dlg.close(); };
      pie.appendChild(b);
    });
    dlg.addEventListener("close", alCerrar);
    if (!dlg.open) dlg.showModal();
  });
}
dlg.addEventListener("cancel", e => { e.preventDefault(); dlg.close(); });

/**
 * Ventana con un solo botón «Entendido». despues: más contenido bajo la nota (opcional).
 * @param {string} titulo
 * @param {string} html
 * @param {string=} clase
 * @param {string=} despues
 * @returns {Promise<*>}
 */
function informar(titulo, html, clase, despues){
  return preguntar({
    titulo: titulo,
    cuerpo: '<div class="nota ' + (clase || "aviso") + '">' + html + "</div>" + (despues || ""),
    acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
  });
}

/**
 * Ventana «No se pudo completar la operación» con el mensaje de un error del servidor (y
 * una nota si es INTERNO).
 * @param {*} e
 * @returns {Promise<*>}
 */
function informarError(e){
  return preguntar({
    titulo: "No se pudo completar la operación",
    cuerpo: '<div class="nota error">' + esc((e && e.message) || e) + "</div>" +
      (e && e.codigo === "INTERNO" ? '<p class="ayuda mt-3">Si vuelve a ocurrir, avisa a la administración del sistema.</p>' : ""),
    acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
  });
}
</script>
