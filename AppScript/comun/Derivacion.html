<script>
"use strict";
/* ============================================================
   Derivación de una asignatura a otro departamento (comun/Derivacion.js,
   derivacionGuardar). La usan la consulta del plan (CU-001 FA-005 a FA-008) y la
   asignación docente (CU-002 FA-079 a FA-083). Tras derivar, avisa a las pantallas que se
   suscribieron (alDerivarCurso) para que actualicen lo suyo.
   ============================================================ */
const oyentesDerivacion = [];

/**
 * Suscribe una pantalla a las derivaciones que se guardan.
 * @param {function(string, Object): void} fn Recibe la carrera del plan y la respuesta del servidor.
 * @returns {void}
 */
function alDerivarCurso(fn){ oyentesDerivacion.push(fn); }

/**
 * CU-001 FA-005 pasos 9 a 18 y CU-002 FA-079 pasos 2 a 10: la ventana «Derivar a otro
 * departamento» y el guardado. op: {ciclo, sig, grupoId, codigo, descripcion, actual}.
 * Se resuelve con la respuesta del servidor, o con null si se canceló (CU-001 FA-007,
 * CU-002 FA-082), no hubo cambios o no se pudo guardar (CU-001 FA-008, CU-002 FA-083).
 * @param {{ciclo: string, sig: string, grupoId: string, codigo: string, descripcion: string, actual: string}} op
 * @returns {Promise<Object|null>}
 */
async function derivarCurso(op){
  const propio = Dominio.dptoDeCarrera(op.sig);
  const r = await pedirNuevoDpto(op.actual, op.descripcion, propio);
  if (!r) return null;
  let res;
  try { res = await llamar("derivacionGuardar", op.ciclo, op.sig, op.grupoId, r.dpto, r.motivo); } catch (e) { informarError(e); return null; }
  if (res.sinCambios) { brindis("A " + op.codigo + " ya lo asigna " + r.dpto + ".", "info"); return null; }
  oyentesDerivacion.forEach(fn => fn(op.sig, res));
  brindis("Ahora " + op.codigo + " lo asigna " + r.dpto + ".");
  return res;
}

/* Elegir el departamento que asignará el docente de un curso. actual: el que lo asigna hoy;
   propio: el de su carrera (derivarlo a ese quita la derivación, CU-001 FA-006). */
async function pedirNuevoDpto(actual, descripcion, propio){
  const otros = DPTOS.filter(d => d !== actual);
  const r = await preguntar({
    titulo: "Derivar a otro departamento",
    cuerpo: '<div class="ficha"><b>' + esc(descripcion) + "</b><br>Hoy lo asigna <b>" + esc(actual || "—") + "</b>" +
      (propio && propio !== actual ? " (derivado; su carrera es de " + esc(propio) + ")" : "") + ".</div>" +
      '<div class="campo"><label for="dlg-nuevo-dpto">Departamento que lo asignará</label><select id="dlg-nuevo-dpto">' +
      otros.map(d => '<option value="' + d + '">' + esc(d + " · " + Dominio.nombreDpto(d) + (d === propio ? " (el de la carrera: quita la derivación)" : "")) + "</option>").join("") + "</select></div>" +
      '<div class="campo"><label for="dlg-motivo-dpto">Motivo (opcional)</label><input type="text" id="dlg-motivo-dpto" placeholder="Préstamo de docente"></div>' +
      '<div class="nota">Es una excepción: el curso sigue en la carga de su carrera, pero lo asigna el departamento elegido. Se guarda una versión nueva del plan y, si el curso ya tenía docente, la asignación lo sigue.</div>',
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Derivar", clase:"primario", valor:() => ({ dpto: $("#dlg-nuevo-dpto").value, motivo: $("#dlg-motivo-dpto").value.trim() }) }]
  });
  return r ? r() : null;
}
</script>
