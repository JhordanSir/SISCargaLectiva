<script>
"use strict";
/* ============================================================
   Núcleo de la interfaz: configuración, estado común, utilidades, vistas y secciones,
   enlace de los botones con su código y llamadas al servidor (con la espera
   «Wayrasiming»). Cada pantalla vive en su carpeta de cu001/vistas/ o cu002/vistas/, guarda su
   propio estado y usa lo que se define aquí.
   ============================================================ */
const CONFIG = SIS.config || {};
const { CARRERAS, DPTOS, ESTADOS, num, th, totales, matrizDesdeTexto, ubicarCabeceras, interpretar, nombreCarrera } = Dominio;

/**
 * Estado que comparten todas las pantallas. El de cada pantalla está en su archivo:
 * tablero (cu001/vistas/tablero/Tablero.html), consulta (cu001/vistas/consulta/Consulta.html), edicion
 * (cu001/vistas/edicion-plan/EdicionPlan.html) y asignacion (cu002/vistas/asignacion/Asignacion.html).
 * @type {{usuario: (Object|null), ciclo: string, vista: (string|null)}}
 */
const app = {
  usuario: SIS.usuario || null,   // {correo, rol, carreras (las que coordina), departamento}
  ciclo: CONFIG.ciclo,            // ciclo elegido; lo comparten el tablero y la asignación docente
  vista: null                     // vista que se muestra (#v-<nombre>)
};

/* ---------- utilidades ---------- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fecha = iso => { const d = new Date(iso); return isNaN(d) ? String(iso || "") : d.toLocaleString("es-PE", { dateStyle:"short", timeStyle:"short" }); };
const hora = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("es-PE", { hour:"2-digit", minute:"2-digit" }); };
const clonar = x => JSON.parse(JSON.stringify(x));
const icono = Dominio.htmlIcono;
const reducirMovimiento = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const carrerasDelUsuario = () => { const u = app.usuario || {}; return Array.isArray(u.carreras) ? u.carreras : []; };
const departamentoDelUsuario = () => (app.usuario || {}).departamento || "";

/* «A, B y C» */
const enumerar = lista => lista.length > 1 ? lista.slice(0, -1).join(", ") + " y " + lista[lista.length - 1] : (lista[0] || "");

/* Rol con su ámbito (CU-001 y CU-002, paso 6; CU-001 FA-004, CU-002 FA-006): de qué
   departamento es el director y qué carreras coordina el coordinador. «texto» va en la
   cabecera y en el saludo; «detalle», en el title. */
function describirRol(u){
  u = u || {};
  if (u.rol === "director") {
    const d = u.departamento || "";
    if (!d) return { texto: "Director de departamento · sin departamento asignado", detalle: "Añade el departamento en la columna «departamento» de la pestaña Usuarios." };
    return { texto: "Director del " + d + " · " + Dominio.nombreDpto(d).replace(/^Departamento (Académico )?de /, ""), detalle: Dominio.nombreDpto(d) };
  }
  const carreras = Array.isArray(u.carreras) ? u.carreras : [];
  if (!carreras.length) return { texto: "Coordinador de carrera · sin carreras asignadas (solo lectura)", detalle: "Añade sus carreras en la columna «carreras» de la pestaña Usuarios." };
  return {
    texto: "Coordinador de " + (carreras.length <= 2 ? enumerar(carreras.map(nombreCarrera)) : enumerar(carreras)),
    detalle: carreras.map(nombreCarrera).join("\n")
  };
}

/* Lleva una cifra hasta su nuevo valor con una animación breve. El valor final queda
   escrito aunque la pestaña esté oculta o el usuario prefiera menos movimiento. */
const contadores = new WeakMap();
function contarHasta(el, valor, sufijo){
  if (!el) return;
  const destino = Math.round(Number(valor) || 0), fin = sufijo || "";
  const previo = contadores.get(el);
  if (previo) { cancelAnimationFrame(previo.raf); clearTimeout(previo.respaldo); }
  const desde = previo ? previo.actual : (parseInt(el.textContent, 10) || 0);
  contadores.delete(el);
  if (reducirMovimiento() || document.hidden || desde === destino) { el.textContent = destino + fin; return; }
  const inicio = performance.now(), duracion = 700;
  const estado = { raf: 0, respaldo: 0, actual: desde };
  const terminar = () => { cancelAnimationFrame(estado.raf); clearTimeout(estado.respaldo); el.textContent = destino + fin; contadores.delete(el); };
  const paso = ahora => {
    const p = Math.min(1, (ahora - inicio) / duracion);
    estado.actual = Math.round(desde + (destino - desde) * (1 - Math.pow(1 - p, 3)));
    el.textContent = estado.actual + fin;
    if (p < 1) estado.raf = requestAnimationFrame(paso); else terminar();
  };
  estado.raf = requestAnimationFrame(paso);
  estado.respaldo = setTimeout(terminar, duracion + 400);
  contadores.set(el, estado);
}

/* ============================================================
   Botones: cada pantalla enlaza los suyos con un mapa de acciones
   ============================================================ */
/**
 * Enlaza los elementos con data-accion="nombre" de un contenedor con la función del mismo
 * nombre de su mapa. Un botón responde al clic; un select, un input o una casilla, al
 * cambio. La función recibe el dataset del elemento, el evento y el elemento. armarMapa se
 * llama al primer uso, cuando ya están cargados todos los scripts de la pantalla: así el
 * mapa puede nombrar funciones de cualquiera de sus archivos.
 * @param {Element} contenedor
 * @param {function(): Object<string, function(DOMStringMap, Event, Element): *>} armarMapa
 * @returns {void}
 */
function enlazarAcciones(contenedor, armarMapa){
  let mapa = null;
  const esCampo = el => el.matches("select, input:not([type=button]):not([type=submit])");
  const ejecutar = (e, cambio) => {
    const el = e.target.closest("[data-accion]");
    if (!el || !contenedor.contains(el) || el.disabled || esCampo(el) !== cambio) return;
    mapa = mapa || armarMapa();
    const fn = mapa[el.dataset.accion];
    if (!fn) return console.warn("Acción sin función:", el.dataset.accion);
    fn(el.dataset, e, el);
  };
  contenedor.addEventListener("click", e => ejecutar(e, false));
  /* En captura: así llega también un «change» que no burbujea (el que se dispara por código). */
  contenedor.addEventListener("change", e => ejecutar(e, true), true);
}

/* ============================================================
   Alpine.js: el estado que pinta la página
   Index.html pone x-data en <body>, así que cualquier elemento puede leer estos stores en
   su marcado ($store.nav, $store.servidor). Cada pantalla registra aquí sus componentes
   (Alpine.data) mientras se carga; base/Arranque.html llama a Alpine.start() al final.
   ============================================================ */
/* Navegación: la vista que se ve y la sección de la cabecera que está activa. Cada
   <section id="v-<nombre>"> se oculta con :hidden="$store.nav.vista !== '<nombre>'" y
   cada botón de la cabecera se marca con $store.nav.seccion. */
Alpine.store("nav", { vista: null, seccion: "" });
/* Llamadas al servidor en curso (invocar): cuántas hay de cada modo y de cada función.
   Un botón muestra que espera con :class="{ cargando: $store.servidor.ocupado(<función>) }"
   y vuelve solo a su estado habitual cuando llega la respuesta. */
Alpine.store("servidor", {
  bloquea: 0,
  fondo: 0,
  enCurso: {},
  ocupado(nombre){ return (this.enCurso[nombre] || 0) > 0; }
});
const nav = Alpine.store("nav");
const actividad = Alpine.store("servidor");

/* ============================================================
   Vistas y secciones
   ============================================================ */
const SECCION_DE = {
  menu: "inicio",
  planes: "planes", carga: "planes", pegado: "planes", grilla: "planes", lectura: "planes", exito: "planes",
  docentes: "docentes", "docentes-carga": "docentes"
};

/**
 * Muestra una vista (#v-<nombre>) y oculta las demás; sube al principio si la vista cambia.
 * Alpine cambia el DOM en el siguiente microtask: quien necesite la vista ya visible (para
 * enfocar un campo) espera la promesa.
 * @param {string} v
 * @returns {Promise<void>} Se resuelve cuando la vista ya se ve.
 */
function mostrar(v){
  const cambia = app.vista !== v;
  app.vista = v;
  nav.vista = v;
  nav.seccion = SECCION_DE[v] || "";
  document.body.dataset.vista = v;
  if (cambia) window.scrollTo({ top:0, behavior:"instant" });
  return Alpine.nextTick().then(moverIndicador);
}

/* La píldora de color se desliza hasta la sección activa. */
function moverIndicador(){
  const barra = $("#navegacion"), ind = $("#nav-indicador"), activa = $(".nav-op.activa");
  if (!barra || !ind) return;
  if (barra.hidden || !activa) { ind.style.opacity = "0"; return; }
  ind.style.transform = "translateX(" + activa.offsetLeft + "px)";
  ind.style.width = activa.offsetWidth + "px";
  ind.style.opacity = "1";
}
window.addEventListener("resize", moverIndicador);

/* Cada sección de la cabecera registra cómo se entra en ella; la pantalla que no deja
   salir sin confirmar (la edición del plan) registra su guarda. */
const SECCIONES = {};
const guardasDeSalida = [];
/**
 * @param {string} nombre «inicio», «planes» o «docentes».
 * @param {function(): void} entrar
 * @returns {void}
 */
function registrarSeccion(nombre, entrar){ SECCIONES[nombre] = entrar; }
/**
 * @param {function(): Promise<boolean>} guarda Se resuelve con false si no se puede salir.
 * @returns {void}
 */
function registrarGuardaDeSalida(guarda){ guardasDeSalida.push(guarda); }

/* Ir a una sección desde la cabecera o desde el inicio (CU-001 paso 7, CU-002 paso 7). */
async function irA(seccion){
  for (const guarda of guardasDeSalida) if (!(await guarda())) return;
  if (SECCIONES[seccion]) SECCIONES[seccion]();
}

/* El logotipo de la cabecera (@click en Index.html). */
function irAlInicio(){ if (app.usuario) irA("inicio"); }

/* Antes de cerrar o recargar la página con cambios sin guardar, el navegador pregunta. */
const cambiosPendientes = [];
/**
 * @param {function(): boolean} hay Dice si la pantalla tiene cambios sin guardar.
 * @returns {void}
 */
function registrarCambiosPendientes(hay){ cambiosPendientes.push(hay); }
window.addEventListener("beforeunload", e => {
  if (cambiosPendientes.some(hay => hay())) { e.preventDefault(); e.returnValue = ""; }
});

/* ============================================================
   Llamadas al servidor
   ============================================================ */
/* Tres modos: «bloquea» muestra la espera «Wayrasiming» e impide pulsar mientras tanto;
   «fondo» solo muestra la barra de actividad; «silencio» no muestra nada.
   La espera aparece si la respuesta tarda más de RETARDO_ESPERA_MS y, una vez visible,
   se queda al menos MINIMO_ESPERA_MS para no parpadear. */
const espera = { temporizador: null, desde: 0, cierre: null };
const RETARDO_ESPERA_MS = 260, MINIMO_ESPERA_MS = 420;

/**
 * Indicador de llamadas en curso. La barra fina (#cargando) la pinta Alpine con
 * $store.servidor; aquí queda la espera «Wayrasiming», que tiene sus propios tiempos.
 * @returns {void}
 */
function pintarActividad(){
  const ocupado = actividad.bloquea > 0;
  document.body.classList.toggle("ocupado", ocupado);
  if (ocupado) mostrarEspera(); else ocultarEspera();
}

function mostrarEspera(){
  clearTimeout(espera.cierre); espera.cierre = null;
  if (espera.temporizador || espera.desde) return;
  espera.temporizador = setTimeout(() => {
    espera.temporizador = null;
    espera.desde = Date.now();
    const capa = $("#espera");
    capa.hidden = false;
    requestAnimationFrame(() => capa.classList.add("visible"));
    $("#lienzo").setAttribute("aria-busy", "true");
  }, RETARDO_ESPERA_MS);
}

function ocultarEspera(){
  clearTimeout(espera.temporizador); espera.temporizador = null;
  if (!espera.desde || espera.cierre) return;
  const resta = Math.max(0, MINIMO_ESPERA_MS - (Date.now() - espera.desde));
  espera.cierre = setTimeout(() => {
    espera.cierre = null; espera.desde = 0;
    const capa = $("#espera");
    capa.classList.remove("visible");
    $("#lienzo").removeAttribute("aria-busy");
    setTimeout(() => { if (!espera.desde) capa.hidden = true; }, 240);
  }, resta);
}

/**
 * El servidor responde {ok: true, datos} o {ok: false, codigo, mensaje, detalle}
 * (Respuesta.js). La promesa se resuelve con los datos o se rechaza con un Error que
 * lleva el código y el detalle, para decidir por el código y no por el texto. Una respuesta
 * sin «ok» (servidor anterior al contrato) se entrega tal cual.
 * @param {*} r Lo que devolvió el servidor.
 * @param {function(*): void} ok
 * @param {function(Error & {codigo?: string, detalle?: *}): void} mal
 * @returns {void}
 */
function respuesta(r, ok, mal){
  if (r && typeof r === "object" && r.ok === false)
    return mal(Object.assign(new Error(r.mensaje || "No se pudo completar la operación."), { codigo: r.codigo, detalle: r.detalle || null }));
  ok(r && typeof r === "object" && r.ok === true ? r.datos : r);
}

/**
 * Llama a una función del servidor con google.script.run y devuelve una promesa con sus datos.
 * modo: «bloquea» (espera visible), «fondo» (barra fina) o «silencio» (sin indicador).
 * Se usa a través de llamar, llamarDeFondo y llamarEnSilencio. El nombre es el de la
 * función del .js de la vista («vista + acción»: tableroObtener, edicionPlanGuardar…).
 * @param {string} nombre
 * @param {Array<*>} args
 * @param {"bloquea"|"fondo"|"silencio"} modo
 * @returns {Promise<*>} Se rechaza con un Error que lleva codigo y detalle.
 */
function invocar(nombre, args, modo){
  const visible = modo !== "silencio";
  actividad.enCurso[nombre] = (actividad.enCurso[nombre] || 0) + 1;
  if (visible) { actividad[modo]++; pintarActividad(); }
  return new Promise((ok, mal) => {
    const fin = () => {
      actividad.enCurso[nombre] = Math.max(0, actividad.enCurso[nombre] - 1);
      if (!visible) return;
      actividad[modo] = Math.max(0, actividad[modo] - 1);
      pintarActividad();
    };
    google.script.run
      .withSuccessHandler(r => { fin(); respuesta(r, ok, mal); })
      .withFailureHandler(e => { fin(); mal(e); })[nombre](...args);
  });
}
const llamar = (nombre, ...args) => invocar(nombre, args, "bloquea");
const llamarDeFondo = (nombre, ...args) => invocar(nombre, args, "fondo");
const llamarEnSilencio = (nombre, ...args) => invocar(nombre, args, "silencio");

/**
 * Trabajo que hace el propio navegador y puede tardar (descargar SheetJS, leer un libro).
 * @template T
 * @param {function(): Promise<T>} trabajo
 * @returns {Promise<T>}
 */
async function conEspera(trabajo){
  actividad.bloquea++; pintarActividad();
  try { return await trabajo(); }
  finally { actividad.bloquea = Math.max(0, actividad.bloquea - 1); pintarActividad(); }
}
</script>
