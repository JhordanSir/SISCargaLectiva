<script>
"use strict";
/* ============================================================
   Acciones de edición
   ============================================================ */
$$("[data-acc]").forEach(b => { b.onclick = () => accion(b.dataset.acc); });

async function accion(tipo){
  const p = app.plan;
  if (!p) return;
  const s = seleccion();
  let modifica = true;
  latido();

  switch (tipo) {

    case "editar": {
      const r = await preguntar({
        titulo: "Editar horas del grupo",
        cuerpo: resumenSel(s) +
          '<div class="fila-campos">' +
          '<div class="campo"><label for="e-ht">HT</label><input type="text" id="e-ht" value="' + esc(s.g.ht) + '"></div>' +
          '<div class="campo"><label for="e-hp">HP</label><input type="text" id="e-hp" value="' + esc(s.g.hp) + '"></div>' +
          '</div><div class="nota">El total de horas se recalcula automáticamente.</div>',
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Aplicar", clase:"primario", valor:() => ({ ht:$("#e-ht").value, hp:$("#e-hp").value }) }]
      });
      if (!r) return;
      const { ht, hp } = r();
      s.g.ht = ht; s.g.hp = hp;   // se guarda tal cual se escribió
      aviso("Horas actualizadas");
      break;
    }

    case "editar-asignatura": {
      const actual = Dominio.normalizarDpto(s.a.dpto) || String(s.a.dpto || "").trim();
      const opciones = DPTOS.concat(actual && !DPTOS.includes(actual) ? [actual] : []);
      await asegurarDocentesGrupo();
      const doc = docentesDe(s.a.grupos);
      const r = await preguntar({
        titulo: "Editar asignatura",
        cuerpo: resumenSel(s) +
          '<div class="fila-campos">' +
          '<div class="campo"><label for="ea-cod">Código</label><input type="text" id="ea-cod" value="' + esc(s.a.codigo) + '"></div>' +
          '<div class="campo"><label for="ea-dpto">Departamento (DPTO)</label><select id="ea-dpto">' +
            opciones.map(d => '<option value="' + esc(d) + '"' + (d === actual ? " selected" : "") + ">" + esc(d) + "</option>").join("") + "</select></div></div>" +
          '<div class="campo"><label for="ea-nom">Asignatura</label><input type="text" id="ea-nom" value="' + esc(s.a.nombre) + '"></div>' +
          '<div class="campo"><label for="ea-obs">Observaciones</label><input type="text" id="ea-obs" value="' + esc(s.a.obs || "") + '" placeholder="INTERNACIONAL, VIRTUAL…"></div>' +
          '<div class="nota">La columna DPTO es informativa: el docente lo asigna el departamento de la carrera (' + esc(Dominio.dptoDeCarrera(app.carrera)) +
            ") o aquel al que el director derive el curso." + (doc.length ? " Docentes ya asignados: " + doc.map(esc).join(", ") + "." : "") + "</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Aplicar", clase:"primario", valor:() => ({
          codigo: $("#ea-cod").value.trim(), nombre: $("#ea-nom").value.trim(), dpto: $("#ea-dpto").value, obs: $("#ea-obs").value.trim() }) }]
      });
      if (!r) return;
      const v = r();
      Object.assign(s.a, { codigo: v.codigo, nombre: v.nombre, dpto: v.dpto, obs: v.obs });
      aviso("Asignatura actualizada");
      break;
    }

    case "agregar-asignatura": {
      const r = await preguntar({
        titulo: "Agregar asignatura",
        cuerpo:
          '<div class="fila-campos">' +
          '<div class="campo"><label for="n-sem">Semestre</label><input type="text" id="n-sem" value="1" placeholder="5 o 1-2"></div>' +
          '<div class="campo"><label for="n-malla">Malla</label><input type="text" id="n-malla" value="2024"></div>' +
          '<div class="campo"><label for="n-cod">Código</label><input type="text" id="n-cod" placeholder="3.1.1.24"></div>' +
          '</div><div class="campo"><label for="n-nom">Asignatura</label><input type="text" id="n-nom"></div>' +
          '<div class="fila-campos">' +
          '<div class="campo"><label for="n-ht">HT</label><input type="text" id="n-ht" value="3"></div>' +
          '<div class="campo"><label for="n-hp">HP</label><input type="text" id="n-hp" value="2"></div>' +
          '<div class="campo"><label for="n-dpto">Dpto</label>' +
            '<input type="text" id="n-dpto" list="lista-dptos" value="' + DPTOS[0] + '">' +
            '<datalist id="lista-dptos">' + DPTOS.map(d => "<option>" + d + "</option>").join("") +
            "</datalist></div></div>" +
          '<div class="campo"><label for="n-obs">Observaciones</label><input type="text" id="n-obs" placeholder="INTERNACIONAL, VIRTUAL…"></div>',
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Agregar", clase:"primario", valor:() => ({
          sem:$("#n-sem").value, malla:$("#n-malla").value, codigo:$("#n-cod").value.trim(),
          nombre:$("#n-nom").value.trim(), ht:$("#n-ht").value, hp:$("#n-hp").value,
          dpto:$("#n-dpto").value, obs:$("#n-obs").value.trim()
        }) }]
      });
      if (!r) return;
      /* Sin validación: se guarda lo que se haya escrito. */
      Dominio.agregarAsignatura(p.asignaturas, r());
      app.seleccion = null;   // la lista se reordena: la fila seleccionada ya no es la misma
      aviso("Asignatura agregada");
      break;
    }

    case "eliminar-asignatura": {
      await asegurarDocentesGrupo();
      const ok = await preguntar({
        titulo: "Eliminar asignatura",
        cuerpo: resumenSel(s) + '<div class="nota aviso">Se eliminará la asignatura y sus ' +
          s.a.grupos.length + " grupo(s)." + (s.a.grupos.some(g => g.fusion) ? " Alguno participa en una fusión y se retirará de ella." : "") + "</div>" +
          notaDocentes(docentesDe(s.a.grupos), "La asignatura"),
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Eliminar", clase:"peligro", valor:true }]
      });
      if (!ok) return;
      Dominio.eliminarAsignatura(p.asignaturas, s.ci);
      app.seleccion = null;
      aviso("Asignatura eliminada");
      break;
    }

    case "agregar-grupo": {
      const n = Dominio.agregarGrupo(p.asignaturas, s.ci, s.gi);
      aviso("Grupo " + n + " agregado a " + s.a.nombre);
      break;
    }

    case "grupo-semestre": {
      const sem = s ? s.a.sem : (p.asignaturas[0] || {}).sem;
      if (sem === undefined) return aviso("El plan no tiene asignaturas.", "aviso");
      const cuantas = p.asignaturas.filter(a => String(a.sem) === String(sem)).length;
      const ok = await preguntar({
        titulo: "Agregar un grupo a todo el semestre",
        cuerpo: '<div class="nota">Se creará un grupo correlativo en las <b>' + cuantas +
          "</b> asignaturas del semestre <b>" + esc(sem) + "</b>, con las mismas horas que su primer grupo.</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Agregar", clase:"primario", valor:true }]
      });
      if (!ok) return;
      aviso("Grupo agregado en " + Dominio.agregarGrupoSemestre(p.asignaturas, sem) + " asignaturas");
      break;
    }

    case "eliminar-grupo": {
      const solo = s.a.grupos.length === 1;
      await asegurarDocentesGrupo();
      const ok = await preguntar({
        titulo: "Eliminar grupo",
        cuerpo: resumenSel(s) +
          (solo || s.g.fusion ? '<div class="nota aviso">' +
            (solo ? "Es el único grupo de la asignatura: al eliminarlo, la asignatura deja de aportar horas y se retira del plan. " : "") +
            (s.g.fusion ? "El grupo participa en una fusión y se retirará de ella." : "") + "</div>" : "") +
          notaDocentes(docentesDe([s.g]), "El grupo"),
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Eliminar", clase:"peligro", valor:true }]
      });
      if (!ok) return;
      Dominio.eliminarGrupo(p.asignaturas, s.ci, s.gi);
      app.seleccion = null;
      aviso("Grupo eliminado");
      break;
    }

    case "desdoblar": {
      const r = await preguntar({
        titulo: "Desdoble parcial",
        cuerpo: resumenSel(s) +
          '<div class="fila-campos">' +
          '<div class="campo"><label for="d-tipo">Tipo</label><select id="d-tipo">' +
            '<option value="Práctica">Práctica</option><option value="Teoría">Teoría</option></select></div>' +
          '<div class="campo"><label for="d-cant">Subgrupos (2 – ' + CONFIG.maxSubgrupos + ')</label>' +
            '<input type="number" id="d-cant" value="2" min="2" max="' + CONFIG.maxSubgrupos + '"></div></div>' +
          '<div class="nota">Las horas del otro tipo se mantienen en una sección común.</div>',
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Desdoblar", clase:"primario", valor:() => ({ tipo:$("#d-tipo").value, cant:$("#d-cant").value }) }]
      });
      if (!r) return;
      const { tipo: clase, cant } = r();
      const horas = num(clase === "Práctica" ? s.g.hp : s.g.ht);
      const n = parseInt(cant, 10);
      if (!horas) {
        await informar("El desdoble no aplica", "El grupo no registra horas de " + clase.toLowerCase() +
          ", así que no hay nada que desdoblar. No se han generado subgrupos.");
        return;
      }
      if (!(n >= 2 && n <= CONFIG.maxSubgrupos)) {
        await informar("Cantidad de subgrupos no válida", "La cantidad de subgrupos debe estar entre <b>2</b> y <b>" +
          CONFIG.maxSubgrupos + "</b>. No se han generado subgrupos.");
        return accion("desdoblar");
      }
      Dominio.desdoblar(s.g, clase, n);
      aviso("Desdoble de " + clase.toLowerCase() + " en " + n + " subgrupos");
      break;
    }

    case "quitar-desdoble": {
      const ok = await preguntar({
        titulo: "Quitar el desdoble",
        cuerpo: resumenSel(s) + '<div class="nota">Se quitará el desdoble <b>' + esc(s.g.desdoble) +
          "</b>: el grupo vuelve a dictarse en una sola sección.</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Quitar desdoble", clase:"primario", valor:true }]
      });
      if (!ok) return;
      Dominio.quitarDesdoble(s.g);
      aviso("Desdoble quitado");
      break;
    }

    case "fusionar": {
      const ops = [], externos = [];
      p.asignaturas.forEach((a, ci) => a.grupos.forEach((g, gi) => {
        ops.push('<option value="' + ci + ":" + gi + '">' + esc(app.carrera) + " · " + esc(a.codigo) + " " + esc(a.nombre) +
          " · grupo " + esc(g.n) + " · " + esc(g.ht) + "/" + esc(g.hp) + "</option>");
      }));
      /* Grupos de los planes de otras carreras del mismo ciclo, según el último tablero. */
      (app.tableroCiclo === app.ciclo ? app.tablero : []).filter(f => f.sig !== app.carrera).forEach(f => (f.contenido || []).forEach(a => a.grupos.forEach(g => {
        const i = externos.length;
        externos.push({ carrera: f.sig, grupoId: g.id, codigo: a.codigo, nombre: a.nombre, n: g.n, ht: g.ht, hp: g.hp });
        ops.push('<option value="ext:' + i + '">' + esc(f.sig) + " · " + esc(a.codigo) + " " + esc(a.nombre) +
          " · grupo " + esc(g.n) + " · " + esc(g.ht) + "/" + esc(g.hp) + "</option>");
      })));
      if (ops.length < 2) return aviso("Hacen falta al menos dos grupos para fusionar.", "aviso");
      const r = await preguntar({
        titulo: "Fusionar grupos",
        cuerpo:
          '<p class="ficha">Marca dos o más grupos (Ctrl o Mayús para selección múltiple), de este plan o de otras carreras, y elige el grupo principal, cuyas horas definirán la sección fusionada.</p>' +
          '<div class="campo"><label for="f-grupos">Grupos a fusionar</label>' +
          '<select id="f-grupos" multiple size="9">' + ops.join("") + "</select></div>" +
          '<div class="campo"><label for="f-principal">Grupo principal</label><select id="f-principal">' + ops.join("") + "</select></div>" +
          '<div class="nota">Las diferencias de nombre, código u horas se muestran como advertencia: no impiden la fusión. ' +
          "La fusión con grupos de otras carreras se lleva a sus planes al guardar, sin necesidad de su aprobación; la sección tiene un solo docente.</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Fusionar", clase:"primario", valor:() => ({
          sel:Array.from($("#f-grupos").selectedOptions).map(o => o.value), principal:$("#f-principal").value
        }) }]
      });
      if (!r) return;
      const { sel, principal } = r();
      const locales = sel.filter(v => !v.startsWith("ext:"));
      const elegidosExt = sel.filter(v => v.startsWith("ext:")).map(v => externos[+v.slice(4)]);
      if (principal.startsWith("ext:") && !elegidosExt.includes(externos[+principal.slice(4)])) elegidosExt.push(externos[+principal.slice(4)]);
      if (!locales.length && principal.startsWith("ext:")) {
        await preguntar({
          titulo: "Falta un grupo de este plan",
          cuerpo: '<div class="nota aviso">Desde el plan de ' + esc(nombreCarrera(app.carrera)) + " solo se fusionan secciones que incluyan al menos un grupo suyo.</div>",
          acciones: [{ texto:"Volver a seleccionar", clase:"primario", valor:true }]
        });
        return accion("fusionar");
      }
      if (new Set(sel.concat([principal])).size < 2) {
        await preguntar({
          titulo: "Selección insuficiente",
          cuerpo: '<div class="nota aviso">La fusión requiere al menos dos grupos.</div>',
          acciones: [{ texto:"Volver a seleccionar", clase:"primario", valor:true }]
        });
        return accion("fusionar");
      }
      const principalLocal = principal.startsWith("ext:") ? "ext:" + elegidosExt.indexOf(externos[+principal.slice(4)]) : principal;
      const { difs, conOtras } = Dominio.fusionar(p.asignaturas, locales, principalLocal, elegidosExt);
      if (conOtras) aviso("La fusión se llevará al plan de " + [...new Set(elegidosExt.map(x => x.carrera))].join(", ") + " al guardar.", "info");
      if (difs.length) {
        await informar("Fusión creada con advertencias", "<b>A05</b> · Estos grupos difieren del grupo principal en nombre, código u horas. " +
          "La fusión se ha creado igualmente y sus horas se cuentan una sola vez.", "aviso",
          '<ul class="lista-err lista-adv">' + difs.map(d => "<li><span>" + esc(d) + "</span></li>").join("") + "</ul>");
      } else aviso("Grupos fusionados");
      break;
    }

    case "deshacer-fusion": {
      const conOtras = (s.g.fusionCon || []).length > 0;
      const ok = await preguntar({
        titulo: "Deshacer la fusión",
        cuerpo: '<div class="nota">Se disolverá la sección fusionada: cada grupo volverá a contarse por separado y recuperará las horas que tenía antes de la fusión.' +
          (conOtras ? " También se deshará en el plan de " + [...new Set(s.g.fusionCon.map(x => x.carrera))].map(esc).join(", ") + " al guardar." : "") + "</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Deshacer", clase:"primario", valor:true }]
      });
      if (!ok) return;
      if (conOtras) p.fusionesDisueltas = (p.fusionesDisueltas || []).concat([s.g.fusion]);
      Dominio.deshacerFusion(p.asignaturas, s.g.fusion);
      aviso("Fusión deshecha");
      break;
    }

    case "historial": {
      let versiones;
      try { versiones = await llamar("obtenerHistorial", app.ciclo, app.carrera); } catch (e) { return informarError(e); }
      if (!versiones.length) return aviso("Todavía no hay versiones guardadas de este plan.", "info");
      const elegido = await dialogoHistorial({ titulo: "Historial de versiones", versiones: versiones, conEstado: true, restaurar: true });
      if (!elegido) return;
      const n = elegido.restaurar;
      let res;
      try { res = await llamar("restaurarVersion", app.ciclo, app.carrera, n); } catch (e) { return informarError(e); }
      Object.assign(p, { asignaturas: res.asignaturas, version: res.version, estado: res.estado, sucio: false, fusionesDisueltas: [] });
      sesionPlan.renovada(res.expira);
      sesionPlan.olvidarCopia();
      actualizarFilaTablero(app.carrera, { estado: res.estado, version: res.version, totales: totales(res.asignaturas), contenido: clonar(res.asignaturas) });
      anunciarGuardado(app.carrera, res.estado, res.version, res.asignaturas);
      aplicarOtros(res.otros);
      app.seleccion = null;
      modifica = false;
      aviso("Versión v" + n + " restaurada");
      break;
    }

    case "reemplazar": {
      const ok = await preguntar({
        titulo: "Reemplazar el contenido",
        cuerpo: '<div class="nota aviso">Volverás a las opciones de carga. Al importar un contenido nuevo se reemplazará ' +
          "todo el plan actual, incluidos los desdobles, los ajustes manuales y las fusiones.</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Continuar", clase:"primario", valor:true }]
      });
      if (!ok) return;
      irACarga();
      return;
    }
  }

  if (modifica) p.sucio = true;
  app.avisoImportacion = "";
  pintarGrilla();
}
</script>
