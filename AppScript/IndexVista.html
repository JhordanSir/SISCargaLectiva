<!DOCTYPE html>
<!-- Carcasa de la aplicación (backend: Index.js).
     Botones: la barra superior (Inicio, Registrar plan de ciclo, Carga docente) cambia de vista
     con $store.nav.vista; las vistas se incluyen abajo con include().
     Servidor: indexUsuario (correo, rol, carreras y departamento de quien usa la página).
     Alpine: store «nav» (vista visible) y store «usuario» (quién usa la página). -->
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
  <style>
    :root { --texto: #1f2933; --suave: #5f6b7a; --borde: #d5dbe3; --fondo: #f5f7fa; --primario: #1d4ed8;
            --peligro: #b91c1c; --aviso: #92400e; --aviso-fondo: #fef3c7; --ok: #166534; --ok-fondo: #dcfce7; }
    * { box-sizing: border-box; }
    [x-cloak] { display: none !important; }
    body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", Roboto, Arial, sans-serif; color: var(--texto); background: var(--fondo); }
    header.barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 16px;
                   background: #fff; border-bottom: 1px solid var(--borde); }
    header.barra strong { margin-right: 12px; }
    header.barra .usuario { margin-left: auto; color: var(--suave); }
    main { max-width: 1200px; margin: 0 auto; padding: 16px; }
    h2 { margin: 4px 0 12px; font-size: 20px; }
    h3 { margin: 16px 0 8px; font-size: 16px; }
    button { font: inherit; padding: 6px 12px; border: 1px solid var(--borde); border-radius: 6px; background: #fff;
             color: var(--texto); cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--primario); }
    button:disabled { opacity: .55; cursor: default; }
    button.primario { background: var(--primario); border-color: var(--primario); color: #fff; }
    button.peligro { color: var(--peligro); border-color: #f1b5b5; }
    button.activo { background: #e8eefc; border-color: var(--primario); font-weight: 600; }
    button.chico { padding: 2px 8px; font-size: 12px; }
    input, select, textarea { font: inherit; padding: 5px 8px; border: 1px solid var(--borde); border-radius: 6px; background: #fff; }
    textarea { width: 100%; min-height: 140px; font: 12px/1.4 ui-monospace, Consolas, monospace; }
    label { color: var(--suave); }
    .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
    .panel { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
    .tabla { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; margin: 8px 0; }
    th, td { border: 1px solid var(--borde); padding: 4px 8px; text-align: left; vertical-align: top; }
    th { background: #eef2f7; font-weight: 600; }
    .num { text-align: right; }
    .aviso { background: var(--aviso-fondo); color: var(--aviso); border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
    .error { background: #fee2e2; color: var(--peligro); border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
    .exito { background: var(--ok-fondo); color: var(--ok); border-radius: 6px; padding: 6px 10px; margin: 6px 0; }
    .suave { color: var(--suave); }
    .marca { display: inline-block; padding: 0 6px; margin: 1px 4px 1px 0; border-radius: 4px; font-size: 12px; background: #e0e7ff; color: #3730a3; }
    .marca.fus { background: #fae8ff; color: #86198f; }
    .marca.des { background: #dcfce7; color: #166534; }
    .marca.lectura { background: #e5e7eb; color: #374151; }
    .inicio { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 24px; }
    .inicio button { padding: 24px; min-width: 280px; text-align: left; font-size: 16px; }
    .inicio button small { display: block; margin-top: 4px; font-size: 13px; color: var(--suave); }
    .inicio button.primario small { color: #dbeafe; }
    .dialogo { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-start; justify-content: center;
               padding: 40px 16px; overflow: auto; background: rgba(15, 23, 42, .45); }
    .dialogo > div { width: 100%; max-width: 900px; padding: 16px 20px; border-radius: 8px; background: #fff; }
    @media (max-width: 700px) { table { font-size: 12px; } .inicio button { min-width: 100%; } }
  </style>
</head>
<body x-data>
  <header class="barra">
    <strong>SISCargaLectiva</strong>
    <template x-if="$store.usuario.acceso">
      <span class="fila" style="margin: 0">
        <button :class="{ activo: $store.nav.vista === 'inicio' }" @click="$store.nav.vista = 'inicio'">Inicio</button>
        <button :class="{ activo: $store.nav.vista === 'plan' }" @click="$store.nav.vista = 'plan'">Registrar plan de ciclo</button>
        <button :class="{ activo: $store.nav.vista === 'carga' }" @click="$store.nav.vista = 'carga'">Carga docente</button>
      </span>
    </template>
    <span class="usuario" x-show="$store.usuario.correo" x-cloak
          x-text="$store.usuario.correo + ($store.usuario.rol ? ' · ' + $store.usuario.rol : '')"></span>
  </header>

  <main>
    <section x-show="$store.nav.vista === 'denegado'" x-cloak>
      <h2>Acceso denegado</h2>
      <p class="error" x-text="$store.usuario.motivo"></p>
      <p class="suave">Si crees que es un error, pide que agreguen tu cuenta a la pestaña Usuarios.</p>
    </section>

    <?!= include("InicioVista") ?>
    <?!= include("PlanDeCicloVista") ?>
    <?!= include("CargaDocenteVista") ?>
  </main>

  <script>
    /* Stores de la carcasa. La vista visible es $store.nav.vista: «inicio», «plan», «carga»
       o «denegado». Cada vista registra su propio componente en su archivo. */
    document.addEventListener("alpine:init", () => {
      Alpine.store("nav", { vista: "inicio" });
      Alpine.store("usuario", {
        cargando: true, acceso: false, correo: "", rol: "", carreras: [], departamento: "", motivo: "", error: "",
        cargar() {
          this.cargando = true;
          this.error = "";
          indexLlamar("indexUsuario")
            .then(datos => {
              Object.assign(this, datos);
              if (!datos.acceso) Alpine.store("nav").vista = "denegado";
            })
            .catch(e => { this.error = e.message; })
            .finally(() => { this.cargando = false; });
        }
      });
      Alpine.store("usuario").cargar();
    });

    /* google.script.run con promesa: resuelve con datos si ok, rechaza con el error si no. */
    function indexLlamar(nombre, ...args) {
      return new Promise((resolver, rechazar) => {
        google.script.run
          .withSuccessHandler(r => (r && r.ok ? resolver(r.datos) : rechazar(new Error((r && r.error) || "Respuesta vacía del servidor."))))
          .withFailureHandler(e => rechazar(new Error((e && e.message) || String(e))))[nombre](...args);
      });
    }
  </script>
</body>
</html>
