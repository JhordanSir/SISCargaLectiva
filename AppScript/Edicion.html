<script>
"use strict";
/* ============================================================
   Edición con bloqueo, común al plan de ciclo y a la carga docente
   - crearSesionEdicion: reloj, latido que renueva el bloqueo, expiración y copia de
     recuperación cada minuto. Cada módulo decide qué hacer al perder el bloqueo o al
     expirar.
   - Diálogos comunes: recuperar cambios, conflicto de versión, historial e informar.
   ============================================================ */

/**
 * op: {
 *   relojes:      selector de los elementos donde se pinta el tiempo que queda,
 *   renovar:      () => Promise<{expira}>; se rechaza con codigo BLOQUEO_PERDIDO si otra cuenta lo tomó,
 *   alPerder:     correo => void, cuando otra cuenta tomó el bloqueo,
 *   alExpirar:    () => void, cuando pasó el tiempo sin actividad,
 *   alRenovar:    () => void (opcional), tras cada renovación,
 *   copia:        () => {contenido, versionBase} | null (null: nada que copiar),
 *   guardarCopia: datos => Promise
 * }
 * @param {Object} op
 * @returns {Object} Sesión: iniciar, detener, latido, mensaje, activa, expira…
 */
function crearSesionEdicion(op){
  const s = { expira: 0, desde: "", temporizador: null, copiador: null, ultimoLatido: 0, ultimaCopia: "", generacion: 0 };
  const quedan = () => Math.max(0, Math.ceil((s.expira - Date.now()) / 1000));

  function pintar(){
    const q = quedan();
    const texto = "Sesión de edición: " + Math.floor(q / 60) + ":" + String(q % 60).padStart(2, "0");
    $$(op.relojes).forEach(e => { e.textContent = texto; e.classList.toggle("poco", q <= 60); });
  }

  function mensaje(texto){
    $$(op.relojes).forEach(e => { e.textContent = texto; e.classList.remove("poco"); });
  }

  function iniciar(expira){
    detener();
    s.generacion++;
    s.expira = Date.parse(expira);
    s.ultimoLatido = Date.now();
    s.ultimaCopia = "";
    s.temporizador = setInterval(() => {
      pintar();
      if (Date.now() >= s.expira) { detener(); op.alExpirar(); }
    }, 1000);
    s.copiador = setInterval(copiar, 60000);
    pintar();
  }

  function detener(){
    clearInterval(s.temporizador);
    clearInterval(s.copiador);
    s.temporizador = null;
    s.copiador = null;
    mensaje("");
  }

  /* La actividad renueva el bloqueo en el servidor, como mucho una vez por minuto. */
  async function latido(){
    if (!s.temporizador) return;
    const intervalo = Math.min(60000, CONFIG.minutosBloqueo * 15000);
    if (Date.now() - s.ultimoLatido < intervalo) return;
    s.ultimoLatido = Date.now();
    const generacion = s.generacion;
    let r;
    try {
      r = await op.renovar();
    } catch (e) {
      if (generacion !== s.generacion || !s.temporizador) return;
      if (e && e.codigo === "BLOQUEO_PERDIDO") { detener(); return op.alPerder(e.detalle ? e.detalle.correo : ""); }
      return;   // un fallo de red u otro: la siguiente actividad lo reintenta
    }
    if (generacion !== s.generacion || !s.temporizador) return;
    s.expira = Date.parse(r.expira);
    pintar();
    if (op.alRenovar) op.alRenovar();
  }
  ["click", "keydown"].forEach(ev => document.addEventListener(ev, latido, { passive: true }));

  function copiar(){
    const d = op.copia();
    if (!d) return;
    const texto = JSON.stringify(d.contenido);
    if (texto === s.ultimaCopia) return;
    /* Solo cuenta como copiada si el servidor la guardó: si estaba ocupado ({omitida}) o
       falló, se vuelve a intentar al minuto siguiente. */
    op.guardarCopia(d)
      .then(r => { if (r && r.fecha) s.ultimaCopia = texto; })
      .catch(e => console.warn("No se pudo guardar la copia de recuperación:", e));
  }

  return {
    iniciar, detener, latido, mensaje,
    get activa(){ return !!s.temporizador; },
    get expira(){ return s.expira; },
    /* El servidor devolvió una nueva caducidad (al guardar o restaurar). */
    renovada(expira){ if (expira) { s.expira = Date.parse(expira); pintar(); } },
    /* Tras guardar, la próxima copia vuelve a enviarse aunque el contenido no cambie. */
    olvidarCopia(){ s.ultimaCopia = ""; },
    get desde(){ return s.desde; },
    set desde(v){ s.desde = v; }
  };
}

/* ---------- diálogos comunes ---------- */

/**
 * Diálogo informativo con un solo botón. despues: más contenido bajo la nota (opcional).
 * @param {string} titulo
 * @param {string} html
 * @param {string=} clase
 * @param {function(): void=} despues
 * @returns {Promise<*>}
 */
function informar(titulo, html, clase, despues){
  return preguntar({
    titulo: titulo,
    cuerpo: '<div class="nota ' + (clase || "aviso") + '">' + html + "</div>" + (despues || ""),
    acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
  });
}

/**
 * Quedaron cambios sin guardar de una sesión anterior. Devuelve true (recuperarlos),
 * false (descartarlos) o null (se cerró sin elegir: la copia se conserva).
 * @param {{fecha: string, versionBase: number, contenido: *}} rec
 * @param {number} versionActual
 * @param {string} donde
 * @returns {Promise<boolean|null>}
 */
function ofrecerRecuperacion(rec, versionActual, donde){
  return preguntar({
    titulo: "Hay cambios sin guardar de una sesión anterior",
    cuerpo: '<div class="nota aviso">El ' + esc(fecha(rec.fecha)) + " quedaron cambios sin guardar en " + esc(donde) +
      (rec.versionBase !== versionActual ? " (sobre la versión v" + rec.versionBase + "; ahora la vigente es la v" + versionActual + ")" : "") +
      ". ¿Quieres recuperarlos?</div>",
    acciones: [{ texto:"Descartarlos", valor:false }, { texto:"Recuperarlos", clase:"primario", valor:true }]
  });
}

/**
 * Mientras se editaba se guardó otra versión (c: {n, tipo, usuario, fecha}). de: «del
 * plan», «de la carga». Devuelve true si se quiere guardar igualmente.
 * @param {{n: number, tipo?: string, usuario?: string, fecha?: string}} c
 * @param {string} de
 * @returns {Promise<boolean|null>}
 */
function confirmarConflicto(c, de){
  return preguntar({
    titulo: "Hay una versión más reciente " + de,
    cuerpo: '<div class="nota aviso">Mientras editabas se guardó la versión <b>v' + c.n + "</b>" +
      (c.tipo ? " (" + esc(c.tipo) + ", " + esc(c.usuario) + ", " + esc(fecha(c.fecha)) + ")" : "") +
      ". Si continúas, tu contenido se guardará como una versión nueva y esa versión seguirá disponible en el historial.</div>",
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Guardar de todos modos", clase:"primario", valor:true }]
  });
}

/**
 * Historial de versiones. op: {titulo, versiones, conEstado, ver, restaurar}.
 * Devuelve {ver: n}, {restaurar: n} o null.
 * @param {{titulo: string, versiones: Array<Object>, conEstado?: boolean}} op
 * @returns {Promise<{ver: number}|{restaurar: number}|null>}
 */
async function dialogoHistorial(op){
  const v = op.versiones;
  const r = await preguntar({
    titulo: op.titulo,
    cuerpo: '<div class="tabla-caja"><table><thead><tr><th>Versión</th>' + (op.conEstado ? "<th>Estado</th>" : "") +
      "<th>Tipo</th><th>Usuario</th><th>Fecha</th><th>Motivo</th></tr></thead><tbody>" +
      v.map(x => '<tr><td><span class="version">v' + x.n + "</span></td>" + (op.conEstado ? "<td>" + esc(x.estado) + "</td>" : "") +
        "<td>" + esc(x.tipo) + '</td><td class="cod">' + esc(x.usuario) + '</td><td class="cod">' + esc(fecha(x.fecha)) +
        "</td><td>" + esc(x.motivo || "—") + "</td></tr>").join("") +
      "</tbody></table></div>" +
      '<div class="campo"><label for="v-restaurar">Versión</label><select id="v-restaurar">' +
      v.slice().reverse().map(x => '<option value="' + x.n + '">v' + x.n + (op.conEstado ? " · " + esc(x.estado) : "") + " · " + esc(fecha(x.fecha)) + "</option>").join("") +
      "</select></div>" +
      (op.restaurar ? '<div class="nota">Restaurar no borra el historial: genera una versión nueva con el contenido recuperado.</div>' : ""),
    acciones: [{ texto:"Cerrar", valor:null }]
      .concat(op.ver ? [{ texto:"Ver esa versión", valor:() => ({ ver: +$("#v-restaurar").value }) }] : [])
      .concat(op.restaurar ? [{ texto:"Restaurar", clase:"primario", valor:() => ({ restaurar: +$("#v-restaurar").value }) }] : [])
  });
  return r ? r() : null;
}
</script>
