/* Iniciales del avatar a partir del correo (mfloresl@… → MF). */
function iniciales(correo){
  const local = String(correo || "").split("@")[0].replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ]/g, "");
  return (local.slice(0, 2) || "?").toUpperCase();
}

(function arrancar(){
  try {
    if (!window.SIS) {
      console.error("SIS no definido");
      return;
    }
    if (SIS.estado === "sin-instalar") return mostrar("instalar");
    if (SIS.estado !== "ok") {
      $("#denegado-titulo").textContent = SIS.estado === "error" ? "No se pudo iniciar el sistema" : "Acceso denegado";
      $("#denegado-msg").textContent = SIS.motivo || "";
      return mostrar("denegado");
    }
    const u = app.usuario || {};
    $("#u-correo").textContent = u.correo || "";
    $("#u-rol").textContent = u.rol === "director"
      ? "Director de departamento"
      : "Coordinador de carrera" + (u.carreras && u.carreras.length ? " · " + u.carreras.join(", ") : " · solo lectura");
    $("#u-avatar").textContent = iniciales(u.correo);
    $("#usuario").hidden = false;
    $("#navegacion").hidden = false;

    /* El inicio se muestra de inmediato para que la interfaz nunca quede vacía. */
    entrarInicio();

    /* La página ya trae el tablero. Si hace un rato que nadie revisa los xlsx de Drive, se
       revisan ahora de fondo, mientras el usuario está en el inicio. */
    if (SIS.tablero) {
      try {
        fijarTablero(SIS.tablero.ciclo, SIS.tablero.filas, SIS.tablero.avisos);
        if (SIS.tablero.pendiente) cargarTablero();
      } catch (errTablero) {
        console.warn("Aviso al inicializar tablero:", errTablero);
      }
    }
    iniciarPestanas();
  } catch (err) {
    console.error("Error crítico en arrancar():", err);
    mostrar("denegado");
    $("#denegado-titulo").textContent = "Error al iniciar";
    $("#denegado-msg").textContent = (err && err.message) ? err.message : String(err);
  }
})();
