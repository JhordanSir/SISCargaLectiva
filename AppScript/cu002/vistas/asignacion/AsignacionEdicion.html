<script>
"use strict";
/* ============================================================
   Asignación docente en modo de edición (CU-002 pasos 18 a 87). Cada botón de la pantalla
   llama a una de estas funciones desde el mapa de Asignacion.html. Llama a
   AsignacionEdicionServidor.js (asignacionEdicionAbrir, asignacionEdicionGuardar,
   asignacionEdicionRestaurar) y, a través de base/SesionEdicion.html, a
   base/Sesiones.js.
   ------------------------------------------------------------
   Vista: el modo de edición de #v-docentes (Asignacion.html).
   Botones: los enlaza el mapa de Asignacion.html; aquí está lo que hacen.
   Servidor: AsignacionEdicionServidor.js (asignacionEdicionAbrir, asignacionEdicionGuardar,
   asignacionEdicionRestaurar, asignacionEdicionDerivar; y asignacionEdicionRenovar,
   asignacionEdicionLiberar, asignacionEdicionGuardarCopia, asignacionEdicionDescartarCopia,
   que la sesión de base/SesionEdicion.html llama con estos nombres).
   Usa de otras pantallas: actualizarDocentesAsignados (cu001/vistas/docentes-asignados),
   para que CU-001 vea los docentes recién guardados.
   ============================================================ */
const refCarga = carrera => Dominio.REF.carga(carrera);

/* Pasos 20 y 21: el bloqueo de la carga y el contador de la sesión de edición. */
const sesionCarga = crearSesionEdicion({
  servidor: { renovar: "asignacionEdicionRenovar", liberar: "asignacionEdicionLiberar", guardarCopia: "asignacionEdicionGuardarCopia", descartarCopia: "asignacionEdicionDescartarCopia" },
  relojes: "#reloj-asignacion",
  documento: () => asignacion.editando ? { ciclo: asignacion.ciclo, ref: refCarga(asignacion.carrera) } : null,
  alPerder: correo => {   // FA-114
    asignacion.editando = false;
    marcarDocentesSucio(false);
    cargarEstadoDocentes();
    informar("Se perdió el bloqueo de edición", "Tu bloqueo caducó y ahora la carga la edita <b>" + esc(correo) +
      "</b>. Lo que no guardaste queda en la copia de recuperación: podrás recuperarlo la próxima vez que la edites.");
  },
  alExpirar: () => expirarCarga(),
  copia: () => asignacion.editando && asignacion.sucio ? { contenido: asignacion.trabajo, versionBase: asignacion.base } : null
});

/* Pasos 18 a 23 (FA-015 a FA-017): «Editar asignaciones» toma el bloqueo de la carga. */
async function editarAsignaciones(){
  const d = asignacion.datos;
  let r;
  try {
    r = await llamar("asignacionEdicionAbrir", asignacion.ciclo, asignacion.carrera, asignacion.base);
  } catch (e) {
    if (e.codigo !== "BLOQUEADO") return informarError(e);
    d.bloqueo = e.detalle;   // FA-015
    pintarVistaDocentes();
    return informar("La carga está siendo editada", "La edita <b>" + esc(e.detalle.correo) + "</b> desde las " + esc(hora(e.detalle.desde)) + ". Puedes consultarla en solo lectura.");
  }
  if (Array.isArray(r.asignaciones)) {
    d.cargas[asignacion.carrera] = Object.assign({}, d.cargas[asignacion.carrera], { version: r.version, asignaciones: r.asignaciones });
    asignacion.trabajo = clonar(r.asignaciones);
    asignacion.base = r.version;
  }
  asignacion.editando = true;
  sesionCarga.iniciar(r.expira);
  if (r.recuperacion && Array.isArray(r.recuperacion.contenido)) {   // FA-016
    const rec = await ofrecerRecuperacion(r.recuperacion, asignacion.base, "la carga de " + asignacion.carrera);
    if (rec === true) { asignacion.trabajo = r.recuperacion.contenido; marcarDocentesSucio(true); brindis("Cambios recuperados: revísalos y guarda."); }
    else if (rec === false) sesionCarga.descartarCopia(asignacion.ciclo, refCarga(asignacion.carrera));   // FA-017
  }
  pintarVistaDocentes();
}

/* Paso 82 (y FA-110): la ventana «Terminar la edición». */
function confirmarFinCarga(){
  return preguntar({
    titulo: "Terminar la edición",
    cuerpo: '<div class="nota aviso">' + (asignacion.sucio ? "Se descartarán las asignaciones que no guardaste y se liberará la carga de " + esc(asignacion.carrera) + "." : "Se liberará la carga de " + esc(asignacion.carrera) + ".") + "</div>",
    acciones: [{ texto:"Seguir editando", valor:null }, { texto:"Terminar", clase:"peligro", valor:true }]   // FA-111
  });
}

/* Pasos 84 a 86 (y FA-110 pasos 4 a 6). */
async function terminarEdicionCarga(){
  const ciclo = asignacion.ciclo, carrera = asignacion.carrera;
  sesionCarga.detener();
  asignacion.editando = false;
  if (asignacion.sucio) sesionCarga.descartarCopia(ciclo, refCarga(carrera));
  marcarDocentesSucio(false);
  await sesionCarga.liberar(ciclo, refCarga(carrera));
  if (asignacion.datos) asignacion.trabajo = clonar(asignacion.datos.cargas[carrera].asignaciones || []);
  pintarVistaDocentes();
}

/* Paso 81: «Terminar edición». */
async function pulsarTerminarEdicion(){
  if (await confirmarFinCarga()) terminarEdicionCarga();
}

/* FA-112 y FA-113: pasó el tiempo sin actividad; se guarda lo pendiente como una versión nueva y se suelta la carga. */
async function expirarCarga(){
  if (!asignacion.editando) return;
  let texto = "No había cambios sin guardar.";
  if (asignacion.sucio) {
    try {
      const r = await llamar("asignacionEdicionGuardar", asignacion.ciclo, asignacion.carrera, { asignaciones: limpiarParaGuardar(), versionBase: asignacion.base, tipo: Dominio.TIPO_VERSION.AUTOGUARDADO, forzar: true });
      fijarGuardado(r);
      texto = "Los cambios se guardaron como la versión v" + r.version + ".";
    } catch (e) {
      texto = "No se pudieron guardar (" + ((e && e.message) || e) + "). Quedan en la copia de recuperación: al volver a editar podrás recuperarlos.";
    }
  }
  asignacion.editando = false;
  marcarDocentesSucio(false);
  await sesionCarga.liberar(asignacion.ciclo, refCarga(asignacion.carrera));
  pintarVistaDocentes();
  await informar("La sesión de edición ha expirado", "Transcurrieron " + CONFIG.minutosBloqueo + " minutos sin actividad. " + esc(texto));
}

/* ============================================================
   Cambios sobre la carga (en el navegador, hasta «Guardar asignaciones»)
   ============================================================ */
function cambiado(mensaje){
  marcarDocentesSucio(true);
  pintarVistaDocentes();
  if (mensaje) brindis(mensaje);
}

/* Asignaciones de la carga en edición que pertenecen a una sección (por su grupo o su fusión). */
function propiasDe(seccion){
  const idx = asignacion.balance.vigentes.idx;
  return asignacion.trabajo.filter(a => { const v = Dominio.unidadDe(idx, a); return v && v.id === seccion.id; });
}
const fotoUnidad = seccion => ({ unidad: seccion.id, fusion: seccion.fusion || null, carrera: seccion.carrera, codigo: seccion.codigo, asignatura: seccion.nombre, n: seccion.n, sem: seccion.sem });

/* Lista de docentes del catálogo, con primero los del departamento del director (FA-001 paso 2). */
function datalistDocentes(id){
  const dptoPreferido = miDpto() || Dominio.dptoDeCarrera(asignacion.carrera);
  const cat = (asignacion.datos.catalogo || []).slice().sort((a, b) =>
    (a.dpto === dptoPreferido ? 0 : 1) - (b.dpto === dptoPreferido ? 0 : 1) || a.nombreCompleto.localeCompare(b.nombreCompleto));
  return '<datalist id="' + id + '">' + cat.map(c => '<option value="' + esc(c.nombreCompleto) + '">' + esc((c.dpto || "—") + " · " + (c.dedicacion || "") + " · " + (c.condicion || "")) + "</option>").join("") + "</datalist>";
}
/* FA-001 paso 6 y FA-056: el nombre escrito se resuelve contra el catálogo; si no está, se acepta tal cual. */
function resolverDocente(texto){
  const t = String(texto || "").trim();
  if (!t) return null;
  const c = catalogoPorNombre().get(Dominio.claveDocente(t));
  return c ? { docente: c.nombreCompleto, dni: c.dni } : { docente: t, dni: "" };
}

/* FA-001 y FA-048 a FA-060: la ventana «Asignar docentes a la sección»: por cada
   componente, uno o más docentes con sus horas. */
async function asignarSeccion(seccion){
  if (!seccion) return;
  const vig = asignacion.balance.vigentes;
  const actuales = vig.porUnidad.get(seccion.id) || [];
  const pendienteIntl = actuales.some(Dominio.esPendienteInternacional);
  const filaDoc = (c, a, i) => '<div class="fila-campos" data-fila="' + c.c + '">' +
    '<div class="campo"><label>' + (i ? "Otro docente" : "Docente") + '</label><input type="text" list="dl-docentes" data-doc value="' + esc(a ? a.docente : "") + '" placeholder="Apellidos, nombres"></div>' +
    '<div class="campo"><label>Horas</label><input type="number" min="0" step="0.5" data-horas value="' + esc(a && a.horas != null && a.horas !== "" ? a.horas : c.horas) + '"></div></div>';
  const bloquesComp = seccion.componentes.map(c => {
    const de = actuales.filter(a => a.componente === c.c && String(a.docente || "").trim());
    return '<fieldset class="tarjeta p-4 mt-3" data-comp="' + c.c + '"><legend class="text-sm font-bold">' + esc(c.nombre) + " · " + c.horas + " h</legend>" +
      '<div data-filas="' + c.c + '">' + (de.length ? de : [null]).map((a, i) => filaDoc(c, a, i)).join("") + "</div>" +
      '<button type="button" class="btn btn-sm mt-1" data-otro="' + c.c + '">' + icono("plus") + "Otro docente en este componente</button></fieldset>";
  }).join("");
  const p = preguntar({
    titulo: "Asignar docentes a la sección",
    cuerpo: fichaUnidad(seccion) + datalistDocentes("dl-docentes") +
      (seccion.componentes.length > 1 ? '<div class="fila-campos mt-3"><div class="campo"><label for="dlg-todo">Un docente para toda la sección</label><input type="text" id="dlg-todo" list="dl-docentes" placeholder="Apellidos, nombres"></div>' +
        '<div class="campo"><label>&nbsp;</label><button type="button" class="btn btn-sm" id="dlg-aplicar-todo">' + icono("check") + "Ponerlo en todos los componentes</button></div></div>" : "") +
      bloquesComp +
      (seccion.intl ? '<div class="campo mt-3"><label class="casilla"><input type="checkbox" id="dlg-intl"' + (pendienteIntl ? " checked" : "") + '>Reservar como <b>pendiente internacional</b>: cubre el curso sin docente ni horas hasta que se contrate</label></div>' : "") +
      '<div class="nota mt-3">Si varios docentes comparten un componente, reparte sus horas: el sistema avisa si no suman las del componente. Puedes elegir docentes de otros departamentos o escribir uno que no esté en el catálogo.</div>',
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Guardar en la carga", clase:"primario", valor:() => leerVentana() }]   // FA-060
  });
  const cuerpo = $("#dlg-cuerpo");
  /* FA-053: «Otro docente en este componente», con las horas que faltan. */
  cuerpo.querySelectorAll("[data-otro]").forEach(b => { b.onclick = () => {
    const c = seccion.componentes.find(x => x.c === b.dataset.otro);
    const cont = cuerpo.querySelector('[data-filas="' + c.c + '"]');
    const usadas = [...cont.querySelectorAll("[data-horas]")].reduce((s, i) => s + num(i.value), 0);
    cont.insertAdjacentHTML("beforeend", filaDoc(c, { docente: "", horas: Math.max(0, c.horas - usadas) }, 1));
  }; });
  /* FA-052: «Ponerlo en todos los componentes». */
  const todo = $("#dlg-aplicar-todo");
  if (todo) todo.onclick = () => {
    const v = $("#dlg-todo").value;
    cuerpo.querySelectorAll("[data-filas]").forEach(cont => { const i = cont.querySelector("[data-doc]"); if (i) i.value = v; });
  };
  function leerVentana(){
    const filas = [];
    cuerpo.querySelectorAll("[data-fila]").forEach(f => filas.push({ c: f.dataset.fila, docente: f.querySelector("[data-doc]").value.trim(), horas: f.querySelector("[data-horas]").value }));
    return { filas: filas, intl: !!($("#dlg-intl") && $("#dlg-intl").checked) };
  }
  const r = await p;
  if (!r) return;
  const { filas, intl } = r();
  const previas = propiasDe(seccion);
  const base = fotoUnidad(seccion);
  const nuevas = [];
  if (intl) {   // FA-058
    seccion.componentes.forEach(c => nuevas.push(Object.assign({ id: nuevoId(), componente: c.c, docente: "", dni: "", horas: null, condicion: Dominio.PENDIENTE_INTERNACIONAL }, base)));
  } else {   // FA-001 pasos 6 a 8 (FA-054, FA-056, FA-057)
    seccion.componentes.forEach(c => {
      const de = filas.filter(f => f.c === c.c && f.docente);
      de.forEach(f => {
        const d = resolverDocente(f.docente);
        const h = num(f.horas);
        const previa = previas.find(a => a.componente === c.c && Dominio.claveDocente(a.docente) === Dominio.claveDocente(d.docente));
        const reg = Object.assign({ id: previa ? previa.id : nuevoId(), componente: c.c, docente: d.docente, dni: d.dni,
          horas: de.length === 1 && Math.abs(h - c.horas) < 0.001 ? null : h, condicion: "" }, base);
        if (previa && previa.historial) reg.historial = previa.historial;
        if (previa && previa.reemplazo) reg.reemplazo = previa.reemplazo;
        if (previas.some(a => a.componente === c.c && Dominio.esPendienteInternacional(a)))
          reg.historial = (reg.historial || []).concat([{ tipo: "regularización", antes: "Pendiente internacional", fecha: Dominio.isoPeru(), usuario: app.usuario.correo }]);
        nuevas.push(reg);
      });
    });
  }
  const ids = new Set(previas.map(a => a.id));
  asignacion.trabajo = asignacion.trabajo.filter(a => !ids.has(a.id) && !previas.includes(a)).concat(nuevas);
  cambiado(nuevas.length ? "Sección actualizada en la carga." : "Se quitaron los docentes de la sección.");   // FA-059
}

function fichaUnidad(seccion){
  return '<div class="ficha"><b>' + seccion.miembros.map(m => esc(m.carrera) + " · sem. " + esc(m.sem) + " · " + esc(m.codigo) + " (grupo " + esc(m.n) + ")").join("<br>") + "</b><br>" +
    esc(seccion.nombre) + (seccion.miembros.length > 1 ? " · <b>sección fusionada</b>" : "") + "<br>" +
    '<span class="tenue">Horas: ' + seccion.ht + " HT + " + seccion.hp + " HP" + (seccion.desdoble ? " · desdoble " + esc(seccion.desdoble) : "") + "</span></div>";
}

/* FA-002 y FA-061 a FA-065: reemplazo. El sustituto toma el componente entero desde la
   fecha de efectividad; el titular queda en el historial de la asignación. */
async function reemplazarAsignaciones(asigs, titulo){
  if (!asigs.length) return brindis("No hay asignaciones que reemplazar.", "aviso");
  const hoy = Dominio.isoPeru().slice(0, 10);   // fecha de hoy en Perú
  const r = await preguntar({
    titulo: titulo,
    cuerpo: datalistDocentes("dl-sust") +
      '<div class="campo"><label>Cursos que pasan al sustituto</label>' + asigs.map((a, i) => {
        const seccion = seccionPorId((Dominio.unidadDe(asignacion.balance.vigentes.idx, a) || {}).id);
        return '<label class="casilla"><input type="checkbox" data-reemp="' + i + '" checked>' + esc(a.docente) + " · " + esc(a.carrera) + " " + esc(a.codigo) +
          " G" + esc(a.n) + " · " + esc(seccion ? nombreComp(seccion, a.componente) : a.componente) + "</label>";
      }).join("") + "</div>" +
      '<div class="campo"><label for="dlg-sust">Docente sustituto</label><input type="text" id="dlg-sust" list="dl-sust" placeholder="Apellidos, nombres"></div>' +
      '<div class="fila-campos"><div class="campo"><label for="dlg-motivo">Motivo</label><select id="dlg-motivo">' +
        ["Licencia médica", "Licencia por maternidad", "Salud", "Cruce horario", "Renuncia", "Otro"].map(m => "<option>" + m + "</option>").join("") +
      '</select></div><div class="campo"><label for="dlg-fecha">Fecha de efectividad</label><input type="text" id="dlg-fecha" value="' + hoy + '" placeholder="AAAA-MM-DD"></div></div>' +
      '<div class="campo"><label for="dlg-motivo-otro">Detalle del motivo (opcional)</label><input type="text" id="dlg-motivo-otro"></div>',
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Confirmar reemplazo", clase:"primario", valor:() => ({
      marcados: [...$("#dlg-cuerpo").querySelectorAll("[data-reemp]")].filter(c => c.checked).map(c => +c.dataset.reemp),
      sustituto: $("#dlg-sust").value, motivo: $("#dlg-motivo").value, detalle: $("#dlg-motivo-otro").value.trim(), fecha: $("#dlg-fecha").value.trim()
    }) }]
  });
  if (!r) return;   // FA-065
  const v = r();
  const d = resolverDocente(v.sustituto);
  if (!d) return brindis("Elige o escribe el docente sustituto.", "aviso");   // FA-061
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.fecha)) return brindis("Escribe la fecha de efectividad como AAAA-MM-DD.", "aviso");   // FA-062
  if (!v.marcados.length) return brindis("Marca al menos un curso.", "aviso");   // FA-063
  if (v.marcados.every(i => Dominio.claveDocente(asigs[i].docente) === Dominio.claveDocente(d.docente)))
    return brindis("El sustituto es el mismo docente que ya dicta esos cursos.", "aviso");   // FA-064
  const motivo = v.motivo + (v.detalle ? ": " + v.detalle : "");
  v.marcados.forEach(i => {
    if (Dominio.claveDocente(asigs[i].docente) === Dominio.claveDocente(d.docente)) return;
    const a = (asigs[i].id && asignacion.trabajo.find(x => x.id === asigs[i].id)) || asigs[i];
    if (!asignacion.trabajo.includes(a)) asignacion.trabajo.push(a);   // una heredada pasa a esta carga
    delete a.heredada; delete a.cargaDe;
    a.historial = (a.historial || []).concat([{ tipo: "reemplazo", docente: a.docente, dni: a.dni || "", hasta: v.fecha, motivo: motivo, fecha: Dominio.isoPeru(), usuario: app.usuario.correo }]);
    a.reemplazo = { de: a.docente, motivo: motivo, desde: v.fecha };
    a.docente = d.docente; a.dni = d.dni;
  });
  cambiado("Reemplazo registrado: " + d.docente + " desde " + v.fecha + ".");
}

const conDocente = l => l.filter(a => String(a.docente || "").trim());

/* FA-002: «Reemplazar» en una sección con docente. */
function reemplazarEnSeccion(seccion){
  if (!seccion) return;
  return reemplazarAsignaciones(conDocente(asignacion.balance.vigentes.porUnidad.get(seccion.id) || []), "Reemplazar docente en " + seccion.codigo);
}

/* FA-074: «Reemplazar» en un docente de la vista por docente. */
function reemplazarDocente(nombre){
  const suyas = [];
  asignacion.balance.vigentes.porUnidad.forEach((l, id) => {
    const s = seccionPorId(id);
    if (!s || s.carrera !== asignacion.carrera || !meToca(s)) return;
    l.forEach(a => { if (Dominio.claveDocente(a.docente) === Dominio.claveDocente(nombre)) suyas.push(a); });
  });
  return reemplazarAsignaciones(suyas, "Reemplazar a " + nombre);
}

/* FA-071 a FA-073: asigna a un docente un componente de una sección que aún no tiene docente. */
async function asignarADocente(nombre){
  const vig = asignacion.balance.vigentes;
  const libres = [];
  seccionesMias().forEach(seccion => Dominio.coberturaUnidad(seccion, vig.porUnidad.get(seccion.id)).forEach(c => { if (!c.cubierto) libres.push({ seccion: seccion, c: c }); }));
  if (!libres.length) return brindis("Todas las secciones que asignas en " + asignacion.carrera + " tienen docente.", "info");   // FA-072
  const r = await preguntar({
    titulo: "Asignar un curso a " + nombre,
    cuerpo: '<div class="campo"><label for="dlg-libre">Sección y componente sin docente</label><select id="dlg-libre">' +
      libres.map((x, i) => '<option value="' + i + '">' + esc(x.seccion.miembros.map(m => m.carrera).join("+") + " · " + x.seccion.codigo + " " + x.seccion.nombre + " · G" + x.seccion.n + " · " + x.c.nombre + " (" + x.c.horas + " h)") + "</option>").join("") +
      "</select></div>",
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Asignar", clase:"primario", valor:() => $("#dlg-libre").value }]   // FA-073
  });
  if (!r) return;
  const x = libres[parseInt(r(), 10)];
  const d = resolverDocente(nombre);
  asignacion.trabajo = asignacion.trabajo.filter(a => !(a.componente === x.c.c && propiasDe(x.seccion).includes(a) && Dominio.esPendienteInternacional(a)));
  asignacion.trabajo.push(Object.assign({ id: nuevoId(), componente: x.c.c, docente: d.docente, dni: d.dni, horas: null, condicion: "" }, fotoUnidad(x.seccion)));
  cambiado(x.seccion.codigo + " · " + x.c.nombre + " asignado a " + d.docente + ".");
}

/* FA-075 a FA-077: reasignar a una sección una asignación que se quedó sin sección. */
async function reasignarSinSeccion(a){
  if (!a) return;
  const opciones = [];
  seccionesMias().forEach(seccion => seccion.componentes.forEach(c => opciones.push({ seccion: seccion, c: c })));
  if (!opciones.length) return brindis("No asignas ninguna sección de " + asignacion.carrera + " en el ciclo.", "aviso");   // FA-076
  const r = await preguntar({
    titulo: "Reasignar a una sección",
    cuerpo: '<div class="ficha"><b>' + esc(a.docente || "—") + "</b> · " + esc(a.carrera || "") + " " + esc(a.codigo || "") + " " + esc(a.asignatura || "") + "</div>" +
      '<div class="campo"><label for="dlg-destino">Sección y componente</label><select id="dlg-destino">' +
      opciones.map((x, i) => '<option value="' + i + '">' + esc(x.seccion.miembros.map(m => m.carrera).join("+") + " · " + x.seccion.codigo + " " + x.seccion.nombre + " · G" + x.seccion.n + " · " + x.c.nombre) + "</option>").join("") +
      "</select></div>",
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Reasignar", clase:"primario", valor:() => $("#dlg-destino").value }]   // FA-077
  });
  if (!r) return;
  const x = opciones[parseInt(r(), 10)];
  Object.assign(a, fotoUnidad(x.seccion), { componente: x.c.c, nota: "" });
  cambiado("Asignación reasignada a " + x.seccion.codigo + ".");
}

/* FA-078: quitar una asignación sin sección. */
function quitarSinSeccion(a){
  if (!a) return;
  asignacion.trabajo = asignacion.trabajo.filter(x => x !== a);
  cambiado("Asignación quitada.");
}

/* FA-079 a FA-083: el director deriva una sección a otro departamento, que pasa a
   asignarla (base/Derivacion.html). Sus docentes asignados la siguen. */
async function derivarSeccion(seccion){
  if (!seccion) return;
  if (asignacion.sucio) return brindis("Guarda o descarta primero los cambios de la carga.", "aviso");   // FA-081
  const p = seccion.miembros.find(m => m.grupoId === seccion.id) || seccion.miembros[0];
  const res = await derivarCurso({
    servidor: "asignacionEdicionDerivar",
    ciclo: asignacion.ciclo, sig: p.carrera, grupoId: p.grupoId, codigo: seccion.codigo, actual: seccion.dpto,
    descripcion: seccion.codigo + " " + seccion.nombre + (seccion.miembros.length > 1 ? " (se deriva la asignatura del grupo principal, " + p.carrera + ")" : "")
  });
  if (!res) return;
  if (asignacion.editando) {   // FA-079 paso 11: se recargan las secciones conservando lo que se está editando
    const trabajo = asignacion.trabajo, base = asignacion.base, sucio = asignacion.sucio;
    asignacion.editando = false;
    await cargarEstadoDocentes();
    Object.assign(asignacion, { trabajo: trabajo, base: base, editando: true });
    marcarDocentesSucio(sucio);
    pintarVistaDocentes();
  } else cargarEstadoDocentes();
}

/* ============================================================
   Guardado y restauración
   ============================================================ */
const limpiarParaGuardar = () => asignacion.trabajo.map(a => {
  const x = Object.assign({}, a);
  delete x.heredada; delete x.cargaDe;
  if (!x.id) x.id = nuevoId();
  return x;
});

/* Pasos 76 a 80: lo que queda tras guardar. */
function fijarGuardado(r){
  const d = asignacion.datos;
  d.cargas[asignacion.carrera] = { version: r.version, asignaciones: r.asignaciones, usuario: app.usuario.correo, fecha: r.fecha };
  asignacion.trabajo = clonar(r.asignaciones);
  asignacion.base = r.version;
  sesionCarga.olvidarCopia();
  sesionCarga.renovada(r.expira);
  d.avisos = (d.avisos || []).filter(a => a.tipo !== "PLAN_CAMBIADO");
  marcarDocentesSucio(false);
  anunciar("asignaciones", { ciclo: asignacion.ciclo, carrera: asignacion.carrera });
  if (asignacion.ciclo === app.ciclo) actualizarDocentesAsignados();
}

/* Pasos 61 a 80 «Guardar asignaciones», con FA-103 a FA-109. */
async function guardarAsignaciones(){
  const d = asignacion.datos;
  const antes = Dominio.calcularBalance(d.catalogo, d.unidades, Object.assign(cargasActuales(), { [asignacion.carrera]: d.cargas[asignacion.carrera].asignaciones || [] }));
  const despues = calcular();
  const exc = Dominio.excesosAlGuardar(antes, despues);
  if (exc.bloqueos.length) return informarError(new Error("No se puede guardar: " + exc.bloqueos.map(x => x.docente + " (" + x.horas + " h)").join(", ") +
    " superaría las " + Dominio.LIMITES.MAXIMO + " h lectivas semanales (A07). Quita o reparte su carga."));   // FA-103

  const vig = despues.vigentes;
  let pendientes = 0;
  seccionesMias().forEach(seccion => Dominio.coberturaUnidad(seccion, vig.porUnidad.get(seccion.id)).forEach(c => { if (!c.cubierto) pendientes++; }));
  const advs = [];
  despues.docentes.filter(x => x.cursos.some(c => c.carrera === asignacion.carrera)).forEach(x => x.advertencias.forEach(a => { if (a.nivel !== "info") advs.push(x.nombre + " · " + a.codigo + ": " + a.mensaje); }));
  const r = await preguntar({   // paso 65
    titulo: "Guardar la carga de " + asignacion.carrera,
    cuerpo: '<p class="ficha">Se guardará una versión nueva de la carga de <b>' + esc(asignacion.carrera) + "</b> en <b>" + esc(asignacion.ciclo) + "</b>.</p>" +
      (pendientes ? '<div class="nota aviso"><b>A13</b> · Quedan ' + pendientes + " componentes sin docente. Puedes guardar el avance.</div>" : "") +   // FA-106
      (advs.length ? '<div class="nota aviso">Advertencias vigentes (no impiden guardar):</div><ul class="lista-err lista-adv">' + advs.map(a => "<li><span>" + esc(a) + "</span></li>").join("") + "</ul>" : "") +
      (exc.severos.length ? '<div class="nota error"><b>A12</b> · ' + exc.severos.map(x => esc(x.docente) + " (" + x.horas + " h, " + esc(x.cargo) + ")").join(", ") +   // FA-104
        " tiene cargo administrativo y pasa de " + Dominio.LIMITES.CARGO_SEVERO + " h. Justifícalo para poder guardar.</div>" +
        '<div class="campo"><label for="dlg-exceso">Motivo del exceso (obligatorio)</label><input type="text" id="dlg-exceso"></div>' : "") +
      '<div class="campo"><label for="dlg-motivo-carga">Comentario (opcional)</label><input type="text" id="dlg-motivo-carga"></div>',
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Confirmar y guardar", clase:"primario", valor:() => ({   // FA-107
      motivo: $("#dlg-motivo-carga").value.trim(), exceso: $("#dlg-exceso") ? $("#dlg-exceso").value.trim() : "" }) }]
  });
  if (!r) return;
  const v = r();
  if (exc.severos.length && !v.exceso) return brindis("Escribe el motivo del exceso de carga.", "aviso");   // FA-105
  const datos = { asignaciones: limpiarParaGuardar(), versionBase: asignacion.base, motivo: v.motivo, motivoExceso: v.exceso };
  try {
    let res;
    try {
      res = await llamar("asignacionEdicionGuardar", asignacion.ciclo, asignacion.carrera, datos);
    } catch (e) {
      if (e.codigo !== "CONFLICTO") throw e;
      if (!await confirmarConflicto(e.detalle, "de la carga")) return;   // FA-108, FA-109
      res = await llamar("asignacionEdicionGuardar", asignacion.ciclo, asignacion.carrera, Object.assign(datos, { forzar: true }));
    }
    fijarGuardado(res);
    pintarVistaDocentes();
    brindis("Carga guardada como v" + res.version + ".");
  } catch (e) { informarError(e); }
}

/* FA-087 a FA-089: restaura una versión de la carga (desde el historial, en modo de edición). */
async function restaurarVersionCarga(n){
  if (asignacion.sucio) {   // FA-088
    const ok = await preguntar({ titulo: "Restaurar versión", cuerpo: '<div class="nota aviso">Se descartarán los cambios que no guardaste.</div>',
      acciones: [{ texto:"Cancelar", valor:null }, { texto:"Restaurar", clase:"primario", valor:true }] });   // FA-089
    if (!ok) return;
  }
  try {
    const res = await llamar("asignacionEdicionRestaurar", asignacion.ciclo, asignacion.carrera, n);
    fijarGuardado(res);
    pintarVistaDocentes();
    brindis("Versión v" + n + " restaurada como v" + res.version + ".");
  } catch (e) { informarError(e); }
}
</script>
