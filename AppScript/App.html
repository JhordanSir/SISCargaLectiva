<script>
"use strict";

/* ============================================================
   Configuración y datos maestros (llegan del servidor en SIS y Dominio)
   ============================================================ */
const CONFIG = SIS.config;
const { CARRERAS, DPTOS, ESTADOS, num, th, totales, matrizDesdeTexto, ubicarCabeceras, interpretar, nombreCarrera } = Dominio;

/* ============================================================
   Estado de la página
   ============================================================ */
const app = {
  usuario: SIS.usuario || null,   // {correo, rol, carreras}
  ciclo: CONFIG.ciclo,
  tablero: [],                    // filas del tablero, con el contenido vigente de cada plan
  tableroCiclo: null,             // ciclo al que pertenecen esas filas
  tableroHora: 0,                 // cuándo se leyeron; 0 = hay que volver a leerlas
  tableroPedido: 0,               // descarta las respuestas que llegan tarde
  carrera: null,                  // sigla del plan en edición
  plan: null,                     // {estado, version, asignaturas, sucio, confirmado}
  seleccion: null,                // {ci, gi}
  colapsados: new Set(),
  matrizPegada: null,             // contenido pegado, ya dividido en filas y columnas
  avisoImportacion: "",
  vista: null
};

/* Bloqueo de edición: la hora de caducidad la fija el servidor y el latido la renueva. */
const edicion = { expira: 0, temporizador: null, ultimoLatido: 0, pedido: 0 };

/* El tablero se vuelve a pedir si sus datos tienen más de esto. */
const VIGENCIA_TABLERO_MS = 15000;

/* ============================================================
   Utilidades
   ============================================================ */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fecha = iso => { const d = new Date(iso); return isNaN(d) ? String(iso || "") : d.toLocaleString("es-PE", { dateStyle:"short", timeStyle:"short" }); };
const hora = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("es-PE", { hour:"2-digit", minute:"2-digit" }); };
const clonar = x => JSON.parse(JSON.stringify(x));
const alPulsar = (s, fn) => { const el = $(s); if (el) el.onclick = fn; };
const alCambiar = (s, fn) => { const el = $(s); if (el) el.onchange = fn; };

const VISTAS = ["instalar","denegado","menu","planes","carga","pegado","grilla","lectura","exito","docentes","docentes-carga"];
function mostrar(v){
  const cambia = app.vista !== v;
  VISTAS.forEach(x => {
    const el = $("#v-" + x);
    if (el) el.hidden = (x !== v);
  });
  app.vista = v;
  if (cambia) window.scrollTo({ top:0, behavior:"instant" });
}

function aviso(texto){
  const d = document.createElement("div");
  d.textContent = texto;
  $("#brindis").appendChild(d);
  setTimeout(() => d.remove(), 3400);
}

/* Diálogo genérico. acciones: [{texto, clase, valor}]. Devuelve una promesa.
   Una pregunta nueva sustituye a la que esté abierta, que se resuelve con null. */
const dlg = $("#dlg");
let terminarPregunta = null;
function preguntar({ titulo, cuerpo, acciones }){
  if (terminarPregunta) terminarPregunta(null);
  return new Promise(resolve => {
    let resuelto = false;
    /* El evento close llega después de cerrar; si para entonces ya se abrió otra
       pregunta, pertenece a la anterior y se ignora. */
    const alCerrar = () => { if (!dlg.open) terminar(null); };
    function terminar(v){
      if (resuelto) return;
      resuelto = true;
      dlg.removeEventListener("close", alCerrar);
      if (terminarPregunta === terminar) terminarPregunta = null;
      resolve(v);
    }
    terminarPregunta = terminar;

    $("#dlg-titulo").textContent = titulo;
    $("#dlg-cuerpo").innerHTML = cuerpo;
    const pie = $("#dlg-pie");
    pie.innerHTML = "";
    acciones.forEach(a => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn " + (a.clase || "");
      b.textContent = a.texto;
      /* Se resuelve antes de cerrar: el contenido sigue en el DOM, de modo que
         un «valor» que sea función pueda leer los campos del formulario. */
      b.onclick = () => { terminar(a.valor); dlg.close(); };
      pie.appendChild(b);
    });
    dlg.addEventListener("close", alCerrar);
    if (!dlg.open) dlg.showModal();
  });
}
dlg.addEventListener("cancel", e => { e.preventDefault(); dlg.close(); });

/* ============================================================
   Llamadas al servidor
   ============================================================ */
/* Tres modos: «bloquea» muestra la barra de actividad e impide pulsar mientras tanto;
   «fondo» solo muestra la barra; «silencio» no muestra nada. */
const pendientes = { bloquea: 0, fondo: 0 };
function pintarActividad(){
  $("#cargando").hidden = !(pendientes.bloquea + pendientes.fondo);
  document.body.classList.toggle("ocupado", pendientes.bloquea > 0);
}
function invocar(nombre, args, modo){
  const visible = modo !== "silencio";
  if (visible) { pendientes[modo]++; pintarActividad(); }
  return new Promise((ok, mal) => {
    const fin = () => {
      if (!visible) return;
      pendientes[modo] = Math.max(0, pendientes[modo] - 1);
      pintarActividad();
    };
    google.script.run
      .withSuccessHandler(r => { fin(); ok(r); })
      .withFailureHandler(e => { fin(); mal(e); })[nombre](...args);
  });
}
const llamar = (nombre, ...args) => invocar(nombre, args, "bloquea");
const llamarDeFondo = (nombre, ...args) => invocar(nombre, args, "fondo");
const llamarEnSilencio = (nombre, ...args) => invocar(nombre, args, "silencio");

function informarError(e){
  return preguntar({
    titulo: "No se pudo completar la operación",
    cuerpo: '<div class="nota error">' + esc((e && e.message) || e) + "</div>",
    acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
  });
}

/* ============================================================
   Bloqueo de edición
   ============================================================ */
function iniciarReloj(expira){
  edicion.expira = Date.parse(expira);
  edicion.ultimoLatido = Date.now();
  clearInterval(edicion.temporizador);
  edicion.temporizador = setInterval(tic, 1000);
  pintarReloj();
}
function detenerReloj(){
  clearInterval(edicion.temporizador); edicion.temporizador = null;
  $$(".reloj").forEach(e => e.textContent = "");
}
const quedan = () => Math.max(0, Math.ceil((edicion.expira - Date.now()) / 1000));

function tic(){
  pintarReloj();
  if (Date.now() >= edicion.expira) expirar();
}
function pintarReloj(){
  const q = quedan(), m = Math.floor(q / 60), s = q % 60;
  const txt = "Sesión de edición: " + m + ":" + String(s).padStart(2, "0");
  $$(".reloj").forEach(e => {
    e.textContent = txt;
    e.classList.toggle("poco", q <= 60);
  });
}

/* La actividad renueva el bloqueo en el servidor, como mucho una vez por minuto. */
async function latido(){
  if (!edicion.temporizador || !app.carrera) return;
  const intervalo = Math.min(60000, CONFIG.minutosBloqueo * 15000);
  if (Date.now() - edicion.ultimoLatido < intervalo) return;
  edicion.ultimoLatido = Date.now();
  const sig = app.carrera;
  try {
    const r = await llamarEnSilencio("renovarBloqueo", app.ciclo, sig);
    if (app.carrera !== sig || !edicion.temporizador) return;
    if (r.perdido) return bloqueoPerdido(r.perdido.correo);
    edicion.expira = Date.parse(r.expira);
    pintarReloj();
  } catch (e) {
    /* Si falla, la siguiente actividad lo vuelve a intentar. */
  }
}

async function bloqueoPerdido(correo){
  detenerReloj();
  app.carrera = null; app.plan = null; app.seleccion = null;
  app.tableroHora = 0;
  mostrarTablero();
  await preguntar({
    titulo: "Se perdió el bloqueo de edición",
    cuerpo: '<div class="nota aviso">Tu bloqueo caducó y ahora el plan lo está editando <b>' + esc(correo) +
            "</b>. Los cambios que no habías guardado no se pudieron conservar.</div>",
    acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
  });
}

async function expirar(){
  if (!edicion.temporizador) return;
  detenerReloj();
  const sig = app.carrera, p = app.plan;
  let resultado = "sin cambios";
  if (p && p.sucio && p.asignaturas.length) {
    try {
      const r = await llamar("guardarPlan", app.ciclo, sig, {
        asignaturas: p.asignaturas, versionBase: p.version, forzar: true, tipo: "autoguardado",
        estado: p.estado === ESTADOS.REGISTRADO ? ESTADOS.REGISTRADO : ESTADOS.BORRADOR
      });
      actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(p.asignaturas), contenido: clonar(p.asignaturas) });
      resultado = "guardado";
    } catch (e) {
      resultado = (e && e.message) || String(e);
    }
  }
  try { await llamarEnSilencio("liberarBloqueo", app.ciclo, sig); } catch (e) { /* caduca solo */ }
  app.carrera = null; app.plan = null; app.seleccion = null;
  app.tableroHora = 0;
  mostrarTablero();
  const texto = resultado === "guardado"
    ? "Los cambios sin guardar se almacenaron como una nueva versión y se liberó el bloqueo del plan."
    : resultado === "sin cambios"
      ? "No había cambios sin guardar. Se liberó el bloqueo del plan."
      : "No se pudieron guardar los cambios: " + resultado;
  await preguntar({
    titulo: "La sesión de edición ha expirado",
    cuerpo: '<div class="nota aviso">Transcurrieron ' + CONFIG.minutosBloqueo + " minutos sin actividad. " + esc(texto) + "</div>",
    acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
  });
}

/* Libera el bloqueo y vuelve al tablero, descartando lo no guardado. */
async function terminarEdicion(){
  const sig = app.carrera, confirmado = !!(app.plan && app.plan.confirmado);
  detenerReloj();
  app.carrera = null; app.plan = null; app.seleccion = null;
  pintarTablero();
  mostrar("planes");
  /* Si el bloqueo aún no estaba confirmado, lo devuelve abrirEdicion cuando responda. */
  if (sig && confirmado) { try { await llamarEnSilencio("liberarBloqueo", app.ciclo, sig); } catch (e) { /* caduca solo */ } }
  cargarTablero();
}

["click","keydown"].forEach(ev => document.addEventListener(ev, latido, { passive:true }));
window.addEventListener("pagehide", () => {
  if (edicion.temporizador && app.carrera) google.script.run.liberarBloqueo(app.ciclo, app.carrera);
});

/* ============================================================
   Vistas
   ============================================================ */
$("#op-planes").onclick = () => mostrarTablero();

$$("[data-volver]").forEach(b => { b.onclick = () => {
  const destino = b.dataset.volver;
  if (destino === "planes") mostrarTablero();
  else mostrar(destino);
}; });

$("#sel-ciclo").innerHTML = CONFIG.ciclos.map(c => "<option" + (c === app.ciclo ? " selected" : "") + ">" + esc(c) + "</option>").join("");
$("#sel-ciclo").onchange = e => { app.ciclo = e.target.value; mostrarTablero(); };
$("#btn-releer").onclick = () => cargarTablero({ releer: true });

/* ---------- tablero ---------- */
/* Las filas del tablero traen el contenido vigente de cada plan, así que consultar un plan
   o empezar a editarlo no espera al servidor. Se muestra lo que haya y, si ya tiene unos
   segundos, se vuelve a leer de fondo. */
const tableroAlDia = () => app.tableroCiclo === app.ciclo && Date.now() - app.tableroHora < VIGENCIA_TABLERO_MS;
const filaTablero = sig => app.tableroCiclo === app.ciclo ? app.tablero.find(f => f.sig === sig) || null : null;
const bloqueoVigente = b => b && Date.parse(b.expira) > Date.now() ? b : null;

function mostrarTablero(){
  pintarTablero();
  mostrar("planes");
  if (!tableroAlDia()) cargarTablero();
}

async function cargarTablero(opciones){
  const ciclo = app.ciclo, pedido = ++app.tableroPedido;
  const releer = !!(opciones && opciones.releer);
  try {
    const r = await (releer ? llamar : llamarDeFondo)("obtenerTablero", ciclo, { releer: releer });
    if (pedido !== app.tableroPedido || ciclo !== app.ciclo) return;
    fijarTablero(ciclo, r.filas, r.avisos);
    if (releer) aviso("Excel revisado");
  } catch (e) {
    if (pedido === app.tableroPedido) informarError(e);
  }
}

function fijarTablero(ciclo, filas, avisos){
  app.tablero = filas;
  app.tableroCiclo = ciclo;
  app.tableroHora = Date.now();
  const lista = avisos || [];
  $("#avisos-tablero").innerHTML = lista.map(a => '<div class="nota aviso">' + esc(a) + "</div>").join("");
  $("#avisos-tablero").hidden = !lista.length;
  pintarTablero();
}

/* Tras guardar, la fila del plan se actualiza aquí mismo. La próxima vez que se muestre
   el tablero se vuelve a leer, y las lecturas que ya estaban en camino se descartan. */
function actualizarFilaTablero(sig, cambios){
  app.tableroPedido++;
  app.tableroHora = 0;
  const f = filaTablero(sig);
  if (f) Object.assign(f, cambios);
}

function pintarTablero(){
  const filas = app.tableroCiclo === app.ciclo ? app.tablero : [];
  const u = app.usuario || {};
  const carreras = Array.isArray(u.carreras) ? u.carreras : [];
  const tb = $("#tb-tablero");
  if (!tb) return;
  tb.innerHTML = filas.map(f => {
    const t = f.totales || {};
    const b = bloqueoVigente(f.bloqueo);
    const otro = b && b.correo !== u.correo;
    const cls = otro ? "bloqueado" : f.estado === ESTADOS.REGISTRADO ? "registrado" : f.estado === ESTADOS.BORRADOR ? "borrador" : "sin";
    const puede = carreras.includes(f.sig);
    const v = f.version ? "v" + f.version : "—";
    return '<tr class="pulsable" data-sig="' + f.sig + '">' +
      "<td><b>" + esc(f.nombre) + '</b> <span class="cod" style="color:var(--ink-faint)">' + f.sig + "</span></td>" +
      '<td><span class="pill ' + cls + '">' + (otro ? "Bloqueado" : esc(f.estado)) + "</span></td>" +
      '<td class="num">' + (t.sem || "—") + '</td><td class="num">' + (t.asig || "—") + "</td>" +
      '<td class="num">' + (t.grupos || "—") + '</td><td class="num">' + (t.dictado || "—") + "</td>" +
      '<td class="cod">' + v + "</td>" +
      '<td class="cod" style="font-size:11px;color:var(--ink-faint)">' + (b ? esc(b.correo) : "—") + "</td>" +
      '<td style="text-align:right">' + (puede
        ? '<button class="btn" data-editar="' + f.sig + '" style="padding:4px 10px;font-size:12px">Editar</button>'
        : "") + "</td></tr>";
  }).join("");

  $$("#tb-tablero tr").forEach(tr => {
    tr.onclick = e => { if (!e.target.closest("[data-editar]")) abrirLectura(tr.dataset.sig); };
  });
  $$("#tb-tablero [data-editar]").forEach(b => {
    b.onclick = e => { e.stopPropagation(); abrirEdicion(b.dataset.editar); };
  });
}

/* ---------- consulta ---------- */
async function abrirLectura(sig){
  const f = filaTablero(sig);
  let p = f && Array.isArray(f.contenido)
    ? { estado: f.estado, version: f.version, asignaturas: f.contenido, bloqueo: bloqueoVigente(f.bloqueo) }
    : null;
  if (!p) {
    try { p = await llamar("obtenerPlan", app.ciclo, sig); } catch (e) { return informarError(e); }
  }
  mostrar("lectura");
  $("#lectura-titulo").textContent = "Consulta · " + nombreCarrera(sig) + " · " + app.ciclo;
  $("#lectura-nota").innerHTML = p.asignaturas.length
    ? "Plan en estado <b>" + esc(p.estado) + "</b>, versión <b>v" + p.version + "</b>. Vista de solo lectura." +
      (p.bloqueo ? " Lo está editando <b>" + esc(p.bloqueo.correo) + "</b>." : "")
    : "Esta carrera todavía no tiene ninguna asignatura registrada en " + esc(app.ciclo) + ".";
  pintarResumen($("#lectura-resumen"), p.asignaturas);
  $("#lectura-bloques").innerHTML = htmlBloques(p.asignaturas, false);
}

/* ---------- edición ---------- */
/* Se abre al instante con el contenido que trajo el tablero y el bloqueo se pide de
   fondo; hasta que el servidor lo confirma no se puede guardar. Si según el tablero otra
   cuenta tiene el plan, se espera la respuesta antes de abrir. */
async function abrirEdicion(sig){
  const f = filaTablero(sig);
  const b = f && bloqueoVigente(f.bloqueo);
  if (!f || !Array.isArray(f.contenido) || (b && b.correo !== app.usuario.correo)) return abrirEdicionEsperando(sig);

  const pedido = ++edicion.pedido;
  entrarEnEdicion(sig, { estado: f.estado, version: f.version, asignaturas: clonar(f.contenido) });
  let r;
  try {
    r = await llamarDeFondo("abrirEdicion", app.ciclo, sig, f.version);
  } catch (e) {
    if (pedido === edicion.pedido && app.carrera === sig) { salirSinGuardar(); mostrarTablero(); informarError(e); }
    return;
  }
  if (pedido !== edicion.pedido || app.carrera !== sig) {
    /* Ya se salió de este plan: el bloqueo que se acaba de tomar se devuelve. */
    if (!r.bloqueado && app.carrera !== sig) llamarEnSilencio("liberarBloqueo", app.ciclo, sig).catch(() => {});
    return;
  }
  if (r.bloqueado) {
    const habiaCambios = app.plan.sucio;
    salirSinGuardar();
    return avisarBloqueado(sig, r.bloqueado, habiaCambios);
  }
  confirmarEdicion(sig, r);
}

async function abrirEdicionEsperando(sig){
  let r;
  try { r = await llamar("abrirEdicion", app.ciclo, sig); } catch (e) { return informarError(e); }
  if (r.bloqueado) return avisarBloqueado(sig, r.bloqueado, false);
  ++edicion.pedido;
  entrarEnEdicion(sig, { estado: r.estado, version: r.version, asignaturas: r.asignaturas });
  confirmarEdicion(sig, r);
}

function entrarEnEdicion(sig, plan){
  app.carrera = sig;
  app.plan = Object.assign({ sucio: false, confirmado: false }, plan);
  app.seleccion = null;
  app.colapsados.clear();
  app.avisoImportacion = "";
  detenerReloj();
  $$(".reloj").forEach(e => { e.textContent = "Tomando el bloqueo de edición…"; });
  if (app.plan.asignaturas.length) pintarGrilla();
  else irACarga();
}

function confirmarEdicion(sig, r){
  const p = app.plan;
  p.confirmado = true;
  iniciarReloj(r.expira);
  if (Array.isArray(r.asignaturas) && r.version !== p.version) {
    /* Entretanto se guardó otra versión. Si todavía no hay cambios, se carga esa; si ya
       los hay, se conservan y al guardar se avisará de la versión más reciente. */
    actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(r.asignaturas), contenido: clonar(r.asignaturas) });
    if (!p.sucio) {
      Object.assign(p, { estado: r.estado, version: r.version, asignaturas: r.asignaturas });
      app.seleccion = null;
      if (app.vista === "carga" && p.asignaturas.length) pintarGrilla();
      aviso("Se cargó la versión más reciente del plan, v" + r.version);
    }
  }
  if (app.vista === "grilla") pintarGrilla();
}

/* Sale de la edición sin guardar ni liberar nada: el bloqueo no llegó a tomarse. */
function salirSinGuardar(){
  detenerReloj();
  app.carrera = null; app.plan = null; app.seleccion = null;
}

async function avisarBloqueado(sig, bloqueo, habiaCambios){
  actualizarFilaTablero(sig, { bloqueo: bloqueo });
  await preguntar({
    titulo: "El plan está siendo editado",
    cuerpo: '<div class="nota aviso">Lo está editando <b>' + esc(bloqueo.correo) + "</b> desde las " +
            esc(hora(bloqueo.desde)) + ". Puedes consultarlo en solo lectura." +
            (habiaCambios ? " Los cambios que alcanzaste a hacer no se guardaron." : "") + "</div>",
    acciones: [{ texto:"Consultar en solo lectura", clase:"primario", valor:true }]
  });
  return abrirLectura(sig);
}

function irACarga(){
  cargarSheetJS();   // se adelanta la descarga por si se sube un libro de cálculo
  $("#carga-titulo").textContent = "Carga masiva · " + nombreCarrera(app.carrera);
  $("#nota-bloqueo").innerHTML =
    "Tienes el <b>bloqueo de edición</b> del plan de " + esc(nombreCarrera(app.carrera)) + " para " + esc(app.ciclo) +
    ". Expira tras " + CONFIG.minutosBloqueo + " minutos de inactividad; mientras tanto, los demás usuarios lo ven en solo lectura.";
  mostrar("carga");
}

$("#volver-carga").onclick = () => terminarEdicion();

/* ---------- pegado ---------- */
$("#op-pegar").onclick = () => { mostrar("pegado"); limpiarHoja(); $("#hoja-pegado").focus(); };

/* ---------- área de pegado con forma de hoja de cálculo ---------- */
const MAX_FILAS_VISTA = 300;          // tope de filas dibujadas; se procesan todas
const hoja = $("#hoja-pegado");

/* Nombre de columna al estilo de una hoja: A, B, … Z, AA, AB… */
function letraColumna(i){
  let s = "";
  for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
}

function limpiarHoja(){
  app.matrizPegada = null;
  $("#hoja-scroll").hidden = true;
  $("#hoja-scroll").innerHTML = "";
  $("#hoja-vacia").hidden = false;
  $("#hoja-pie").hidden = true;
  $("#procesar-pegado").disabled = true;
  $("#limpiar-pegado").disabled = true;
}

function pintarHoja(matriz){
  app.matrizPegada = matriz;
  const columnas = matriz.reduce((n, f) => Math.max(n, f.length), 0);
  const cab = ubicarCabeceras(matriz);
  const filaCab = cab && !cab.faltan.length && !cab.repetidas.length ? cab.fila : -1;
  const visibles = matriz.slice(0, MAX_FILAS_VISTA);

  const encabezado = "<thead><tr><th></th>" +
    Array.from({ length: columnas }, (_, j) => "<th>" + letraColumna(j) + "</th>").join("") +
    "</tr></thead>";

  const cuerpo = "<tbody>" + visibles.map((f, i) => {
    const celdas = Array.from({ length: columnas }, (_, j) => {
      const v = f[j] == null ? "" : f[j];
      return "<td" + (v === "" ? ' class="vacia"' : "") + ' title="' + esc(v) + '">' +
             (v === "" ? "" : esc(v)) + "</td>";
    }).join("");
    return "<tr" + (i === filaCab ? ' class="fila-cabecera"' : "") + "><th>" + (i + 1) + "</th>" + celdas + "</tr>";
  }).join("") + "</tbody>";

  $("#hoja-scroll").innerHTML = "<table>" + encabezado + cuerpo + "</table>";
  $("#hoja-scroll").hidden = false;
  $("#hoja-vacia").hidden = true;

  const partes = [
    '<span><span class="dato">' + matriz.length + "</span> fila(s) × " +
      '<span class="dato">' + columnas + "</span> columna(s)</span>"
  ];
  if (filaCab >= 0) partes.push("Cabeceras detectadas en la fila <span class=\"dato\">" + (filaCab + 1) + "</span>");
  else partes.push('<span style="color:var(--aviso)">No se reconocen las cabeceras de la plantilla oficial</span>');
  if (matriz.length > MAX_FILAS_VISTA)
    partes.push("Se muestran las primeras " + MAX_FILAS_VISTA + "; se procesarán todas");
  $("#hoja-pie").innerHTML = partes.join(" · ");
  $("#hoja-pie").hidden = false;

  $("#procesar-pegado").disabled = false;
  $("#limpiar-pegado").disabled = false;
}

function recibirPegado(e){
  if (app.vista !== "pegado") return;
  const texto = (e.clipboardData || window.clipboardData).getData("text/plain");
  if (!texto || !texto.trim()) return;
  e.preventDefault();
  const matriz = matrizDesdeTexto(texto);
  if (!matriz.length) return aviso("El contenido pegado está vacío.");
  pintarHoja(matriz);
  latido();
  aviso("Pegadas " + matriz.length + " filas");
}

/* Se escucha en el documento para que el pegado funcione con o sin foco en la rejilla. */
document.addEventListener("paste", recibirPegado);
hoja.addEventListener("click", () => hoja.focus());

/* Arrastrar y soltar un archivo de texto sobre la rejilla también rellena la hoja. */
["dragenter","dragover"].forEach(ev => hoja.addEventListener(ev, e => {
  e.preventDefault(); hoja.classList.add("encima");
}));
["dragleave","drop"].forEach(ev => hoja.addEventListener(ev, e => {

}));
hoja.addEventListener("drop", async e => {
  const f = e.dataTransfer && e.dataTransfer.files[0];
  if (!f) return;
  const m = matrizDesdeTexto(await f.text());
  if (m.length) pintarHoja(m);
});

$("#op-archivo").onclick = () => $("#input-archivo").click();

/* SheetJS pesa casi 1 MB: se descarga al entrar en la carga masiva, no al abrir la página.
   Si no se puede descargar, el archivo se lee como texto. */
const URL_SHEETJS = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
let descargaSheetJS = null;
function cargarSheetJS(){
  if (typeof XLSX !== "undefined") return Promise.resolve(true);
  if (!descargaSheetJS) descargaSheetJS = new Promise(resolve => {
    const s = document.createElement("script");
    s.src = URL_SHEETJS;
    s.onload = () => resolve(typeof XLSX !== "undefined");
    s.onerror = () => { descargaSheetJS = null; s.remove(); resolve(false); };
    document.head.appendChild(s);
  });
  return descargaSheetJS;
}

/* Acepta cualquier archivo. Intenta leerlo como libro de cálculo y, si no lo es,
   como texto plano. No hay extensiones prohibidas ni formatos rechazados. */
async function leerArchivo(file){
  const ext = ((file.name.match(/\.([^.]+)$/) || [])[1] || "").toLowerCase();
  const pareceLibro = ["xlsx","xlsm","xlsb","xls","ods"].includes(ext);

  if (pareceLibro && await cargarSheetJS()) {
    try {
      const libro = XLSX.read(await file.arrayBuffer(), { type:"array" });
      let hojaLibro = libro.SheetNames[0];

      if (libro.SheetNames.length > 1) {
        const elegida = await preguntar({
          titulo: "El libro contiene varias hojas",
          cuerpo: '<p style="font-size:13px;margin-bottom:10px">Elige la hoja que quieres importar.</p>' +
            '<div class="campo"><select id="sel-hoja">' +
            libro.SheetNames.map(n => "<option>" + esc(n) + "</option>").join("") + "</select></div>",
          acciones: [
            { texto:"Cancelar", valor:null },
            { texto:"Importar la hoja", clase:"primario", valor:() => $("#sel-hoja").value }
          ]
        });
        if (!elegida) return;
        hojaLibro = elegida();
      }

      const matriz = XLSX.utils.sheet_to_json(libro.Sheets[hojaLibro], { header:1, raw:false, defval:"" })
        .map(f => f.map(c => String(c == null ? "" : c).trim()));
      return procesar(matriz);
    } catch (e) {
      /* Si no se deja leer como libro, se intenta como texto. */
    }
  }

  let texto = "";
  try { texto = await file.text(); } catch (e) { texto = ""; }
  const matriz = matrizDesdeTexto(texto);
  if (!matriz.length) {
    aviso("No se pudo sacar nada de «" + file.name + "».");
    return;
  }
  procesar(matriz);
}

/* ---------- procesar ---------- */
/* Nunca falla: lo que se pueda interpretar entra, y el resto se queda como texto.
   Solo se toman las filas de la carrera en edición (o sin carrera). */
async function procesar(matriz){
  const { asignaturas, ignoradas } = interpretar(matriz, { carrera: app.carrera });
  const p = app.plan;

  if (p.asignaturas.length) {
    const seguir = await preguntar({
      titulo: "Reemplazar el contenido del plan",
      cuerpo: '<div class="nota aviso">Se reemplazará todo el contenido actual del plan. Se perderán los desdobles, ' +
              "los ajustes manuales y las fusiones.</div>",
      acciones: [{ texto:"Cancelar", valor:null }, { texto:"Reemplazar", clase:"primario", valor:true }]
    });
    if (!seguir) return;
  }

  p.asignaturas = asignaturas;
  p.sucio = true;
  app.seleccion = null;
  app.avisoImportacion = ignoradas
    ? (ignoradas === 1 ? "1 fila de otra carrera se ignoró" : ignoradas + " filas de otras carreras se ignoraron") +
      ": el plan de " + nombreCarrera(app.carrera) + " solo toma sus propias filas y las que no indican carrera."
    : "";
  latido();

  if (!asignaturas.length) {
    aviso("No se encontró ninguna fila con contenido.");
    pintarGrilla();
    return;
  }
  const t = totales(asignaturas);
  aviso("Importadas " + t.asig + " asignaturas y " + t.grupos + " grupos.");
  pintarGrilla();
}

   Grilla

function pintarResumen(nodo, asignaturas){
  const t = totales(asignaturas);
  const celdas = [
    ["Asignaturas", t.asig], ["Grupos", t.grupos],
    ["Horas teóricas", t.ht], ["Horas prácticas", t.hp],
    ["Total horas", t.th], ["Horas de dictado", t.dictado],
    ["Intl. / virtual", t.intl], ["Fusiones", t.fus],
    ["Desdobles", t.des]
  ];
  nodo.innerHTML = celdas.map(([k, v]) =>
    "<div><dt>" + esc(k) + "</dt><dd>" + esc(v) + "</dd></div>").join("");
}

function htmlBloques(asignaturas, editable){
  if (!asignaturas.length) return '<div class="nota">El plan no tiene asignaturas.</div>';
  const sems = [...new Set(asignaturas.map(a => a.sem))]
    .sort((x, y) => num(x) - num(y) || String(x).localeCompare(String(y)));

  return sems.map(sem => {
    const asigs = asignaturas.filter(a => a.sem === sem);
    const nG = asigs.reduce((s, a) => s + a.grupos.length, 0);
    const nH = asigs.reduce((s, a) => s + a.grupos.reduce((q, g) => q + th(g), 0), 0);
    const abierto = !app.colapsados.has(String(sem));

    const filas = asigs.map(a => {
      const ci = asignaturas.indexOf(a);
      return a.grupos.map((g, gi) => {
        const sel = editable && app.seleccion && app.seleccion.ci === ci && app.seleccion.gi === gi;
        return "<tr class=\"" + (editable ? "pulsable " : "") + (sel ? "sel" : "") +
          '" data-ci="' + ci + '" data-gi="' + gi + '">' +
          '<td class="cod">' + esc(a.malla) + "</td>" +
          '<td class="cod">' + esc(a.codigo) + "</td>" +
          "<td>" + esc(a.nombre) +
            (Dominio.esInternacional(a) ? '<span class="marca-c intl">INTL</span>' : "") +
            (g.fusion ? '<span class="marca-c fus">FUS</span>' : "") +
            (g.desdoble ? '<span class="marca-c des">' + esc(g.desdoble) + "</span>" : "") + "</td>" +
          '<td class="num">' + esc(g.n) + '</td><td class="num">' + esc(g.ht) +
          '</td><td class="num">' + esc(g.hp) + "</td>" +
          '<td class="num"><b>' + th(g) + "</b></td>" +
          '<td class="cod">' + esc(a.dpto) + "</td>" +
          '<td style="font-size:12px;color:var(--ink-soft)">' + esc(a.obs || "—") + "</td></tr>";
      }).join("");
    }).join("");

    return '<div class="bloque" data-sem="' + esc(sem) + '" data-abierto="' + (abierto ? "si" : "no") + '">' +
      '<button type="button" class="bloque-cab" data-toggle="' + esc(sem) + '">' +
        '<span class="chev">' + (abierto ? "▼" : "▶") + '</span><b>Semestre ' + esc(sem) + "</b>" +
        '<span class="tot">' + asigs.length + " asignaturas · " + nG + " grupos · " + nH + " horas</span></button>" +
      '<div class="tabla-caja"><table><thead><tr>' +
        '<th>Malla</th><th>Código</th><th>Asignatura</th><th class="num">Grupo</th>' +
        '<th class="num">HT</th><th class="num">HP</th><th class="num">Total</th><th>Dpto</th><th>Observaciones</th>' +
      "</tr></thead><tbody>" + filas + "</tbody></table></div></div>";
  }).join("");
}

function pintarGrilla(){
  const p = app.plan;
  if (!p) return;
  mostrar("grilla");
  $("#grilla-titulo").textContent = nombreCarrera(app.carrera) + " · " + app.ciclo;
  /* Hasta que el servidor confirma el bloqueo se puede editar, pero no guardar. */
  const listo = !!p.confirmado;
  $("#btn-registrar").textContent = p.estado === ESTADOS.REGISTRADO ? "Guardar cambios" : "Registrar plan";
  $("#btn-registrar").disabled = !listo;
  $("#btn-borrador").disabled = !listo || p.estado === ESTADOS.REGISTRADO;
  $('[data-acc="historial"]').disabled = !listo;

  const nota = $("#nota-estado");
  if (p.estado === ESTADOS.REGISTRADO) {
    nota.hidden = false;
    nota.className = "nota ok";
    nota.innerHTML = "El plan está <b>Registrado</b> (v" + p.version +
      "). Sigue siendo editable: cada guardado genera una versión nueva.";
  } else if (p.estado === ESTADOS.BORRADOR) {
    nota.hidden = false;
    nota.className = "nota aviso";
    nota.innerHTML = "El plan está en <b>Borrador</b> (v" + p.version + "). Todavía no habilita la asignación docente.";
  } else nota.hidden = true;

  $("#nota-importacion").hidden = !app.avisoImportacion;
  $("#nota-importacion").textContent = app.avisoImportacion;

  pintarResumen($("#resumen"), p.asignaturas);
  $("#bloques").innerHTML = htmlBloques(p.asignaturas, true);

  $("#btn-colapsar").textContent = app.colapsados.size ? "Expandir todo" : "Colapsar todo";

  $$("#bloques [data-toggle]").forEach(b => { b.onclick = () => {
    const s = b.dataset.toggle;
    app.colapsados.has(s) ? app.colapsados.delete(s) : app.colapsados.add(s);
    pintarGrilla();
  }; });
  $$("#bloques tr[data-ci]").forEach(tr => { tr.onclick = () => {
    app.seleccion = { ci:+tr.dataset.ci, gi:+tr.dataset.gi };
    pintarGrilla();
  }; });

  const s = seleccion();
  $$("#acciones-fila [data-req]").forEach(b => {
    const req = b.dataset.req;
    b.disabled = req === "sel" ? !s : req === "fus" ? !(s && s.g.fusion) : !(s && s.g.desdoble);
  });
}

function seleccion(){
  const p = app.plan;
  if (!p || !app.seleccion) return null;
  const a = p.asignaturas[app.seleccion.ci];
  if (!a) return null;
  const g = a.grupos[app.seleccion.gi];
  if (!g) return null;
  return { a, g, ci:app.seleccion.ci, gi:app.seleccion.gi };
}
const resumenSel = s => '<div class="nota">Selección: <b>' + esc(s.a.codigo) + " " + esc(s.a.nombre) +
  "</b> · grupo " + esc(s.g.n) + " · HT " + esc(s.g.ht) + " / HP " + esc(s.g.hp) + " / total " + th(s.g) + ".</div>";

$("#btn-colapsar").onclick = () => {
  const p = app.plan;
  if (app.colapsados.size) app.colapsados.clear();
  else [...new Set(p.asignaturas.map(a => String(a.sem)))].forEach(s => app.colapsados.add(s));
  pintarGrilla();
};

/* ============================================================
   Acciones de edición
   ============================================================ */
$$("[data-acc]").forEach(b => { b.onclick = () => accion(b.dataset.acc); });

async function accion(tipo){
  const p = app.plan;
  if (!p) return;
  const s = seleccion();
  let modifica = true;
  latido();

  switch (tipo) {

    case "editar": {
      const r = await preguntar({
        titulo: "Editar horas del grupo",
        cuerpo: resumenSel(s) +
          '<div class="fila-campos" style="margin-top:12px">' +
          '<div class="campo"><label for="e-ht">HT</label><input type="text" id="e-ht" value="' + esc(s.g.ht) + '"></div>' +
          '<div class="campo"><label for="e-hp">HP</label><input type="text" id="e-hp" value="' + esc(s.g.hp) + '"></div>' +
          '</div><div class="nota" style="margin-top:12px">El total de horas se recalcula automáticamente.</div>',
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Aplicar", clase:"primario", valor:() => ({ ht:$("#e-ht").value, hp:$("#e-hp").value }) }]
      });
      if (!r) return;
      const { ht, hp } = r();
      s.g.ht = ht; s.g.hp = hp;   // se guarda tal cual se escribió
      break;
    }

    case "agregar-asignatura": {
      const r = await preguntar({
        titulo: "Agregar asignatura",
        cuerpo:
          '<div class="fila-campos">' +
          '<div class="campo"><label for="n-sem">Semestre</label><input type="text" id="n-sem" value="1" placeholder="5 o 1-2"></div>' +
          '<div class="campo"><label for="n-malla">Malla</label><input type="text" id="n-malla" value="2024"></div>' +
          '<div class="campo"><label for="n-cod">Código</label><input type="text" id="n-cod" placeholder="3.1.1.24"></div>' +
          '</div><div class="campo" style="margin-top:12px"><label for="n-nom">Asignatura</label><input type="text" id="n-nom"></div>' +
          '<div class="fila-campos">' +
          '<div class="campo"><label for="n-ht">HT</label><input type="text" id="n-ht" value="3"></div>' +
          '<div class="campo"><label for="n-hp">HP</label><input type="text" id="n-hp" value="2"></div>' +
          '<div class="campo"><label for="n-dpto">Dpto</label>' +
            '<input type="text" id="n-dpto" list="lista-dptos" value="' + DPTOS[0] + '">' +
            '<datalist id="lista-dptos">' + DPTOS.map(d => "<option>" + d + "</option>").join("") +
            "</datalist></div></div>" +
          '<div class="campo" style="margin-top:12px"><label for="n-obs">Observaciones</label><input type="text" id="n-obs" placeholder="INTERNACIONAL, VIRTUAL…"></div>',
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Agregar", clase:"primario", valor:() => ({
          sem:$("#n-sem").value, malla:$("#n-malla").value, codigo:$("#n-cod").value.trim(),
          nombre:$("#n-nom").value.trim(), ht:$("#n-ht").value, hp:$("#n-hp").value,
          dpto:$("#n-dpto").value, obs:$("#n-obs").value.trim()
        }) }]
      });
      if (!r) return;
      /* Sin validación: se guarda lo que se haya escrito. */
      Dominio.agregarAsignatura(p.asignaturas, r());
      app.seleccion = null;   // la lista se reordena: la fila seleccionada ya no es la misma
      aviso("Asignatura agregada");
      break;
    }

    case "eliminar-asignatura": {
      const ok = await preguntar({
        titulo: "Eliminar asignatura",
        cuerpo: resumenSel(s) + '<div class="nota aviso" style="margin-top:8px">Se eliminará la asignatura y sus ' +
          s.a.grupos.length + " grupo(s)." + (s.a.grupos.some(g => g.fusion) ? " Alguno participa en una fusión y se retirará de ella." : "") + "</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Eliminar", clase:"peligro", valor:true }]
      });
      if (!ok) return;
      Dominio.eliminarAsignatura(p.asignaturas, s.ci);
      app.seleccion = null;
      aviso("Asignatura eliminada");
      break;
    }

    case "agregar-grupo": {
      const n = Dominio.agregarGrupo(p.asignaturas, s.ci, s.gi);
      aviso("Grupo " + n + " agregado a " + s.a.nombre);
      break;
    }

    case "grupo-semestre": {
      const sem = s ? s.a.sem : (p.asignaturas[0] || {}).sem;
      if (sem === undefined) return aviso("El plan no tiene asignaturas.");
      const cuantas = p.asignaturas.filter(a => String(a.sem) === String(sem)).length;
      const ok = await preguntar({
        titulo: "Agregar un grupo a todo el semestre",
        cuerpo: '<div class="nota">Se creará un grupo correlativo en las <b>' + cuantas +
          "</b> asignaturas del semestre <b>" + esc(sem) + "</b>, con las mismas horas que su primer grupo.</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Agregar", clase:"primario", valor:true }]
      });
      if (!ok) return;
      aviso("Grupo agregado en " + Dominio.agregarGrupoSemestre(p.asignaturas, sem) + " asignaturas");
      break;
    }

    case "eliminar-grupo": {
      const solo = s.a.grupos.length === 1;
      const ok = await preguntar({
        titulo: "Eliminar grupo",
        cuerpo: resumenSel(s) +
          (solo || s.g.fusion ? '<div class="nota aviso" style="margin-top:8px">' +
            (solo ? "Es el único grupo de la asignatura: al eliminarlo, la asignatura deja de aportar horas y se retira del plan. " : "") +
            (s.g.fusion ? "El grupo participa en una fusión y se retirará de ella." : "") + "</div>" : ""),
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Eliminar", clase:"peligro", valor:true }]
      });
      if (!ok) return;
      Dominio.eliminarGrupo(p.asignaturas, s.ci, s.gi);
      app.seleccion = null;
      aviso("Grupo eliminado");
      break;
    }

    case "desdoblar": {
      const r = await preguntar({
        titulo: "Desdoble parcial",
        cuerpo: resumenSel(s) +
          '<div class="fila-campos" style="margin-top:12px">' +
          '<div class="campo"><label for="d-tipo">Tipo</label><select id="d-tipo">' +
            '<option value="Práctica">Práctica</option><option value="Teoría">Teoría</option></select></div>' +
          '<div class="campo"><label for="d-cant">Subgrupos (2 – ' + CONFIG.maxSubgrupos + ')</label>' +
            '<input type="number" id="d-cant" value="2" min="2" max="' + CONFIG.maxSubgrupos + '"></div></div>' +
          '<div class="nota" style="margin-top:12px">Las horas del otro tipo se mantienen en una sección común.</div>',
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Desdoblar", clase:"primario", valor:() => ({ tipo:$("#d-tipo").value, cant:$("#d-cant").value }) }]
      });
      if (!r) return;
      const { tipo: clase, cant } = r();
      const horas = num(clase === "Práctica" ? s.g.hp : s.g.ht);
      const n = parseInt(cant, 10);
      if (!horas) {
        await preguntar({
          titulo: "El desdoble no aplica",
          cuerpo: '<div class="nota aviso">El grupo no registra horas de ' + clase.toLowerCase() +
            ", así que no hay nada que desdoblar. No se han generado subgrupos.</div>",
          acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
        });
        return;
      }
      if (!(n >= 2 && n <= CONFIG.maxSubgrupos)) {
        await preguntar({
          titulo: "Cantidad de subgrupos no válida",
          cuerpo: '<div class="nota aviso">La cantidad de subgrupos debe estar entre <b>2</b> y <b>' +
            CONFIG.maxSubgrupos + "</b>. No se han generado subgrupos.</div>",
          acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
        });
        return accion("desdoblar");
      }
      Dominio.desdoblar(s.g, clase, n);
      aviso("Desdoble de " + clase.toLowerCase() + " en " + n + " subgrupos");
      break;
    }

    case "quitar-desdoble": {
      const ok = await preguntar({
        titulo: "Quitar el desdoble",
        cuerpo: resumenSel(s) + '<div class="nota" style="margin-top:8px">Se quitará el desdoble <b>' + esc(s.g.desdoble) +
          "</b>: el grupo vuelve a dictarse en una sola sección.</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Quitar desdoble", clase:"primario", valor:true }]
      });
      if (!ok) return;
      Dominio.quitarDesdoble(s.g);
      aviso("Desdoble quitado");
      break;
    }

    case "fusionar": {
      const ops = [];
      p.asignaturas.forEach((a, ci) => a.grupos.forEach((g, gi) => {
        ops.push('<option value="' + ci + ":" + gi + '">' + esc(a.codigo) + " " + esc(a.nombre) +
          " · grupo " + esc(g.n) + " · " + esc(g.ht) + "/" + esc(g.hp) + "</option>");
      }));
      if (ops.length < 2) return aviso("Hacen falta al menos dos grupos en el plan para fusionar.");
      const r = await preguntar({
        titulo: "Fusionar grupos",
        cuerpo:
          '<p style="font-size:13px;margin-bottom:10px">Marca dos o más grupos (Ctrl o Mayús para selección múltiple) y elige el grupo principal, cuyas horas definirán la sección fusionada.</p>' +
          '<div class="campo"><label for="f-grupos">Grupos a fusionar</label>' +
          '<select id="f-grupos" multiple size="7">' + ops.join("") + "</select></div>" +
          '<div class="campo"><label for="f-principal">Grupo principal</label><select id="f-principal">' + ops.join("") + "</select></div>" +
          '<div class="nota">Las diferencias de nombre, código u horas se muestran como advertencia: no impiden la fusión.</div>',
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Fusionar", clase:"primario", valor:() => ({
          sel:Array.from($("#f-grupos").selectedOptions).map(o => o.value), principal:$("#f-principal").value
        }) }]
      });
      if (!r) return;
      const { sel, principal } = r();
      if (sel.length < 2) {
        await preguntar({
          titulo: "Selección insuficiente",
          cuerpo: '<div class="nota aviso">La fusión requiere al menos dos grupos.</div>',
          acciones: [{ texto:"Volver a seleccionar", clase:"primario", valor:true }]
        });
        return accion("fusionar");
      }
      const { difs } = Dominio.fusionar(p.asignaturas, sel, principal);
      if (difs.length) {
        await preguntar({
          titulo: "Fusión creada con advertencias",
          cuerpo: '<div class="nota aviso"><b>A05</b> · Estos grupos difieren del grupo principal en nombre, código u horas. ' +
            "La fusión se ha creado igualmente y sus horas se cuentan una sola vez.</div>" +
            '<ul class="lista-err lista-adv" style="margin-top:10px">' +
            difs.map(d => "<li><span>" + esc(d) + "</span></li>").join("") + "</ul>",
          acciones: [{ texto:"Entendido", clase:"primario", valor:true }]
        });
      } else aviso("Grupos fusionados");
      break;
    }

    case "deshacer-fusion": {
      const ok = await preguntar({
        titulo: "Deshacer la fusión",
        cuerpo: '<div class="nota">Se disolverá la sección fusionada: cada grupo volverá a contarse por separado y recuperará las horas que tenía antes de la fusión.</div>',
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Deshacer", clase:"primario", valor:true }]
      });
      if (!ok) return;
      Dominio.deshacerFusion(p.asignaturas, s.g.fusion);
      aviso("Fusión deshecha");
      break;
    }

    case "historial": {
      let versiones;
      try { versiones = await llamar("obtenerHistorial", app.ciclo, app.carrera); } catch (e) { return informarError(e); }
      if (!versiones.length) return aviso("Todavía no hay versiones guardadas de este plan.");
      const r = await preguntar({
        titulo: "Historial de versiones",
        cuerpo: '<div class="tabla-caja"><table><thead><tr><th>Versión</th><th>Estado</th><th>Tipo</th>' +
          "<th>Usuario</th><th>Fecha</th><th>Motivo</th></tr></thead><tbody>" +
          versiones.map(v =>
            '<tr><td class="cod">v' + v.n + "</td><td>" + esc(v.estado) + "</td><td>" + esc(v.tipo) +
            '</td><td class="cod" style="font-size:11px">' + esc(v.usuario) + '</td><td class="cod" style="font-size:11px">' +
            esc(fecha(v.fecha)) + "</td><td>" + esc(v.motivo || "—") + "</td></tr>").join("") +
          "</tbody></table></div>" +
          '<div class="campo" style="margin-top:14px"><label for="v-restaurar">Restaurar una versión</label><select id="v-restaurar">' +
          versiones.map(v => '<option value="' + v.n + '">v' + v.n + " · " + esc(v.estado) + " · " + esc(fecha(v.fecha)) + "</option>").join("") +
          "</select></div>" +
          '<div class="nota">Restaurar no borra el historial: genera una versión nueva con el contenido recuperado.</div>',
        acciones: [{ texto:"Cerrar", valor:null }, { texto:"Restaurar", clase:"primario", valor:() => $("#v-restaurar").value }]
      });
      if (!r) return;
      const n = parseInt(r(), 10);
      let res;
      try { res = await llamar("restaurarVersion", app.ciclo, app.carrera, n); } catch (e) { return informarError(e); }
      Object.assign(p, { asignaturas: res.asignaturas, version: res.version, estado: res.estado, sucio: false });
      if (res.expira) edicion.expira = Date.parse(res.expira);
      actualizarFilaTablero(app.carrera, { estado: res.estado, version: res.version, totales: totales(res.asignaturas), contenido: clonar(res.asignaturas) });
      app.seleccion = null;
      modifica = false;
      aviso("Versión v" + n + " restaurada");
      break;
    }

    case "reemplazar": {
      const ok = await preguntar({
        titulo: "Reemplazar el contenido",
        cuerpo: '<div class="nota aviso">Volverás a las opciones de carga. Al importar un contenido nuevo se reemplazará ' +
          "todo el plan actual, incluidos los desdobles, los ajustes manuales y las fusiones.</div>",
        acciones: [{ texto:"Cancelar", valor:null }, { texto:"Continuar", clase:"primario", valor:true }]
      });
      if (!ok) return;
      irACarga();
      return;
    }
  }

  if (modifica) p.sucio = true;
  app.avisoImportacion = "";
  pintarGrilla();
}

/* Si mientras se editaba se guardó otra versión (por ejemplo, una actualización desde
   el xlsx), se advierte y el usuario decide si guarda igualmente. */
async function guardar(datos){
  const p = app.plan, sig = app.carrera;
  const base = { asignaturas: p.asignaturas, versionBase: p.version };
  let r = await llamar("guardarPlan", app.ciclo, sig, Object.assign({}, base, datos));
  if (r.conflicto) {
    const c = r.conflicto;
    const seguir = await preguntar({
      titulo: "Hay una versión más reciente del plan",
      cuerpo: '<div class="nota aviso">Mientras editabas se guardó la versión <b>v' + c.n + "</b>" +
        (c.tipo ? " (" + esc(c.tipo) + ", " + esc(c.usuario) + ", " + esc(fecha(c.fecha)) + ")" : "") +
        ". Si continúas, tu contenido se guardará como una versión nueva y esa versión seguirá disponible en el historial.</div>",
      acciones: [{ texto:"Cancelar", valor:null }, { texto:"Guardar de todos modos", clase:"primario", valor:true }]
    });
    if (!seguir) return null;
    r = await llamar("guardarPlan", app.ciclo, sig, Object.assign({}, base, datos, { forzar: true }));
  }
  Object.assign(p, { version: r.version, estado: r.estado, sucio: false });
  if (r.expira) edicion.expira = Date.parse(r.expira);
  actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(p.asignaturas), contenido: clonar(p.asignaturas) });
  return r;
}

$("#btn-registrar").onclick = async () => {

      "</tbody></table></div>" +

    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Confirmar y registrar", clase:"primario", valor:true }]
  });
  if (!ok) return;

  let g;
  try { g = await guardar({ estado: ESTADOS.REGISTRADO, tipo: "registrar" }); } catch (e) { return informarError(e); }
  if (!g) return;
  const sig = app.carrera;
  detenerReloj();
  app.plan = null;
  mostrar("exito");
  $("#exito-nota").innerHTML =
    "<b>Plan registrado.</b> " + esc(nombreCarrera(sig)) + " · " + esc(app.ciclo) + " · versión <b>v" + g.version + "</b>. " +
    "La asignación docente queda habilitada para DIMA, DAHUC, DACJ y DACTE. El plan sigue siendo editable: cada guardado generará una versión nueva.";
  try { await llamarEnSilencio("liberarBloqueo", app.ciclo, sig); } catch (e) { /* caduca solo */ }
};

const appDocentes = {
  ciclo: CONFIG.ciclo,
  dpto: "DIMA",
  vistaActual: "dpto", // "dpto" o "carrera"
  catalogo: [],
  cursos: [],
  asignaciones: [], // lista reactiva en memoria [{carrera, codigo, asignatura, grupo, componente, docente, horas, condicion, reemplazo_de}]
  balance: null,
  bloqueo: null,
  filtroDpto: "todos", // "todos", "advertencias", "catalogo"
  filtroSoloPendientes: false,
  matrizPegada: null,
  asignacionesPrevia: []
};

// Evento al pulsar "Asignar docentes al plan de ciclo" en el menú principal
alPulsar("#op-docentes", () => iniciarCargaDocentes());

async function iniciarCargaDocentes(forzarCiclo, forzarDpto) {
  if (forzarCiclo) appDocentes.ciclo = forzarCiclo;
  if (forzarDpto) appDocentes.dpto = forzarDpto;

  const selCiclo = $("#sel-doc-ciclo");
  if (!selCiclo.children.length) {
    selCiclo.innerHTML = CONFIG.ciclos.map(c => `<option value="${esc(c)}"${c === appDocentes.ciclo ? " selected" : ""}>${esc(c)}</option>`).join("");
  } else {
    selCiclo.value = appDocentes.ciclo;
  }
  $("#sel-doc-dpto").value = appDocentes.dpto;

  mostrar("docentes");
  await cargarEstadoDocentes();
}

async function cargarEstadoDocentes() {
  try {
    const res = await llamar("obtenerEstadoDocentes", appDocentes.ciclo, appDocentes.dpto);
    if (res.estado !== "ok") throw new Error("No se pudo obtener el estado de docentes.");

    appDocentes.catalogo = res.catalogo || [];
    appDocentes.cursos = res.cursos || [];
    appDocentes.asignaciones = res.asignaciones || [];
    appDocentes.bloqueo = res.bloqueo || null;

    recalcularBalanceDocentes();
    pintarVistaDocentes();
  } catch (err) {
    informarError(err);
  }
}

function recalcularBalanceDocentes() {
  appDocentes.balance = Dominio.calcularBalanceDocente(appDocentes.catalogo, appDocentes.asignaciones);
}

function pintarVistaDocentes() {
  // 1. Métricas
  const totalHorasReq = appDocentes.cursos.reduce((sum, c) => sum + (num(c.ht) + num(c.hp) * (c.subgrupos || 1)), 0);
  const totalHorasAsig = appDocentes.asignaciones.reduce((sum, a) => sum + num(a.horas), 0);
  const cob = totalHorasReq > 0 ? Math.round((totalHorasAsig / totalHorasReq) * 100) : 0;
  const advCount = appDocentes.balance ? appDocentes.balance.advertenciasTotales : 0;
  const docAsigCount = appDocentes.balance ? appDocentes.balance.totalDocentesAsignados : 0;

  $("#met-doc-req").textContent = totalHorasReq;
  $("#met-doc-asig").textContent = totalHorasAsig;
  $("#met-doc-cob").textContent = cob + "%";
  $("#met-doc-total").textContent = docAsigCount;
  $("#met-doc-adv").textContent = advCount;
  $("#caja-met-adv").classList.toggle("con-alerta", advCount > 0);

  // 2. Alertas activas A07 a A13
  const cajaAlertas = $("#alertas-docentes");
  const todasAlertas = [];
  if (appDocentes.balance && appDocentes.balance.docentes) {
    appDocentes.balance.docentes.forEach(d => {
      (d.advertencias || []).forEach(a => {
        todasAlertas.push({ docente: d.nombreCompleto, ...a });
      });
    });
  }

  if (todasAlertas.length > 0) {
    cajaAlertas.hidden = false;
    cajaAlertas.innerHTML = `
      <b style="color:var(--peligro, #b91c1c);font-size:12.5px">Advertencias de carga horaria y cruces vigentes (${todasAlertas.length}):</b>
      <ul>
        ${todasAlertas.map(a => `<li><span class="badge-doc alerta">${esc(a.codigo)}</span> <b>${esc(a.docente)}:</b> ${esc(a.mensaje)}</li>`).join("")}
      </ul>
    `;
  } else {
    cajaAlertas.hidden = true;
    cajaAlertas.innerHTML = "";
  }

  // 3. Renderizar tabla según vista seleccionada
  if (appDocentes.vistaActual === "dpto") {
    pintarTablaVistaDepartamento();
  } else {
    pintarTablaVistaCarrera();
  }
}

function pintarTablaVistaDepartamento() {
  const tb = $("#tb-vista-dpto");
  tb.innerHTML = "";

  const docs = (appDocentes.balance && appDocentes.balance.docentes) ? appDocentes.balance.docentes : [];
  const filtro = appDocentes.filtroDpto;

  const filtrados = docs.filter(d => {
    if (filtro === "advertencias") return d.advertencias && d.advertencias.length > 0;
    if (filtro === "todos") return d.horasLectivas > 0 || (d.cursos && d.cursos.length > 0);
    return true;
  });

  if (!filtrados.length) {
    tb.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--ink-soft)">No se encontraron docentes con el filtro seleccionado.</td></tr>`;
    return;
  }

  filtrados.forEach(d => {
    const tr = document.createElement("tr");

    const chips = (d.cursos || []).map(c => {
      const cls = c.componente === "Teoría" ? "teoria" : (c.componente === "Práctica" ? "practica" : "");
      return `<span class="chip-curso ${cls}" title="${esc(c.asignatura)} (Grupo ${esc(c.grupo)})">
        <b>[${esc(c.carrera)}]</b> ${esc(c.codigo)} · G${esc(c.grupo)} (${esc(c.componente || "Comp.")} ${esc(c.horas)}h)
      </span>`;
    }).join(" ");

    const chipsAdv = (d.advertencias || []).map(a => `<span class="badge-doc alerta" title="${esc(a.mensaje)}">${esc(a.codigo)}</span>`).join(" ");

    tr.innerHTML = `
      <td>
        <b>${esc(d.nombreCompleto)}</b>
        ${d.dni ? `<br><small style="color:var(--ink-faint)">DNI: ${esc(d.dni)}</small>` : ""}
      </td>
      <td><span class="badge-doc condicion">${esc(d.dedicacion || "TP")}</span></td>
      <td><span style="font-size:12px">${esc(d.condicion || "Contratado")}</span></td>
      <td class="num"><b style="${d.horasLectivas > 40 ? "color:var(--peligro, #b91c1c)" : ""}">${d.horasLectivas}h</b></td>
      <td>${chips || '<span style="color:var(--ink-faint);font-size:12px">Sin asignaciones</span>'}</td>
      <td>${chipsAdv || '<span class="badge-doc ok">✓ Sin alertas</span>'}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm" data-acc-doc="asignar-curso" data-doc="${esc(d.nombreCompleto)}" title="Asignar un curso a este docente">+ Asignar</button>
        ${d.cursos && d.cursos.length ? `<button class="btn btn-sm" data-acc-doc="reemplazar-doc" data-doc="${esc(d.nombreCompleto)}" title="Reemplazar docente en sus cursos">Reemplazar</button>` : ""}
      </td>
    `;
    tb.appendChild(tr);
  });
}

function pintarTablaVistaCarrera() {
  const tb = $("#tb-vista-carrera");
  tb.innerHTML = "";

  const cursos = appDocentes.cursos || [];
  const soloPend = appDocentes.filtroSoloPendientes;

  let filasDibujadas = 0;
  cursos.forEach((c, idx) => {
    const asigs = appDocentes.asignaciones.filter(a =>
      a.carrera === c.carrera && a.codigo === c.codigo && String(a.grupo) === String(c.grupo)
    );
    const esCompartida = asigs.length > 1;
    const asignado = asigs.length > 0;

    if (soloPend && asignado) return;

    filasDibujadas++;
    const tr = document.createElement("tr");

    let celdaDocente = '<span class="badge-doc pendiente">Pendiente</span>';
    if (esCompartida) {
      celdaDocente = `
        <span class="badge-doc info" style="margin-bottom:4px;display:inline-block">Cátedra compartida (FA-001)</span><br>
        ${asigs.map(a => `• <b>${esc(a.docente)}</b> <small style="color:var(--ink-soft)">(${esc(a.componente)}: ${a.horas}h)</small>`).join("<br>")}
      `;
    } else if (asignado) {
      const a = asigs[0];
      const esInter = /INTERNACIONAL/i.test(a.docente);
      celdaDocente = esInter
        ? '<span class="badge-doc condicion">🌐 Docente Internacional (Pendiente)</span>'
        : `<b>${esc(a.docente)}</b>${a.reemplazo_de ? `<br><small style="color:var(--ink-faint)">Sustituye a: ${esc(a.reemplazo_de)}</small>` : ""}`;
    }

    const admiteCompartida = c.ht > 0 && c.hp > 0;

    tr.innerHTML = `
      <td><b>${esc(c.carrera)}</b></td>
      <td>${esc(c.sem)}</td>
      <td><code>${esc(c.codigo)}</code></td>
      <td><b>${esc(c.nombre)}</b></td>
      <td>${esc(c.grupo)}</td>
      <td>${esc(c.ht > 0 && c.hp === 0 ? "Teoría" : (c.hp > 0 && c.ht === 0 ? "Práctica" : "Completo"))}</td>
      <td class="num">${c.ht}</td>
      <td class="num">${c.hp}</td>
      <td>${celdaDocente}</td>
      <td>
        ${asignado ? '<span class="badge-doc ok">Asignado</span>' : '<span class="badge-doc pendiente">Por asignar</span>'}
      </td>
      <td style="white-space:nowrap;display:flex;gap:4px;flex-wrap:wrap">
        ${asignado ? `
          <button class="btn btn-sm" data-acc-asig="editar" data-idx="${idx}">Cambiar</button>
          <button class="btn btn-sm peligro" data-acc-asig="quitar" data-idx="${idx}">Quitar</button>
        ` : `
          <button class="btn btn-sm primario" data-acc-asig="asignar" data-idx="${idx}">Asignar</button>
        `}
        ${admiteCompartida ? `
          <button class="btn btn-sm" data-acc-asig="compartida" data-idx="${idx}" title="Configurar cátedra compartida dividiendo teoría y práctica">Cátedra</button>
        ` : ""}
      </td>
    `;
    tb.appendChild(tr);
  });

  if (!filasDibujadas) {
    tb.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:24px;color:var(--ink-soft)">No hay asignaturas pendientes en este departamento.</td></tr>`;
  }
}

document.addEventListener("click", async e => {
  const btnDoc = e.target.closest("[data-acc-doc]");
  if (btnDoc) {
    const acc = btnDoc.dataset.accDoc;
    const docNom = btnDoc.dataset.doc;
    if (acc === "asignar-curso") {
      abrirModalAsignarCursoADocente(docNom);
    } else if (acc === "reemplazar-doc") {
      abrirModalReemplazoDocente(docNom);
    }
    return;
  }

  const btnAsig = e.target.closest("[data-acc-asig]");
  if (btnAsig) {
    const acc = btnAsig.dataset.accAsig;
    const idx = parseInt(btnAsig.dataset.idx, 10);
    const curso = appDocentes.cursos[idx];
    if (!curso) return;

    if (acc === "asignar" || acc === "editar") {
      abrirModalAsignarDocenteACurso(curso);
    } else if (acc === "compartida") {
      abrirModalCatedraCompartida(curso);
    } else if (acc === "quitar") {
      appDocentes.asignaciones = appDocentes.asignaciones.filter(a =>
        !(a.carrera === curso.carrera && a.codigo === curso.codigo && String(a.grupo) === String(curso.grupo))
      );
      recalcularBalanceDocentes();
      pintarVistaDocentes();
      aviso("Asignación retirada.");
    }
    return;
  }
});

async function abrirModalCatedraCompartida(curso) {
  const opciones = (appDocentes.catalogo || [])
    .filter(d => Dominio.normalizarDpto(d.dpto) === Dominio.normalizarDpto(appDocentes.dpto))
    .map(d => `<option value="${esc(d.nombreCompleto)}">${esc(d.nombreCompleto)} (${esc(d.dedicacion)})</option>`)
    .join("");

  const cuerpo = `
    <div style="font-size:13px;margin-bottom:12px">
      <b>${esc(curso.carrera)} · Semestre ${esc(curso.sem)}</b><br>
      <code>${esc(curso.codigo)}</code> - ${esc(curso.nombre)} (Grupo ${esc(curso.grupo)})<br>
      <span style="color:var(--ink-soft)">Distribución horaria: <b>${curso.ht}h Teoría</b> + <b>${curso.hp}h Práctica</b></span>
    </div>
    <div class="campo">
      <label for="dlg-doc-teoria">Docente para Horas Teóricas (${curso.ht}h):</label>
      <select id="dlg-doc-teoria" style="width:100%">
        <option value="">-- Seleccionar docente de teoría --</option>
        ${opciones}
      </select>
    </div>
    <div class="campo">
      <label for="dlg-doc-practica">Docente / Jefe de Práctica (${curso.hp}h):</label>
      <select id="dlg-doc-practica" style="width:100%">
        <option value="">-- Seleccionar docente de práctica --</option>
        ${opciones}
      </select>
    </div>
  `;

  const ok = await preguntar({
    titulo: "Configurar Cátedra Compartida (FA-001)",
    cuerpo: cuerpo,
    acciones: [
      { texto: "Cancelar", clase: "", valor: null },
      { texto: "Confirmar Cátedra", clase: "primario", valor: true }
    ]
  });

  if (!ok) return;

  const docTeo = $("#dlg-doc-teoria") ? $("#dlg-doc-teoria").value : "";
  const docPra = $("#dlg-doc-practica") ? $("#dlg-doc-practica").value : "";

  if (!docTeo || !docPra) {
    aviso("Debes seleccionar ambos docentes para la cátedra compartida.");
    return;
  }

  // Eliminar asignación previa de este curso
  appDocentes.asignaciones = appDocentes.asignaciones.filter(a =>
    !(a.carrera === curso.carrera && a.codigo === curso.codigo && String(a.grupo) === String(curso.grupo))
  );

  // Agregar asignación de teoría
  appDocentes.asignaciones.push({
    ciclo: appDocentes.ciclo,
    departamento: appDocentes.dpto,
    carrera: curso.carrera,
    codigo: curso.codigo,
    asignatura: curso.nombre,
    grupo: curso.grupo,
    componente: "Teoría",
    docente: docTeo,
    horas: curso.ht
  });

  // Agregar asignación de práctica
  appDocentes.asignaciones.push({
    ciclo: appDocentes.ciclo,
    departamento: appDocentes.dpto,
    carrera: curso.carrera,
    codigo: curso.codigo,
    asignatura: curso.nombre,
    grupo: curso.grupo,
    componente: "Práctica",
    docente: docPra,
    horas: curso.hp
  });

  recalcularBalanceDocentes();
  pintarVistaDocentes();
  aviso(`Cátedra compartida configurada: ${docTeo} (Teoría) y ${docPra} (Práctica).`);
}

async function abrirModalAsignarDocenteACurso(curso) {
  const opcionesDocentes = (appDocentes.catalogo || [])
    .filter(d => Dominio.normalizarDpto(d.dpto) === Dominio.normalizarDpto(appDocentes.dpto))
    .map(d => `<option value="${esc(d.nombreCompleto)}">${esc(d.nombreCompleto)} (${esc(d.dedicacion)} - ${esc(d.condicion)})</option>`)
    .join("");

  const cuerpo = `
    <div style="font-size:13px;margin-bottom:12px">
      <b>${esc(curso.carrera)} · Semestre ${esc(curso.sem)}</b><br>
      <code>${esc(curso.codigo)}</code> - ${esc(curso.nombre)} (Grupo ${esc(curso.grupo)})<br>
      <small style="color:var(--ink-soft)">Horas: ${curso.ht} HT + ${curso.hp} HP = <b>${curso.th} horas lectivas</b></small>
    </div>
    <div class="campo">
      <label for="dlg-sel-doc">Docente del departamento (${esc(appDocentes.dpto)}):</label>
      <select id="dlg-sel-doc" style="width:100%">
        <option value="">-- Seleccionar de la plana docente --</option>
        ${opcionesDocentes}
      </select>
    </div>
    <div class="campo">
      <label for="dlg-doc-manual">O escribir nombre / buscar otro docente:</label>
      <input type="text" id="dlg-doc-manual" placeholder="Apellidos y nombres del docente">
    </div>
    <div class="campo" style="margin-top:10px">
      <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="dlg-chk-inter"> Marcar como <b>Docente Internacional (Pendiente)</b> (RN-30)
      </label>
    </div>
  `;

  const ok = await preguntar({
    titulo: "Asignar docente a la asignatura",
    cuerpo: cuerpo,
    acciones: [
      { texto: "Cancelar", clase: "", valor: null },
      { texto: "Asignar docente", clase: "primario", valor: true }
    ]
  });

  if (!ok) return;

  const esInter = $("#dlg-chk-inter") && $("#dlg-chk-inter").checked;
  const selDoc = $("#dlg-sel-doc") ? $("#dlg-sel-doc").value : "";
  const manDoc = $("#dlg-doc-manual") ? $("#dlg-doc-manual").value.trim() : "";
  const docenteFinal = esInter ? "Docente Internacional" : (manDoc || selDoc);

  if (!docenteFinal) {
    aviso("Debes seleccionar o escribir un docente.");
    return;
  }

  appDocentes.asignaciones = appDocentes.asignaciones.filter(a =>
    !(a.carrera === curso.carrera && a.codigo === curso.codigo && String(a.grupo) === String(curso.grupo))
  );

  appDocentes.asignaciones.push({
    carrera: curso.carrera,
    codigo: curso.codigo,
    asignatura: curso.nombre,
    grupo: String(curso.grupo),
    componente: curso.ht > 0 && curso.hp === 0 ? "Teoría" : (curso.hp > 0 && curso.ht === 0 ? "Práctica" : "Completo"),
    docente: docenteFinal,
    horas: curso.th,
    condicion: esInter ? "INTERNACIONAL" : "",
    reemplazo_de: "",
    departamento: appDocentes.dpto
  });

  recalcularBalanceDocentes();
  pintarVistaDocentes();
  aviso("Docente asignado correctamente.");
}

async function abrirModalAsignarCursoADocente(docNom) {
  const cursosSinDoc = appDocentes.cursos.filter(c => {

  if (!cursosSinDoc.length) {
    aviso("Todas las asignaturas del departamento ya cuentan con docente asignado.");
    return;
  }

  const opcionesCursos = cursosSinDoc.map((c, i) =>
    `<option value="${i}">[${esc(c.carrera)}] ${esc(c.codigo)} - ${esc(c.nombre)} G${esc(c.grupo)} (${c.th}h)</option>`
  ).join("");

  const cuerpo = `

      Asignar curso pendiente al profesor: <b>${esc(docNom)}</b>
    </div>

      <label for="dlg-sel-curso-pendiente">Seleccionar asignatura solicitada:</label>
      <select id="dlg-sel-curso-pendiente" style="width:100%">
        ${opcionesCursos}
      </select>
    </div>

  const ok = await preguntar({
    titulo: "Asignar curso a " + docNom,

      { texto: "Cancelar", clase: "", valor: null },
      { texto: "Asignar", clase: "primario", valor: true }

  if (!ok) return;

    horas: curso.th,
    condicion: "",
    reemplazo_de: "",

  });

  recalcularBalanceDocentes();
  pintarVistaDocentes();
  aviso(`Curso ${curso.codigo} asignado a ${docNom}.`);
}

async function abrirModalReemplazoDocente(titularActual) {
  const opcionesSustitutos = (appDocentes.catalogo || [])
    .filter(d => Dominio.normalizarDpto(d.dpto) === Dominio.normalizarDpto(appDocentes.dpto) && d.nombreCompleto !== titularActual)
    .map(d => `<option value="${esc(d.nombreCompleto)}">${esc(d.nombreCompleto)} (${esc(d.dedicacion)})</option>`)
    .join("");

  const cuerpo = `
    <div style="margin-bottom:12px;font-size:13px">
      Sustituir al docente titular: <b style="color:var(--peligro, #b91c1c)">${esc(titularActual)}</b>
    </div>
    <div class="campo">
      <label for="dlg-sel-sustituto">Nuevo docente sustituto:</label>
      <select id="dlg-sel-sustituto" style="width:100%">
        <option value="">-- Seleccionar sustituto --</option>
        ${opcionesSustitutos}
      </select>
    </div>
    <div class="campo">
      <label for="dlg-motivo-reemplazo">Motivo del reemplazo (auditoría):</label>
      <select id="dlg-motivo-reemplazo" style="width:100%">
        <option value="Licencia médica">Licencia médica</option>
        <option value="Licencia por gravidez">Licencia por gravidez</option>
        <option value="Renuncia">Renuncia</option>
        <option value="Ajuste de carga horaria">Ajuste de carga horaria</option>
        <option value="Otro motivo justificado">Otro motivo justificado</option>
      </select>
    </div>
  `;

  const ok = await preguntar({
    titulo: "Reemplazo de docente (RN-31)",
    cuerpo: cuerpo,
    acciones: [
      { texto: "Cancelar", clase: "", valor: null },
      { texto: "Confirmar Reemplazo", clase: "primario", valor: true }
    ]
  });

  if (!ok) return;

  const nuevoDoc = $("#dlg-sel-sustituto") ? $("#dlg-sel-sustituto").value : "";
  const motivo = $("#dlg-motivo-reemplazo") ? $("#dlg-motivo-reemplazo").value : "";

  if (!nuevoDoc) {
    aviso("Debes seleccionar un docente sustituto.");
    return;
  }

  let cursosReemplazados = 0;
  appDocentes.asignaciones.forEach(a => {
    if (a.docente === titularActual) {
      a.reemplazo_de = titularActual;
      a.docente = nuevoDoc;
      a.condicion = (a.condicion ? a.condicion + " · " : "") + "Sustitución: " + motivo;
      cursosReemplazados++;
    }
  });

  recalcularBalanceDocentes();
  pintarVistaDocentes();
  aviso(`Se reemplazó a ${titularActual} por ${nuevoDoc} en ${cursosReemplazados} asignaturas.`);
}

$("#btn-doc-guardar").onclick = async () => {
  const total = appDocentes.asignaciones.length;
  const advCount = appDocentes.balance ? appDocentes.balance.advertenciasTotales : 0;
  const totalHoras = appDocentes.asignaciones.reduce((sum, a) => sum + num(a.horas), 0);

  const cuerpo = `
    <div style="font-size:13px">
      Se guardarán las asignaciones para el departamento <b>${esc(appDocentes.dpto)}</b> en el ciclo <b>${esc(appDocentes.ciclo)}</b>.<br><br>
      • Total asignaciones: <b>${total}</b><br>
      • Horas lectivas totales: <b>${totalHoras}h</b><br>
      • Advertencias vigentes (A07-A13): <b style="${advCount > 0 ? "color:var(--peligro, #b91c1c)" : ""}">${advCount}</b>
      ${advCount > 0 ? "<br><br><span style='font-size:12px;color:var(--ink-soft)'>Nota: Según la regla de negocio RN-33, las advertencias no bloquean el guardado y se registran bajo confirmación informada.</span>" : ""}
    </div>
  `;

  const ok = await preguntar({
    titulo: "Confirmar guardado de asignaciones",
    cuerpo: cuerpo,
    acciones: [
      { texto: "Cancelar", clase: "", valor: null },
      { texto: "Confirmar y guardar", clase: "primario", valor: true }
    ]
  });

  if (!ok) return;

  try {
    const res = await llamar("guardarAsignaciones", appDocentes.ciclo, appDocentes.dpto, appDocentes.asignaciones, "Guardado interactivo");
    if (!res.ok) throw new Error("No se pudo completar el guardado.");
    aviso(`Asignaciones guardadas con éxito (${res.guardadas} registros).`);
    await cargarEstadoDocentes();
  } catch (err) {
    informarError(err);
  }
};

/* ---------- Carga Masiva de Asignaciones (Rejilla y Archivo) ---------- */

alPulsar("#btn-doc-masiva", () => {
  mostrar("docentes-carga");
  const cp = $("#caja-pegar-doc"); if (cp) cp.hidden = false;
  const cprev = $("#caja-previa-doc"); if (cprev) cprev.hidden = true;
});

alPulsar("#volver-doc-carga", () => {
  mostrar("docentes");
});

alPulsar("#btn-doc-archivo-tab", () => {
  const inp = $("#input-doc-archivo"); if (inp) inp.click();
});

alCambiar("#input-doc-archivo", async e => {
  const f = e.target.files[0];
  if (!f) return;
  aviso("Archivo seleccionado: " + f.name + ". Copia y pega las filas en la rejilla para previsualizar.");
});

const elHojaDoc = $("#hoja-pegado-doc");
if (elHojaDoc) {
  elHojaDoc.addEventListener("paste", e => {
    e.preventDefault();
    const texto = (e.clipboardData || window.clipboardData).getData("text");
    if (!texto) return;

    appDocentes.matrizPegada = Dominio.matrizDesdeTexto(texto);
    pintarRejillaDocentes(appDocentes.matrizPegada);
  });
}

function pintarRejillaDocentes(matriz) {
  const scroll = $("#hoja-scroll-doc");
  const vacia = $("#hoja-vacia-doc");

  if (!matriz || !matriz.length) {
    if (scroll) scroll.hidden = true;
    if (vacia) vacia.hidden = false;
    const bp = $("#btn-procesar-pegado-doc"); if (bp) bp.disabled = true;
    const bl = $("#btn-limpiar-pegado-doc"); if (bl) bl.disabled = true;
    return;
  }

  if (vacia) vacia.hidden = true;
  if (scroll) {
    scroll.hidden = false;
    scroll.innerHTML = `
      <table class="tabla-hoja">
        <tbody>
          ${matriz.slice(0, 50).map((fila, r) => `
            <tr>
              <th class="num">${r + 1}</th>
              ${fila.map(c => `<td>${esc(c)}</td>`).join("")}
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }
  const bp = $("#btn-procesar-pegado-doc"); if (bp) bp.disabled = false;
  const bl = $("#btn-limpiar-pegado-doc"); if (bl) bl.disabled = false;
}

alPulsar("#btn-limpiar-pegado-doc", () => {
  appDocentes.matrizPegada = null;
  pintarRejillaDocentes(null);
});

alPulsar("#btn-procesar-pegado-doc", () => {
  if (!appDocentes.matrizPegada || !appDocentes.matrizPegada.length) return;

  const interpretado = Dominio.interpretarAsignacionesDepartamento(appDocentes.matrizPegada, appDocentes.cursos);
  appDocentes.asignacionesPrevia = interpretado.asignaciones || [];

  const cp = $("#caja-pegar-doc"); if (cp) cp.hidden = true;
  const cprev = $("#caja-previa-doc"); if (cprev) cprev.hidden = false;

  const np = $("#nota-previa-doc");
  if (np) np.innerHTML = `Se leyeron <b>${appDocentes.asignacionesPrevia.length}</b> asignaciones docentes del contenido pegado. Revisa la validación con la plana docente antes de aplicar.`;

  const tb = $("#tb-previa-doc");
  if (tb) {
    tb.innerHTML = "";
    appDocentes.asignacionesPrevia.forEach(a => {
      const tr = document.createElement("tr");
      const esInter = /INTERNACIONAL/i.test(a.docente) || /INTERNACIONAL/i.test(a.condicion);
      const docenteEnCatalogo = appDocentes.catalogo.some(d => Dominio.claveDocente(d.nombreCompleto) === Dominio.claveDocente(a.docente));

      tr.innerHTML = `
        <td><b>${esc(a.carrera)}</b></td>
        <td><code>${esc(a.codigo)}</code></td>
        <td>${esc(a.asignatura)}</td>
        <td>${esc(a.grupo)}</td>
        <td>${esc(a.componente)}</td>
        <td><b>${esc(a.docente)}</b></td>
        <td>
          ${esInter ? '<span class="badge-doc condicion">Internacional</span>' : (
            docenteEnCatalogo ? '<span class="badge-doc ok">✓ Catálogo</span>' : '<span class="badge-doc alerta">⚠ No adscrito</span>'
          )}
        </td>
        <td class="num">${a.horas}h</td>
      `;
      tb.appendChild(tr);
    });
  }
});

alPulsar("#btn-cancelar-previa-doc", () => {
  const cp = $("#caja-pegar-doc"); if (cp) cp.hidden = false;
  const cprev = $("#caja-previa-doc"); if (cprev) cprev.hidden = true;
});

alPulsar("#btn-aplicar-previa-doc", () => {
  if (!appDocentes.asignacionesPrevia.length) return;

  appDocentes.asignacionesPrevia.forEach(nueva => {
    appDocentes.asignaciones = appDocentes.asignaciones.filter(a =>
      !(a.carrera === nueva.carrera && a.codigo === nueva.codigo && String(a.grupo) === String(nueva.grupo))
    );
    appDocentes.asignaciones.push({
      ...nueva,
      departamento: appDocentes.dpto
    });
  });

  recalcularBalanceDocentes();
  pintarVistaDocentes();
  mostrar("docentes");
  aviso(`Se aplicaron ${appDocentes.asignacionesPrevia.length} asignaciones a la grilla.`);
});

(function arrancar(){
  try {
    if (!window.SIS) {
      console.error("SIS no definido");
      return;
    }
    if (SIS.estado === "sin-instalar") return mostrar("instalar");
    if (SIS.estado !== "ok") {
      const tit = $("#denegado-titulo");
      if (tit) tit.textContent = SIS.estado === "error" ? "No se pudo iniciar el sistema" : "Acceso denegado";
      const msg = $("#denegado-msg");
      if (msg) msg.textContent = SIS.motivo || "";
      return mostrar("denegado");
    }
    const u = app.usuario || {};
    const elCorreo = $("#u-correo");
    if (elCorreo) elCorreo.textContent = u.correo || "";
    const elRol = $("#u-rol");
    if (elRol) {
      elRol.textContent = u.rol === "director"
        ? "Director de departamento"
        : "Coordinador de carrera" + (u.carreras && u.carreras.length ? " · " + u.carreras.join(", ") : " · solo lectura");
    }
    const elUsuario = $("#usuario");
    if (elUsuario) elUsuario.hidden = false;

    // Mostrar menú de inmediato para que la interfaz nunca quede en negro
    mostrar("menu");

    /* La página ya trae el tablero. Si hace un rato que nadie revisa los xlsx de Drive, se
       revisan ahora de fondo, mientras el usuario está en el menú. */
    if (SIS.tablero) {
      try {
        fijarTablero(SIS.tablero.ciclo, SIS.tablero.filas, SIS.tablero.avisos);
        if (SIS.tablero.pendiente) cargarTablero();
      } catch (errTablero) {
        console.warn("Aviso al inicializar tablero:", errTablero);
      }
    }
  } catch (err) {
    console.error("Error crítico en arrancar():", err);
    mostrar("denegado");
    const tit = $("#denegado-titulo");
    if (tit) tit.textContent = "Error al iniciar";
    const msg = $("#denegado-msg");
    if (msg) msg.textContent = (err && err.message) ? err.message : String(err);
  }
})();
</script>
