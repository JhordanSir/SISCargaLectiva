<!-- ===== Consulta de un plan en solo lectura (CU-001 FA-013, FA-014; derivación FA-005 a FA-008) ===== -->
<section class="vista" id="v-lectura" hidden>
  <header class="vista-cab">
    <div>
      <button type="button" class="btn fantasma btn-sm volver" data-accion="volverAlTablero"><?!= icono_("arrow-left") ?>Volver al tablero</button>
      <p class="sobretitulo"><?!= icono_("eye") ?>Consulta en solo lectura</p>
      <h1 class="titulo" id="lectura-titulo">Consulta del plan</h1>
    </div>
    <div class="vista-acciones">
      <button type="button" class="btn primario" id="lectura-editar" data-accion="editarEstePlan" hidden><?!= icono_("pencil-simple") ?>Editar este plan</button>
    </div>
  </header>
  <div class="nota" id="lectura-nota"></div>
  <dl class="resumen" id="lectura-resumen"></dl>
  <div id="lectura-bloques" class="bloques"></div>
</section>

<script>
"use strict";
/* ============================================================
   Consulta de un plan en solo lectura. Llama a cu001/ConsultaServidor.js (consultaObtener) solo
   si el tablero no trajo el contenido; la derivación va por comun/Derivacion.html.
   ============================================================ */
/**
 * Estado de la consulta.
 * @type {{sig: (string|null), plan: (Object|null)}}
 */
const consulta = {
  sig: null,      // carrera que se consulta
  plan: null      // {estado, version, asignaturas, bloqueo} a la vista
};

enlazarAcciones($("#v-lectura"), () => ({
  volverAlTablero: () => mostrarTablero(),                         // FA-013 paso 3
  editarEstePlan: () => entrarAEditarPlan(consulta.sig),           // FA-014
  derivar: d => derivarDesdeConsulta(+d.indice),                   // FA-005 paso 8
  alternarBloque: (d, e, el) => alternarBloque(el)                 // semestre plegado o desplegado
}));

/**
 * CU-001 FA-013 paso 2 (y FA-005 paso 7, con «Derivar» para el director): la pantalla
 * «Consulta · <carrera> · <ciclo>».
 * @param {string} sig
 * @returns {Promise<void>}
 */
async function abrirConsulta(sig){
  const f = filaTablero(sig);
  let p = f && Array.isArray(f.contenido)
    ? { estado: f.estado, version: f.version, asignaturas: f.contenido, bloqueo: bloqueoVigente(f.bloqueo) }
    : null;
  if (!p) {
    try { p = await llamar("consultaObtener", app.ciclo, sig); } catch (e) { return informarError(e); }
  }
  mostrar("lectura");
  consulta.sig = sig;
  consulta.plan = p;
  $("#lectura-titulo").textContent = "Consulta · " + nombreCarrera(sig) + " · " + app.ciclo;
  $("#lectura-nota").innerHTML = p.asignaturas.length
    ? "Plan en estado <b>" + esc(p.estado) + "</b>, versión <b>v" + p.version + "</b>. Vista de solo lectura." +
      (p.bloqueo ? " Lo está editando <b>" + esc(p.bloqueo.correo) + "</b>." : "")
    : "Esta carrera todavía no tiene ninguna asignatura registrada en " + esc(app.ciclo) + ".";
  pintarResumen($("#lectura-resumen"), p.asignaturas);
  /* El director puede derivar a otro departamento las asignaturas que asigna el suyo. */
  const dptoDirector = app.usuario && app.usuario.rol === "director" ? departamentoDelUsuario() : "";
  $("#lectura-bloques").innerHTML = htmlBloques(p.asignaturas, false, {
    docentes: docentesDelPlan(sig),
    derivar: dptoDirector ? a => dptoQueAsigna(sig, a) === dptoDirector : null
  });
  $("#lectura-editar").hidden = !carrerasDelUsuario().includes(sig);
}

/* Departamento que asigna el docente de una asignatura del plan de sig. */
const dptoQueAsigna = (sig, a) => a.derivado || Dominio.dptoDeCarrera(sig);

/* CU-001 FA-005 pasos 8 a 19 (y FA-006 a FA-008). */
async function derivarDesdeConsulta(indice){
  const sig = consulta.sig, a = consulta.plan && consulta.plan.asignaturas[indice];
  if (!a) return;
  const res = await derivarCurso({
    ciclo: app.ciclo, sig: sig, grupoId: a.grupos[0].id, codigo: a.codigo,
    descripcion: a.codigo + " " + a.nombre + " · " + nombreCarrera(sig), actual: dptoQueAsigna(sig, a)
  });
  if (res) abrirConsulta(sig);
}

/* ¿Se está consultando ese plan del ciclo? */
const viendoConsulta = (sig, ciclo) => app.vista === "lectura" && consulta.sig === sig && app.ciclo === ciclo;

/* Al llegar los docentes asignados, se repinta si cambiaron los de este plan. */
alCambiarDocentesAsignados(anterior => {
  if (app.vista === "lectura" && consulta.sig && cambiaronDocentesDe(consulta.sig, anterior)) abrirConsulta(consulta.sig);
});
alRecibirDePestana("soltado", m => {
  if (viendoConsulta(m.sig, m.ciclo)) brindis(nombreCarrera(m.sig) + " (" + m.ciclo + ") quedó libre: ya se puede editar.", "pestana");
});
alRecibirDePestana("guardado", m => {
  if (!viendoConsulta(m.sig, m.ciclo)) return;
  abrirConsulta(m.sig);
  brindis("Otra pestaña guardó la v" + m.version + " de " + nombreCarrera(m.sig) + " (" + m.ciclo + "): ya la ves aquí.", "pestana");
});
</script>
