<script>
"use strict";
/* ============================================================
   Edición del plan de ciclo: sesión con bloqueo, entrar y salir de la edición, guardado,
   registro y avisos entre pestañas. Llama a EdicionPlanServidor.js (edicionPlanAbrir,
   edicionPlanGuardar) y, a través de base/SesionEdicion.html, a base/Sesiones.js.
   ============================================================ */
let pedidoEdicion = 0;   // descarta las respuestas de edicionPlanAbrir que llegan tarde
const refPlan = sig => Dominio.REF.plan(sig);

/* Pasos 15 y 16: el bloqueo del plan y el contador de la sesión de edición. */
const sesionPlan = crearSesionEdicion({
  servidor: { renovar: "edicionPlanRenovar", liberar: "edicionPlanLiberar", guardarCopia: "edicionPlanGuardarCopia", descartarCopia: "edicionPlanDescartarCopia" },
  relojes: "#reloj-carga, #reloj-pegado, #reloj-grilla",
  documento: () => edicion.carrera ? { ciclo: app.ciclo, ref: refPlan(edicion.carrera) } : null,
  alRenovar: () => anunciarEdicion(false),
  alPerder: correo => bloqueoPerdido(correo),
  alExpirar: () => expirarEdicionPlan(),
  copia: () => {
    const p = edicion.plan;
    return p && p.sucio && p.confirmado && edicion.carrera ? { contenido: p.asignaturas, versionBase: p.version } : null;
  },
  alCerrarPagina: () => anunciar("soltado", { ciclo: app.ciclo, sig: edicion.carrera })
});
/* La actividad en la carga masiva o en la grilla también renueva el bloqueo. */
const latidoPlan = () => sesionPlan.latido();

/* Mientras se edita, salir por la cabecera pide confirmarlo (FA-115). */
const enEdicionPlan = () => !!(edicion.carrera && edicion.plan && ["carga","pegado","grilla"].includes(app.vista));
registrarGuardaDeSalida(async () => {
  if (!enEdicionPlan()) return true;
  if (!(await confirmarSalidaEdicion())) return false;
  salirDeEdicionPlan(true);
  return true;
});
registrarCambiosPendientes(() => !!(edicion.plan && edicion.plan.sucio));

/* FA-120: otra cuenta tomó el plan tras vencer el bloqueo. */
async function bloqueoPerdido(correo){
  const sig = edicion.carrera;
  edicion.carrera = null; edicion.plan = null; edicion.seleccion = null;
  tablero.hora = 0;
  anunciar("soltado", { ciclo: app.ciclo, sig: sig });
  mostrarTablero();
  await informar("Se perdió el bloqueo de edición", "Tu bloqueo caducó y ahora el plan lo está editando <b>" + esc(correo) +
    "</b>. Lo que no habías guardado queda en la copia de recuperación: podrás recuperarlo la próxima vez que lo edites.");
}

/* FA-117 a FA-119: pasó el tiempo sin actividad; se guarda lo pendiente como una versión
   nueva y se suelta el plan. */
async function expirarEdicionPlan(){
  const sig = edicion.carrera, p = edicion.plan;
  let resultado = "sin cambios";
  if (p && p.sucio && p.asignaturas.length) {
    try {
      const r = await llamar("edicionPlanGuardar", app.ciclo, sig, {
        asignaturas: p.asignaturas, versionBase: p.version, forzar: true, tipo: Dominio.TIPO_VERSION.AUTOGUARDADO,
        estado: p.estado === ESTADOS.REGISTRADO ? ESTADOS.REGISTRADO : ESTADOS.BORRADOR,
        fusionesDisueltas: p.fusionesDisueltas || []
      });
      actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(r.asignaturas), contenido: clonar(r.asignaturas) });
      anunciarGuardado(sig, r.estado, r.version, r.asignaturas);
      aplicarOtros(r.otros);
      resultado = "guardado";
    } catch (e) {
      resultado = (e && e.message) || String(e);
    }
  }
  await sesionPlan.liberar(app.ciclo, refPlan(sig));
  anunciar("soltado", { ciclo: app.ciclo, sig: sig });
  edicion.carrera = null; edicion.plan = null; edicion.seleccion = null;
  tablero.hora = 0;
  mostrarTablero();
  const texto = resultado === "guardado"
    ? "Los cambios sin guardar se almacenaron como una nueva versión y se liberó el bloqueo del plan."
    : resultado === "sin cambios"
      ? "No había cambios sin guardar. Se liberó el bloqueo del plan."
      : "No se pudieron guardar los cambios: " + resultado;
  await informar("La sesión de edición ha expirado", "Transcurrieron " + CONFIG.minutosBloqueo + " minutos sin actividad. " + esc(texto));
}

/* FA-029 y FA-115: libera el bloqueo y vuelve al tablero, descartando lo no guardado. En
   FA-115 («Salir de la edición», borrarCopia) la copia de recuperación se borra siempre
   (paso 4); en FA-029 («Volver al tablero» desde la carga masiva), solo si había cambios. */
async function salirDeEdicionPlan(borrarCopia){
  const sig = edicion.carrera, confirmado = !!(edicion.plan && edicion.plan.confirmado);
  if (sig && edicion.plan && (borrarCopia || edicion.plan.sucio)) sesionPlan.descartarCopia(app.ciclo, refPlan(sig));
  sesionPlan.detener();
  edicion.carrera = null; edicion.plan = null; edicion.seleccion = null;
  pintarTablero();
  mostrar("planes");
  /* Si el bloqueo aún no estaba confirmado, lo devuelve entrarAEditarPlan cuando responda. */
  if (sig && confirmado) {
    anunciar("soltado", { ciclo: app.ciclo, sig: sig });
    await sesionPlan.liberar(app.ciclo, refPlan(sig));
  }
  cargarTablero();
}

/* FA-115: la ventana «Salir de la edición». */
function confirmarSalidaEdicion(){
  const sucio = !!(edicion.plan && edicion.plan.sucio);
  return preguntar({
    titulo: "Salir de la edición",
    cuerpo: '<div class="nota aviso">' + (sucio || app.vista === "grilla"
      ? "Se descartarán los cambios que no hayas guardado y se liberará el bloqueo del plan."
      : "Se liberará el bloqueo del plan.") + "</div>",
    acciones: [{ texto:"Seguir editando", valor:null }, { texto:"Salir", clase:"peligro", valor:true }]   // FA-116
  });
}

/* FA-115: «Salir de la edición» en la grilla. */
async function salirDeLaEdicion(){
  if (await confirmarSalidaEdicion()) salirDeEdicionPlan(true);
}

/* ============================================================
   Entrar en la edición (pasos 13 a 19, FA-014 a FA-019, FA-104)
   ============================================================ */
/* Se abre al instante con el contenido que trajo el tablero y el bloqueo se pide de
   fondo; hasta que el servidor lo confirma no se puede guardar. Si según el tablero otra
   cuenta tiene el plan, se espera la respuesta antes de abrir. Si esta misma cuenta ya lo
   edita en otra pestaña del navegador, se advierte antes. */
async function entrarAEditarPlan(sig, sinAvisoDePestana){
  if (!sinAvisoDePestana && otraPestanaEditando(app.ciclo, sig)) return avisarOtraPestana(sig);
  const f = filaTablero(sig);
  const b = f && bloqueoVigente(f.bloqueo);
  if (!f || !Array.isArray(f.contenido) || (b && b.correo !== app.usuario.correo)) return entrarAEditarEsperando(sig);

  const pedido = ++pedidoEdicion;
  entrarEnEdicion(sig, { estado: f.estado, version: f.version, asignaturas: clonar(f.contenido) });
  let r;
  try {
    r = await llamarDeFondo("edicionPlanAbrir", app.ciclo, sig, f.version);
  } catch (e) {
    if (pedido !== pedidoEdicion || edicion.carrera !== sig) return;
    const habiaCambios = edicion.plan.sucio;
    salirSinGuardar();
    if (e.codigo === "BLOQUEADO") return avisarBloqueado(sig, e.detalle, habiaCambios);
    mostrarTablero();
    return informarError(e);
  }
  if (pedido !== pedidoEdicion || edicion.carrera !== sig) {
    /* Ya se salió de este plan: el bloqueo que se acaba de tomar se devuelve. */
    if (edicion.carrera !== sig) sesionPlan.liberar(app.ciclo, refPlan(sig));
    return;
  }
  confirmarEdicion(sig, r);
}

async function entrarAEditarEsperando(sig){
  let r;
  try {
    r = await llamar("edicionPlanAbrir", app.ciclo, sig);
  } catch (e) {
    return e.codigo === "BLOQUEADO" ? avisarBloqueado(sig, e.detalle, false) : informarError(e);
  }
  ++pedidoEdicion;
  entrarEnEdicion(sig, { estado: r.estado, version: r.version, asignaturas: r.asignaturas });
  confirmarEdicion(sig, r);
}

/* Paso 19 (plan sin asignaturas: la carga masiva) o FA-018 y FA-019 (la grilla). */
function entrarEnEdicion(sig, plan){
  edicion.carrera = sig;
  edicion.plan = Object.assign({ sucio: false, confirmado: false }, plan);
  edicion.seleccion = null;
  bloques.colapsados.clear();
  edicion.avisoImportacion = "";
  sesionPlan.detener();
  sesionPlan.mensaje("Tomando el bloqueo de edición…");
  if (edicion.plan.asignaturas.length) pintarGrilla();
  else mostrarCargaOferta();
}

function confirmarEdicion(sig, r){
  const p = edicion.plan;
  p.confirmado = true;
  sesionPlan.iniciar(r.expira);
  anunciarEdicion(true);
  if (r.recuperacion && Array.isArray(r.recuperacion.contenido)) recuperarPlan(sig, r.recuperacion);
  if (Array.isArray(r.asignaturas) && r.version !== p.version) {
    /* Entretanto se guardó otra versión. Si todavía no hay cambios, se carga esa; si ya
       los hay, se conservan y al guardar se avisará de la versión más reciente. */
    actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(r.asignaturas), contenido: clonar(r.asignaturas) });
    if (!p.sucio) {
      Object.assign(p, { estado: r.estado, version: r.version, asignaturas: r.asignaturas });
      edicion.seleccion = null;
      if (app.vista === "carga" && p.asignaturas.length) pintarGrilla();
      brindis("Se cargó la versión más reciente del plan, v" + r.version, "info");
    }
  }
  if (app.vista === "grilla") pintarGrilla();
}

/* FA-016 y FA-017: quedaron cambios sin guardar de una sesión anterior. */
async function recuperarPlan(sig, rec){
  const r = await ofrecerRecuperacion(rec, edicion.plan ? edicion.plan.version : 0, "el plan de " + nombreCarrera(sig));
  if (!edicion.plan || edicion.carrera !== sig) return;
  if (r === true) {
    edicion.plan.asignaturas = rec.contenido;
    edicion.plan.sucio = true;
    edicion.seleccion = null;
    pintarGrilla();
    brindis("Cambios recuperados: revísalos y guarda.");
  } else if (r === false) sesionPlan.descartarCopia(app.ciclo, refPlan(sig));
}

/* Sale de la edición sin guardar ni liberar nada: el bloqueo no llegó a tomarse. */
function salirSinGuardar(){
  sesionPlan.detener();
  edicion.carrera = null; edicion.plan = null; edicion.seleccion = null;
}

/* FA-015: otra cuenta tiene el bloqueo; se ofrece la consulta en solo lectura. */
async function avisarBloqueado(sig, bloqueo, habiaCambios){
  actualizarFilaTablero(sig, { bloqueo: bloqueo });
  await preguntar({
    titulo: "El plan está siendo editado",
    cuerpo: '<div class="nota aviso">Lo está editando <b>' + esc(bloqueo.correo) + "</b> desde las " +
            esc(hora(bloqueo.desde)) + ". Puedes consultarlo en solo lectura." +
            (habiaCambios ? " Los cambios que alcanzaste a hacer no se guardaron." : "") + "</div>",
    acciones: [{ texto:"Consultar en solo lectura", clase:"primario", valor:true }]
  });
  return abrirConsulta(sig);
}

/* ============================================================
   Guardado y registro (pasos 43 a 53, FA-097 a FA-114)
   ============================================================ */
/* FA-101 pasos 10 y 11: planes de otras carreras que cambiaron por una fusión. */
function aplicarOtros(otros){
  (otros || []).forEach(o => {
    actualizarFilaTablero(o.sig, { estado: o.estado, version: o.version, totales: o.totales, contenido: o.contenido });
    anunciar("guardado", { ciclo: app.ciclo, sig: o.sig, estado: o.estado, version: o.version, totales: o.totales, contenido: o.contenido });
  });
  if ((otros || []).length) brindis("La fusión se guardó también en " + otros.map(o => o.sig + " (v" + o.version + ")").join(", ") + ".", "info");
}

/* Pasos 47 a 51 (y FA-105 pasos 5 a 9, FA-110 pasos 6 a 11): si mientras se editaba se
   guardó otra versión (por ejemplo, una actualización desde la hoja), se advierte y el
   usuario decide si guarda igualmente (FA-099, FA-108, FA-113). */
async function guardarVersionPlan(datos){
  const p = edicion.plan, sig = edicion.carrera;
  const base = { asignaturas: p.asignaturas, versionBase: p.version, fusionesDisueltas: p.fusionesDisueltas || [] };
  let r;
  try {
    r = await llamar("edicionPlanGuardar", app.ciclo, sig, Object.assign({}, base, datos));
  } catch (e) {
    if (e.codigo !== "CONFLICTO") throw e;
    if (!await confirmarConflicto(e.detalle, "del plan")) return null;   // FA-100, FA-109, FA-114
    r = await llamar("edicionPlanGuardar", app.ciclo, sig, Object.assign({}, base, datos, { forzar: true }));
  }
  Object.assign(p, { version: r.version, estado: r.estado, sucio: false, fusionesDisueltas: [] });
  if (Array.isArray(r.asignaturas)) p.asignaturas = r.asignaturas;
  sesionPlan.olvidarCopia();
  sesionPlan.renovada(r.expira);
  actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(p.asignaturas), contenido: clonar(p.asignaturas) });
  anunciarGuardado(sig, r.estado, r.version, p.asignaturas);
  aplicarOtros(r.otros);
  return r;
}

/* FA-105 a FA-109: «Guardar borrador». */
async function guardarBorrador(){
  const p = edicion.plan;
  if (!p.asignaturas.length) return brindis("El plan no tiene asignaturas que guardar.", "aviso");   // FA-106
  const ok = await preguntar({
    titulo: "Guardar borrador",
    cuerpo: '<div class="nota">El plan se guardará como una versión nueva en estado <b>Borrador</b>. ' +
      "Todavía no habilitará la asignación docente.</div>",
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Guardar", clase:"primario", valor:true }]   // FA-107
  });
  if (!ok) return;
  let r;
  try { r = await guardarVersionPlan({ estado: ESTADOS.BORRADOR, tipo: Dominio.TIPO_VERSION.BORRADOR }); } catch (e) { return informarError(e); }
  if (!r) return;
  brindis("Borrador guardado como v" + r.version);
  pintarGrilla();
}

/* Pasos 43 a 53 («Registrar plan») o, en un plan Registrado, FA-110 a FA-114 («Guardar cambios»). */
async function registrarPlan(){
  const p = edicion.plan;
  if (!p.asignaturas.length) return brindis("El plan no tiene asignaturas que registrar.", "aviso");   // FA-097, FA-111
  const t = totales(p.asignaturas);

  if (p.estado === ESTADOS.REGISTRADO) {
    const r = await preguntar({
      titulo: "Guardar cambios",
      cuerpo: '<div class="nota">Se guardará una versión nueva del plan <b>Registrado</b>.</div>' +
        '<div class="campo"><label for="motivo">Motivo del cambio (opcional)</label>' +
        '<input type="text" id="motivo" placeholder="Matrícula extemporánea"></div>',
      acciones: [{ texto:"Cancelar", valor:null }, { texto:"Confirmar", clase:"primario", valor:() => $("#motivo").value.trim() }]   // FA-112
    });
    if (!r) return;
    let g;
    try { g = await guardarVersionPlan({ estado: ESTADOS.REGISTRADO, tipo: Dominio.TIPO_VERSION.CAMBIOS, motivo: r() }); } catch (e) { return informarError(e); }
    if (!g) return;
    brindis("Cambios guardados como v" + g.version);
    return pintarGrilla();
  }

  const mensaje = "¿Desea registrar el Plan de Ciclo de " + nombreCarrera(edicion.carrera) + " para el periodo " + app.ciclo +
    "? Al confirmar, el estado cambiará a REGISTRADO y se habilitará la asignación docente para los Departamentos " +
    "Académicos (DIMA, DAHUC, DACJ, DACTE). El plan podrá seguir editándose y cada guardado generará una nueva versión.";

  const ok = await preguntar({   // paso 45
    titulo: "Registrar el plan de ciclo",
    cuerpo:
      '<div class="tabla-caja"><table><tbody>' +
        "<tr><td>Asignaturas</td><td class='num'>" + t.asig + "</td><td>Grupos</td><td class='num'>" + t.grupos + "</td></tr>" +
        "<tr><td>Horas teóricas</td><td class='num'>" + t.ht + "</td><td>Horas prácticas</td><td class='num'>" + t.hp + "</td></tr>" +
        "<tr><td>Total horas</td><td class='num'>" + t.th + "</td><td>Horas de dictado</td><td class='num'>" + t.dictado + "</td></tr>" +
        "<tr><td>Fusiones</td><td class='num'>" + t.fus + "</td><td>Desdobles</td><td class='num'>" + t.des + "</td></tr>" +
      "</tbody></table></div>" +
      '<div class="cita mt-3">' + esc(mensaje) + "</div>",
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Confirmar y registrar", clase:"primario", valor:true }]   // FA-098
  });
  if (!ok) return;

  let g;
  try { g = await guardarVersionPlan({ estado: ESTADOS.REGISTRADO, tipo: Dominio.TIPO_VERSION.REGISTRAR }); } catch (e) { return informarError(e); }
  if (!g) return;
  const sig = edicion.carrera;
  sesionPlan.detener();
  edicion.plan = null;
  mostrar("exito");   // paso 52
  $("#exito-nota").innerHTML =
    "<b>Plan registrado.</b> " + esc(nombreCarrera(sig)) + " · " + esc(app.ciclo) + " · versión <b>v" + g.version + "</b>. " +
    "La asignación docente queda habilitada para DIMA, DAHUC, DACJ y DACTE. El plan sigue siendo editable: cada guardado generará una versión nueva.";
  celebrar();
  anunciar("soltado", { ciclo: app.ciclo, sig: sig });
  await sesionPlan.liberar(app.ciclo, refPlan(sig));   // paso 53
}

/* ============================================================
   Pestañas del navegador
   ============================================================ */
const editandoEnOtrasPestanas = new Map();   // "ciclo|sig" → {de, correo, expira}

/**
 * Avisa a las otras pestañas de que esta edita el plan. «nuevo» distingue la toma del
 * bloqueo de sus renovaciones y de las respuestas a «hola».
 * @param {boolean=} nuevo
 * @returns {void}
 */
function anunciarEdicion(nuevo){
  if (!edicion.carrera || !sesionPlan.activa) return;
  if (nuevo || !sesionPlan.desde) sesionPlan.desde = Dominio.isoPeru();
  anunciar("editando", {
    ciclo: app.ciclo, sig: edicion.carrera, desde: sesionPlan.desde,
    expira: new Date(sesionPlan.expira).toISOString(), nuevo: !!nuevo
  });
}

/**
 * Avisa a las otras pestañas de que se guardó una versión de un plan, con su contenido.
 * @param {string} sig
 * @param {string} estado
 * @param {number} version
 * @param {Array<Object>} asignaturas
 * @returns {void}
 */
function anunciarGuardado(sig, estado, version, asignaturas){
  anunciar("guardado", {
    ciclo: app.ciclo, sig: sig, estado: estado, version: version,
    totales: totales(asignaturas), contenido: clonar(asignaturas)
  });
}

/* ¿Esta misma cuenta edita el plan en otra pestaña? */
function otraPestanaEditando(ciclo, sig){
  const e = editandoEnOtrasPestanas.get(ciclo + "|" + sig);
  return !!(e && app.usuario && e.correo === app.usuario.correo && Date.parse(e.expira) > Date.now());
}

/* Advertir, no prohibir: se puede editar de todos modos. */
async function avisarOtraPestana(sig){
  const r = await preguntar({
    titulo: "Ya editas este plan en otra pestaña",
    cuerpo: '<div class="nota aviso">El plan de <b>' + esc(nombreCarrera(sig)) + "</b> está abierto en edición en otra pestaña de este navegador. " +
      "Si también lo editas aquí, lo que guardes en una pestaña puede pisar lo que guardes en la otra.</div>",
    acciones: [{ texto:"Editar aquí de todos modos", valor:"editar" }, { texto:"Consultar en solo lectura", clase:"primario", valor:"leer" }]
  });
  if (r === "editar") return entrarAEditarPlan(sig, true);
  if (r === "leer") return abrirConsulta(sig);
}

alRecibirDePestana("hola", () => anunciarEdicion(false));
alRecibirDePestana("editando", m => editandoEnOtrasPestanas.set(m.ciclo + "|" + m.sig, { de: m.de, correo: m.correo, expira: m.expira }));
alRecibirDePestana("soltado", m => editandoEnOtrasPestanas.delete(m.ciclo + "|" + m.sig));
alRecibirDePestana("guardado", m => {
  if (edicion.plan && edicion.carrera === m.sig && app.ciclo === m.ciclo && !viendoConsulta(m.sig, m.ciclo))
    brindis("Otra pestaña guardó la v" + m.version + " de este plan. Si guardas aquí, se te avisará antes.", "aviso");
});

/* ============================================================
   Celebración al registrar: confeti con los colores de la marca
   ============================================================ */
function celebrar(){
  if (reducirMovimiento() || document.hidden) return;
  const lienzo = document.createElement("canvas");
  lienzo.className = "confeti";
  lienzo.setAttribute("aria-hidden", "true");
  const escala = Math.min(2, window.devicePixelRatio || 1), ancho = innerWidth, alto = innerHeight;
  lienzo.width = ancho * escala; lienzo.height = alto * escala;
  document.body.appendChild(lienzo);
  const ctx = lienzo.getContext("2d");
  ctx.scale(escala, escala);
  const colores = ["#0280BD", "#0778B2", "#15567C", "#7CCBF2", "#FFFFFF"];
  const origen = { x: ancho / 2, y: Math.min(alto * 0.35, 300) };
  const piezas = Array.from({ length: 110 }, () => {
    const angulo = Math.random() * Math.PI * 2, rapidez = 3 + Math.random() * 8;
    return {
      x: origen.x, y: origen.y, vx: Math.cos(angulo) * rapidez, vy: Math.sin(angulo) * rapidez - 6,
      g: 0.16 + Math.random() * 0.1, giro: Math.random() * Math.PI, vgiro: (Math.random() - 0.5) * 0.3,
      t: 6 + Math.random() * 7, color: colores[Math.floor(Math.random() * colores.length)], triangulo: Math.random() < 0.5
    };
  });
  const inicio = performance.now(), duracion = 1900;
  const paso = ahora => {
    const transcurrido = ahora - inicio;
    ctx.clearRect(0, 0, ancho, alto);
    ctx.globalAlpha = Math.max(0, 1 - transcurrido / duracion);
    piezas.forEach(p => {
      p.vy += p.g; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.giro += p.vgiro;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.giro);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = "rgba(21, 86, 124, 0.35)";
      ctx.beginPath();
      if (p.triangulo) { ctx.moveTo(0, -p.t / 1.6); ctx.lineTo(p.t / 1.8, p.t / 2.2); ctx.lineTo(-p.t / 1.8, p.t / 2.2); ctx.closePath(); }
      else ctx.rect(-p.t / 2, -p.t / 4, p.t, p.t / 2);
      ctx.fill();
      if (p.color === "#FFFFFF") ctx.stroke();
      ctx.restore();
    });
    if (transcurrido < duracion) requestAnimationFrame(paso); else lienzo.remove();
  };
  requestAnimationFrame(paso);
  setTimeout(() => lienzo.remove(), duracion + 600);
}
</script>
