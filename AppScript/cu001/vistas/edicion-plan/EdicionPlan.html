<!-- ===== Edición del plan: Grilla de Vista Previa (CU-001 paso 41) y «¡Plan registrado!» (paso 52) ===== -->
<section class="vista" id="v-grilla" hidden :hidden="$store.nav.vista !== 'grilla'">
  <header class="vista-cab">
    <div>
      <button type="button" class="btn fantasma btn-sm volver" id="volver-grilla" data-accion="salirDeLaEdicion"><?!= icono_("sign-out") ?>Salir de la edición</button>
      <p class="sobretitulo"><?!= icono_("pencil-simple") ?>Edición del plan de ciclo</p>
      <h1 class="titulo" id="grilla-titulo">Vista previa del plan</h1>
    </div>
    <div class="vista-acciones">
      <span class="chip-reloj"><?!= icono_("timer") ?><span class="reloj" id="reloj-grilla"></span></span>
    </div>
  </header>

  <div class="nota aviso" id="nota-estado" hidden></div>
  <div class="nota aviso" id="nota-importacion" hidden></div>
  <dl class="resumen" id="resumen"></dl>

  <div class="barra-herramientas" role="toolbar" aria-label="Acciones del plan">
    <button type="button" class="btn btn-sm" id="btn-colapsar" data-accion="colapsarTodo"></button>
    <span class="separador" aria-hidden="true"></span>
    <button type="button" class="btn btn-sm" data-accion="agregarAsignatura"><?!= icono_("plus") ?>Agregar asignatura</button>
    <button type="button" class="btn btn-sm" data-accion="agregarGrupoAlSemestre"><?!= icono_("plus-circle") ?>Agregar grupo al semestre</button>
    <button type="button" class="btn btn-sm" data-accion="fusionarGrupos"><?!= icono_("git-merge") ?>Fusionar grupos</button>
    <button type="button" class="btn btn-sm" data-accion="historialDeVersiones"><?!= icono_("clock-counter-clockwise") ?>Historial de versiones</button>
  </div>

  <!-- La grilla se pinta con innerHTML (PlanBloques.html); x-ignore: Alpine no la recorre. -->
  <div id="bloques" class="bloques" x-ignore></div>

  <div class="dock" id="dock-grilla">
    <div class="dock-fila">
      <div class="dock-seleccion" id="dock-seleccion"></div>
      <div class="dock-guardar">
        <button type="button" class="btn btn-sm" data-accion="reemplazarContenido"><?!= icono_("swap") ?>Reemplazar contenido</button>
        <button type="button" class="btn btn-sm" id="btn-borrador" data-accion="guardarBorrador"><?!= icono_("floppy-disk") ?>Guardar borrador</button>
        <button type="button" class="btn primario" id="btn-registrar" data-accion="registrarPlan"></button>
      </div>
    </div>
    <div class="dock-acciones" id="acciones-fila" role="toolbar" aria-label="Acciones sobre el grupo seleccionado">
      <button type="button" class="btn btn-sm" data-accion="editarHoras" data-req="sel"><?!= icono_("pencil-simple") ?>Editar HT / HP</button>
      <button type="button" class="btn btn-sm" data-accion="editarAsignatura" data-req="sel"><?!= icono_("list-checks") ?>Editar asignatura</button>
      <button type="button" class="btn btn-sm" data-accion="agregarGrupo" data-req="sel"><?!= icono_("plus") ?>Agregar grupo</button>
      <button type="button" class="btn btn-sm" data-accion="desdoblar" data-req="sel"><?!= icono_("arrows-split") ?>Desdoblar</button>
      <button type="button" class="btn btn-sm" data-accion="quitarDesdoble" data-req="des"><?!= icono_("arrows-merge") ?>Quitar desdoble</button>
      <button type="button" class="btn btn-sm" data-accion="deshacerFusion" data-req="fus"><?!= icono_("link-break") ?>Deshacer fusión</button>
      <button type="button" class="btn btn-sm peligro" data-accion="eliminarGrupo" data-req="sel"><?!= icono_("trash") ?>Eliminar grupo</button>
      <button type="button" class="btn btn-sm peligro" data-accion="eliminarAsignatura" data-req="sel"><?!= icono_("trash") ?>Eliminar asignatura</button>
    </div>
  </div>
</section>

<section class="vista" id="v-exito" hidden :hidden="$store.nav.vista !== 'exito'">
  <div class="tarjeta exito">
    <div class="exito-sello"><?!= icono_("seal-check") ?></div>
    <p class="sobretitulo">Registrar plan de ciclo</p>
    <h1 class="titulo">¡Plan registrado!</h1>
    <div class="nota ok" id="exito-nota"></div>
    <div class="exito-acciones">
      <button type="button" class="btn" data-accion="volverAlTablero"><?!= icono_("arrow-left") ?>Volver al tablero</button>
      <button type="button" class="btn" id="exito-editar" data-accion="seguirEditando"><?!= icono_("pencil-simple") ?>Seguir editando el plan</button>
      <button type="button" class="btn primario" data-accion="asignarDocentes"><?!= icono_("chalkboard-teacher") ?>Asignar docentes</button>
    </div>
  </div>
</section>

<script>
"use strict";
/* ============================================================
   Edición del plan de ciclo: estado, Grilla de Vista Previa y los botones de la pantalla.
   Las acciones sobre el plan están en EdicionPlanAcciones.html; la sesión con bloqueo, el
   guardado y el registro, en EdicionPlanSesion.html. Todas sus llamadas al servidor van a
   EdicionPlanServidor.js (edicionPlanAbrir, edicionPlanGuardar, edicionPlanHistorial,
   edicionPlanRestaurar) y a base/Sesiones.js.
   ============================================================ */
/**
 * Estado de la edición del plan.
 * @type {{carrera: (string|null), plan: (Object|null), seleccion: ({ci: number, gi: number}|null), avisoImportacion: string}}
 */
const edicion = {
  carrera: null,          // sigla del plan en edición
  plan: null,             // {estado, version, asignaturas, sucio, confirmado, fusionesDisueltas}
  seleccion: null,        // grupo seleccionado en la grilla: {ci, gi}
  avisoImportacion: ""    // nota de las filas de otras carreras que se ignoraron (FA-039)
};

enlazarAcciones($("#v-grilla"), () => ({
  salirDeLaEdicion,                                         // FA-115
  colapsarTodo,                                             // FA-090, FA-091
  alternarBloque: (d, e, el) => { alternarBloque(el); pintarBotonColapsar(); },   // FA-088, FA-089
  seleccionarGrupo: d => seleccionarGrupo(+d.ci, +d.gi),    // FA-054
  agregarAsignatura,                                        // FA-059
  agregarGrupoAlSemestre,                                   // FA-067
  fusionarGrupos,                                           // FA-079
  historialDeVersiones,                                     // FA-092
  reemplazarContenido,                                      // FA-095
  guardarBorrador,                                          // FA-105
  registrarPlan,                                            // paso 43 (o FA-110 en un plan Registrado)
  editarHoras,                                              // FA-055
  editarAsignatura,                                         // FA-057
  agregarGrupo,                                             // FA-066
  desdoblar,                                                // FA-073
  quitarDesdoble,                                           // FA-077
  deshacerFusion,                                           // FA-086
  eliminarGrupo,                                            // FA-071
  eliminarAsignatura                                        // FA-064
}));
enlazarAcciones($("#v-exito"), () => ({
  volverAlTablero: () => mostrarTablero(),                  // paso 52
  seguirEditando: () => { if (edicion.carrera) entrarAEditarPlan(edicion.carrera); },   // FA-104
  asignarDocentes: () => irA("docentes")                    // paso 52 → CU-002
}));

/**
 * Paso 41: pinta el plan en edición: estado (FA-018, FA-019), nota de importación (FA-039),
 * Panel de Resumen Global, bloques por semestre y acciones según la selección (FA-054).
 * @returns {void}
 */
function pintarGrilla(){
  const p = edicion.plan;
  if (!p) return;
  mostrar("grilla");
  $("#grilla-titulo").textContent = nombreCarrera(edicion.carrera) + " · " + app.ciclo;
  /* Hasta que el servidor confirma el bloqueo se puede editar, pero no guardar. */
  const listo = !!p.confirmado;
  const registrado = p.estado === ESTADOS.REGISTRADO;
  $("#btn-registrar").innerHTML = registrado ? icono("floppy-disk") + "Guardar cambios" : icono("seal-check") + "Registrar plan";
  $("#btn-registrar").disabled = !listo;
  $("#btn-borrador").disabled = !listo || registrado;
  $('[data-accion="historialDeVersiones"]').disabled = !listo;

  const nota = $("#nota-estado");
  if (registrado) {
    nota.hidden = false;
    nota.className = "nota ok";
    nota.innerHTML = "El plan está <b>Registrado</b> (v" + p.version +
      "). Sigue siendo editable: cada guardado genera una versión nueva.";
  } else if (p.estado === ESTADOS.BORRADOR) {
    nota.hidden = false;
    nota.className = "nota aviso";
    nota.innerHTML = "El plan está en <b>Borrador</b> (v" + p.version + "). Todavía no habilita la asignación docente.";
  } else nota.hidden = true;

  $("#nota-importacion").hidden = !edicion.avisoImportacion;
  $("#nota-importacion").textContent = edicion.avisoImportacion;

  pintarResumen($("#resumen"), p.asignaturas);
  $("#bloques").innerHTML = htmlBloques(p.asignaturas, true, { docentes: docentesDelPlan(edicion.carrera) || {}, seleccion: edicion.seleccion });
  pintarBotonColapsar();

  const s = grupoSeleccionado();
  $$("#acciones-fila [data-req]").forEach(b => {
    const req = b.dataset.req;
    b.disabled = req === "sel" ? !s : req === "fus" ? !(s && s.g.fusion) : !(s && s.g.desdoble);
  });
  $("#dock-seleccion").innerHTML = s
    ? icono("check-circle") + "<span>Grupo <b>" + esc(s.g.n) + "</b> de <b>" + esc(s.a.codigo) + " " + esc(s.a.nombre) +
      "</b> · HT " + esc(s.g.ht) + " · HP " + esc(s.g.hp) + " · total " + th(s.g) + "</span>"
    : icono("info") + "<span>Selecciona un grupo de la grilla para editarlo, desdoblarlo o eliminarlo.</span>";
}

/* Tras una acción que cambió el plan: queda con cambios sin guardar y se vuelve a pintar. */
function planModificado(){
  edicion.plan.sucio = true;
  edicion.avisoImportacion = "";
  pintarGrilla();
}

/**
 * Texto del botón que pliega o despliega todos los semestres (FA-090, FA-091).
 * @returns {void}
 */
function pintarBotonColapsar(){
  const hay = bloques.colapsados.size > 0;
  $("#btn-colapsar").innerHTML = icono(hay ? "arrows-out-line-vertical" : "arrows-in-line-vertical") + (hay ? "Expandir todo" : "Colapsar todo");
}

/* El grupo seleccionado, con su asignatura y sus índices, o null. */
function grupoSeleccionado(){
  const p = edicion.plan;
  if (!p || !edicion.seleccion) return null;
  const a = p.asignaturas[edicion.seleccion.ci];
  if (!a) return null;
  const g = a.grupos[edicion.seleccion.gi];
  if (!g) return null;
  return { a, g, ci:edicion.seleccion.ci, gi:edicion.seleccion.gi };
}
const notaSeleccion = s => '<div class="nota">Selección: <b>' + esc(s.a.codigo) + " " + esc(s.a.nombre) +
  "</b> · grupo " + esc(s.g.n) + " · HT " + esc(s.g.ht) + " / HP " + esc(s.g.hp) + " / total " + th(s.g) + ".</div>";

/**
 * Docentes ya asignados a los grupos del plan en edición. Quien la use para advertir llama
 * antes a asegurarDocentesAsignados.
 * @param {Array<{id: string}>} grupos
 * @returns {string[]}
 */
function docentesDe(grupos){
  const mapa = docentesDelPlan(edicion.carrera) || {};
  const res = [];
  grupos.forEach(g => (mapa[g.id] || []).forEach(n => { if (!res.includes(n)) res.push(n); }));
  return res;
}
const notaDocentes = (nombres, que) => nombres.length
  ? '<div class="nota aviso">' + que + " tiene docente asignado: <b>" + nombres.map(esc).join(", ") +
    "</b>. La asignación no se borra: queda pendiente para que el director la reasigne.</div>"
  : "";

/* Al llegar los docentes asignados, se repinta la grilla si cambiaron los de este plan. */
alCambiarDocentesAsignados(anterior => {
  if (app.vista === "grilla" && edicion.plan && cambiaronDocentesDe(edicion.carrera, anterior)) pintarGrilla();
});
</script>
