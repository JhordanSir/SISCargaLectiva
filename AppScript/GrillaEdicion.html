<script>
"use strict";
/* ============================================================
   Edición del plan de ciclo: sesión con bloqueo, entrar y salir de la edición,
   guardado y registro
   ============================================================ */
let pedidoEdicion = 0;   // descarta las respuestas de abrirEdicion que llegan tarde

const sesionPlan = crearSesionEdicion({
  relojes: "#reloj-carga, #reloj-pegado, #reloj-grilla",
  renovar: () => llamarEnSilencio("renovarBloqueo", app.ciclo, app.carrera),
  alRenovar: () => anunciarEdicion(false),
  alPerder: correo => bloqueoPerdido(correo),
  alExpirar: () => expirar(),
  copia: () => {
    const p = app.plan;
    return p && p.sucio && p.confirmado && app.carrera ? { contenido: p.asignaturas, versionBase: p.version } : null;
  },
  guardarCopia: d => llamarEnSilencio("guardarRecuperacion", app.ciclo, Dominio.REF.plan(app.carrera), d)
});
/* La actividad en la carga masiva o en la grilla también renueva el bloqueo. */
const latido = () => sesionPlan.latido();

async function bloqueoPerdido(correo){
  const sig = app.carrera;
  app.carrera = null; app.plan = null; app.seleccion = null;
  app.tableroHora = 0;
  anunciar("soltado", { ciclo: app.ciclo, sig: sig });
  mostrarTablero();
  await informar("Se perdió el bloqueo de edición", "Tu bloqueo caducó y ahora el plan lo está editando <b>" + esc(correo) +
    "</b>. Lo que no habías guardado queda en la copia de recuperación: podrás recuperarlo la próxima vez que lo edites.");
}

/* Pasó el tiempo sin actividad: se guarda lo pendiente como una versión nueva y se suelta el plan. */
async function expirar(){
  const sig = app.carrera, p = app.plan;
  let resultado = "sin cambios";
  if (p && p.sucio && p.asignaturas.length) {
    try {
      const r = await llamar("guardarPlan", app.ciclo, sig, {
        asignaturas: p.asignaturas, versionBase: p.version, forzar: true, tipo: Dominio.TIPO_VERSION.AUTOGUARDADO,
        estado: p.estado === ESTADOS.REGISTRADO ? ESTADOS.REGISTRADO : ESTADOS.BORRADOR,
        fusionesDisueltas: p.fusionesDisueltas || []
      });
      actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(r.asignaturas), contenido: clonar(r.asignaturas) });
      anunciarGuardado(sig, r.estado, r.version, r.asignaturas);
      aplicarOtros(r.otros);
      resultado = "guardado";
    } catch (e) {
      resultado = (e && e.message) || String(e);
    }
  }
  try { await llamarEnSilencio("liberarBloqueo", app.ciclo, sig); } catch (e) { /* caduca solo */ }
  anunciar("soltado", { ciclo: app.ciclo, sig: sig });
  app.carrera = null; app.plan = null; app.seleccion = null;
  app.tableroHora = 0;
  mostrarTablero();
  const texto = resultado === "guardado"
    ? "Los cambios sin guardar se almacenaron como una nueva versión y se liberó el bloqueo del plan."
    : resultado === "sin cambios"
      ? "No había cambios sin guardar. Se liberó el bloqueo del plan."
      : "No se pudieron guardar los cambios: " + resultado;
  await informar("La sesión de edición ha expirado", "Transcurrieron " + CONFIG.minutosBloqueo + " minutos sin actividad. " + esc(texto));
}

/* Libera el bloqueo y vuelve al tablero, descartando lo no guardado. */
async function terminarEdicion(){
  const sig = app.carrera, confirmado = !!(app.plan && app.plan.confirmado);
  if (sig && app.plan && app.plan.sucio) llamarEnSilencio("descartarRecuperacion", app.ciclo, Dominio.REF.plan(sig)).catch(() => {});
  sesionPlan.detener();
  app.carrera = null; app.plan = null; app.seleccion = null;
  pintarTablero();
  mostrar("planes");
  /* Si el bloqueo aún no estaba confirmado, lo devuelve abrirEdicion cuando responda. */
  if (sig && confirmado) {
    anunciar("soltado", { ciclo: app.ciclo, sig: sig });
    try { await llamarEnSilencio("liberarBloqueo", app.ciclo, sig); } catch (e) { /* caduca solo */ }
  }
  cargarTablero();
}

function confirmarSalidaEdicion(){
  const sucio = !!(app.plan && app.plan.sucio);
  return preguntar({
    titulo: "Salir de la edición",
    cuerpo: '<div class="nota aviso">' + (sucio || app.vista === "grilla"
      ? "Se descartarán los cambios que no hayas guardado y se liberará el bloqueo del plan."
      : "Se liberará el bloqueo del plan.") + "</div>",
    acciones: [{ texto:"Seguir editando", valor:null }, { texto:"Salir", clase:"peligro", valor:true }]
  });
}

window.addEventListener("pagehide", () => {
  if (sesionPlan.activa && app.carrera) {
    anunciar("soltado", { ciclo: app.ciclo, sig: app.carrera });
    google.script.run.liberarBloqueo(app.ciclo, app.carrera);   // sin esperar respuesta: la página se cierra
  }
});

/* ============================================================
   Entrar en la edición
   ============================================================ */
/* Se abre al instante con el contenido que trajo el tablero y el bloqueo se pide de
   fondo; hasta que el servidor lo confirma no se puede guardar. Si según el tablero otra
   cuenta tiene el plan, se espera la respuesta antes de abrir. Si esta misma cuenta ya lo
   edita en otra pestaña del navegador, se advierte antes. */
async function abrirEdicion(sig, sinAvisoDePestana){
  if (!sinAvisoDePestana && otraPestanaEditando(app.ciclo, sig)) return avisarOtraPestana(sig);
  const f = filaTablero(sig);
  const b = f && bloqueoVigente(f.bloqueo);
  if (!f || !Array.isArray(f.contenido) || (b && b.correo !== app.usuario.correo)) return abrirEdicionEsperando(sig);

  const pedido = ++pedidoEdicion;
  entrarEnEdicion(sig, { estado: f.estado, version: f.version, asignaturas: clonar(f.contenido) });
  let r;
  try {
    r = await llamarDeFondo("abrirEdicion", app.ciclo, sig, f.version);
  } catch (e) {
    if (pedido !== pedidoEdicion || app.carrera !== sig) return;
    const habiaCambios = app.plan.sucio;
    salirSinGuardar();
    if (e.codigo === "BLOQUEADO") return avisarBloqueado(sig, e.detalle, habiaCambios);
    mostrarTablero();
    return informarError(e);
  }
  if (pedido !== pedidoEdicion || app.carrera !== sig) {
    /* Ya se salió de este plan: el bloqueo que se acaba de tomar se devuelve. */
    if (app.carrera !== sig) llamarEnSilencio("liberarBloqueo", app.ciclo, sig).catch(e => console.warn("liberarBloqueo:", e));
    return;
  }
  confirmarEdicion(sig, r);
}

async function abrirEdicionEsperando(sig){
  let r;
  try {
    r = await llamar("abrirEdicion", app.ciclo, sig);
  } catch (e) {
    return e.codigo === "BLOQUEADO" ? avisarBloqueado(sig, e.detalle, false) : informarError(e);
  }
  ++pedidoEdicion;
  entrarEnEdicion(sig, { estado: r.estado, version: r.version, asignaturas: r.asignaturas });
  confirmarEdicion(sig, r);
}

function entrarEnEdicion(sig, plan){
  app.carrera = sig;
  app.plan = Object.assign({ sucio: false, confirmado: false }, plan);
  app.seleccion = null;
  app.colapsados.clear();
  app.avisoImportacion = "";
  sesionPlan.detener();
  sesionPlan.mensaje("Tomando el bloqueo de edición…");
  if (app.plan.asignaturas.length) pintarGrilla();
  else irACarga();
}

function confirmarEdicion(sig, r){
  const p = app.plan;
  p.confirmado = true;
  sesionPlan.iniciar(r.expira);
  anunciarEdicion(true);
  if (r.recuperacion && Array.isArray(r.recuperacion.contenido)) recuperarPlan(sig, r.recuperacion);
  if (Array.isArray(r.asignaturas) && r.version !== p.version) {
    /* Entretanto se guardó otra versión. Si todavía no hay cambios, se carga esa; si ya
       los hay, se conservan y al guardar se avisará de la versión más reciente. */
    actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(r.asignaturas), contenido: clonar(r.asignaturas) });
    if (!p.sucio) {
      Object.assign(p, { estado: r.estado, version: r.version, asignaturas: r.asignaturas });
      app.seleccion = null;
      if (app.vista === "carga" && p.asignaturas.length) pintarGrilla();
      aviso("Se cargó la versión más reciente del plan, v" + r.version, "info");
    }
  }
  if (app.vista === "grilla") pintarGrilla();
}

/* Quedaron cambios sin guardar de una sesión anterior (la página se cerró o se cayó). */
async function recuperarPlan(sig, rec){
  const r = await ofrecerRecuperacion(rec, app.plan ? app.plan.version : 0, "el plan de " + nombreCarrera(sig));
  if (!app.plan || app.carrera !== sig) return;
  if (r === true) {
    app.plan.asignaturas = rec.contenido;
    app.plan.sucio = true;
    app.seleccion = null;
    pintarGrilla();
    aviso("Cambios recuperados: revísalos y guarda.");
  } else if (r === false) llamarEnSilencio("descartarRecuperacion", app.ciclo, Dominio.REF.plan(sig)).catch(() => {});
}

/* Sale de la edición sin guardar ni liberar nada: el bloqueo no llegó a tomarse. */
function salirSinGuardar(){
  sesionPlan.detener();
  app.carrera = null; app.plan = null; app.seleccion = null;
}

async function avisarBloqueado(sig, bloqueo, habiaCambios){
  actualizarFilaTablero(sig, { bloqueo: bloqueo });
  await preguntar({
    titulo: "El plan está siendo editado",
    cuerpo: '<div class="nota aviso">Lo está editando <b>' + esc(bloqueo.correo) + "</b> desde las " +
            esc(hora(bloqueo.desde)) + ". Puedes consultarlo en solo lectura." +
            (habiaCambios ? " Los cambios que alcanzaste a hacer no se guardaron." : "") + "</div>",
    acciones: [{ texto:"Consultar en solo lectura", clase:"primario", valor:true }]
  });
  return abrirLectura(sig);
}

/* ============================================================
   Guardado y versionado
   ============================================================ */
/* Planes de otras carreras que cambiaron por una fusión: se actualiza su fila del tablero. */
function aplicarOtros(otros){
  (otros || []).forEach(o => {
    actualizarFilaTablero(o.sig, { estado: o.estado, version: o.version, totales: o.totales, contenido: o.contenido });
    anunciar("guardado", { ciclo: app.ciclo, sig: o.sig, estado: o.estado, version: o.version, totales: o.totales, contenido: o.contenido });
  });
  if ((otros || []).length) aviso("La fusión se guardó también en " + otros.map(o => o.sig + " (v" + o.version + ")").join(", ") + ".", "info");
}

/* Si mientras se editaba se guardó otra versión (por ejemplo, una actualización desde
   el xlsx), se advierte y el usuario decide si guarda igualmente. */
async function guardar(datos){
  const p = app.plan, sig = app.carrera;
  const base = { asignaturas: p.asignaturas, versionBase: p.version, fusionesDisueltas: p.fusionesDisueltas || [] };
  let r;
  try {
    r = await llamar("guardarPlan", app.ciclo, sig, Object.assign({}, base, datos));
  } catch (e) {
    if (e.codigo !== "CONFLICTO") throw e;
    if (!await confirmarConflicto(e.detalle, "del plan")) return null;
    r = await llamar("guardarPlan", app.ciclo, sig, Object.assign({}, base, datos, { forzar: true }));
  }
  Object.assign(p, { version: r.version, estado: r.estado, sucio: false, fusionesDisueltas: [] });
  if (Array.isArray(r.asignaturas)) p.asignaturas = r.asignaturas;
  sesionPlan.olvidarCopia();
  sesionPlan.renovada(r.expira);
  actualizarFilaTablero(sig, { estado: r.estado, version: r.version, totales: totales(p.asignaturas), contenido: clonar(p.asignaturas) });
  anunciarGuardado(sig, r.estado, r.version, p.asignaturas);
  aplicarOtros(r.otros);
  return r;
}

$("#btn-borrador").onclick = async () => {
  const p = app.plan;
  if (!p.asignaturas.length) return aviso("El plan no tiene asignaturas que guardar.", "aviso");
  const ok = await preguntar({
    titulo: "Guardar borrador",
    cuerpo: '<div class="nota">El plan se guardará como una versión nueva en estado <b>Borrador</b>. ' +
      "Todavía no habilitará la asignación docente.</div>",
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Guardar", clase:"primario", valor:true }]
  });
  if (!ok) return;
  let r;
  try { r = await guardar({ estado: ESTADOS.BORRADOR, tipo: Dominio.TIPO_VERSION.BORRADOR }); } catch (e) { return informarError(e); }
  if (!r) return;
  aviso("Borrador guardado como v" + r.version);
  pintarGrilla();
};

$("#btn-registrar").onclick = async () => {
  const p = app.plan;
  if (!p.asignaturas.length) return aviso("El plan no tiene asignaturas que registrar.", "aviso");
  const t = totales(p.asignaturas);

  if (p.estado === ESTADOS.REGISTRADO) {
    const r = await preguntar({
      titulo: "Guardar cambios",
      cuerpo: '<div class="nota">Se guardará una versión nueva del plan <b>Registrado</b>.</div>' +
        '<div class="campo"><label for="motivo">Motivo del cambio (opcional)</label>' +
        '<input type="text" id="motivo" placeholder="Matrícula extemporánea"></div>',
      acciones: [{ texto:"Cancelar", valor:null }, { texto:"Confirmar", clase:"primario", valor:() => $("#motivo").value.trim() }]
    });
    if (!r) return;
    let g;
    try { g = await guardar({ estado: ESTADOS.REGISTRADO, tipo: Dominio.TIPO_VERSION.CAMBIOS, motivo: r() }); } catch (e) { return informarError(e); }
    if (!g) return;
    aviso("Cambios guardados como v" + g.version);
    return pintarGrilla();
  }

  const mensaje = "¿Desea registrar el Plan de Ciclo de " + nombreCarrera(app.carrera) + " para el periodo " + app.ciclo +
    "? Al confirmar, el estado cambiará a REGISTRADO y se habilitará la asignación docente para los Departamentos " +
    "Académicos (DIMA, DAHUC, DACJ, DACTE). El plan podrá seguir editándose y cada guardado generará una nueva versión.";

  const ok = await preguntar({
    titulo: "Registrar el plan de ciclo",
    cuerpo:
      '<div class="tabla-caja"><table><tbody>' +
        "<tr><td>Asignaturas</td><td class='num'>" + t.asig + "</td><td>Grupos</td><td class='num'>" + t.grupos + "</td></tr>" +
        "<tr><td>Horas teóricas</td><td class='num'>" + t.ht + "</td><td>Horas prácticas</td><td class='num'>" + t.hp + "</td></tr>" +
        "<tr><td>Total horas</td><td class='num'>" + t.th + "</td><td>Horas de dictado</td><td class='num'>" + t.dictado + "</td></tr>" +
        "<tr><td>Fusiones</td><td class='num'>" + t.fus + "</td><td>Desdobles</td><td class='num'>" + t.des + "</td></tr>" +
      "</tbody></table></div>" +
      '<div class="cita mt-3">' + esc(mensaje) + "</div>",
    acciones: [{ texto:"Cancelar", valor:null }, { texto:"Confirmar y registrar", clase:"primario", valor:true }]
  });
  if (!ok) return;

  let g;
  try { g = await guardar({ estado: ESTADOS.REGISTRADO, tipo: Dominio.TIPO_VERSION.REGISTRAR }); } catch (e) { return informarError(e); }
  if (!g) return;
  const sig = app.carrera;
  sesionPlan.detener();
  app.plan = null;
  mostrar("exito");
  $("#exito-nota").innerHTML =
    "<b>Plan registrado.</b> " + esc(nombreCarrera(sig)) + " · " + esc(app.ciclo) + " · versión <b>v" + g.version + "</b>. " +
    "La asignación docente queda habilitada para DIMA, DAHUC, DACJ y DACTE. El plan sigue siendo editable: cada guardado generará una versión nueva.";
  celebrar();
  anunciar("soltado", { ciclo: app.ciclo, sig: sig });
  try { await llamarEnSilencio("liberarBloqueo", app.ciclo, sig); } catch (e) { /* caduca solo */ }
};

$("#exito-editar").onclick = () => { if (app.carrera) abrirEdicion(app.carrera); };

$("#volver-grilla").onclick = async () => {
  const ok = await confirmarSalidaEdicion();
  if (!ok) return;
  terminarEdicion();
};

/* ============================================================
   Celebración al registrar: confeti con los colores de la marca
   ============================================================ */
function celebrar(){
  if (reducirMovimiento() || document.hidden) return;
  const lienzo = document.createElement("canvas");
  lienzo.className = "confeti";
  lienzo.setAttribute("aria-hidden", "true");
  const escala = Math.min(2, window.devicePixelRatio || 1), ancho = innerWidth, alto = innerHeight;
  lienzo.width = ancho * escala; lienzo.height = alto * escala;
  document.body.appendChild(lienzo);
  const ctx = lienzo.getContext("2d");
  ctx.scale(escala, escala);
  const colores = ["#0280BD", "#0778B2", "#15567C", "#7CCBF2", "#FFFFFF"];
  const origen = { x: ancho / 2, y: Math.min(alto * 0.35, 300) };
  const piezas = Array.from({ length: 110 }, () => {
    const angulo = Math.random() * Math.PI * 2, rapidez = 3 + Math.random() * 8;
    return {
      x: origen.x, y: origen.y, vx: Math.cos(angulo) * rapidez, vy: Math.sin(angulo) * rapidez - 6,
      g: 0.16 + Math.random() * 0.1, giro: Math.random() * Math.PI, vgiro: (Math.random() - 0.5) * 0.3,
      t: 6 + Math.random() * 7, color: colores[Math.floor(Math.random() * colores.length)], triangulo: Math.random() < 0.5
    };
  });
  const inicio = performance.now(), duracion = 1900;
  const paso = ahora => {
    const transcurrido = ahora - inicio;
    ctx.clearRect(0, 0, ancho, alto);
    ctx.globalAlpha = Math.max(0, 1 - transcurrido / duracion);
    piezas.forEach(p => {
      p.vy += p.g; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.giro += p.vgiro;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.giro);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = "rgba(21, 86, 124, 0.35)";
      ctx.beginPath();
      if (p.triangulo) { ctx.moveTo(0, -p.t / 1.6); ctx.lineTo(p.t / 1.8, p.t / 2.2); ctx.lineTo(-p.t / 1.8, p.t / 2.2); ctx.closePath(); }
      else ctx.rect(-p.t / 2, -p.t / 4, p.t, p.t / 2);
      ctx.fill();
      if (p.color === "#FFFFFF") ctx.stroke();
      ctx.restore();
    });
    if (transcurrido < duracion) requestAnimationFrame(paso); else lienzo.remove();
  };
  requestAnimationFrame(paso);
  setTimeout(() => lienzo.remove(), duracion + 600);
}
</script>
