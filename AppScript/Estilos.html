<style>
:root{
  --ground:#eaeef2; --surface:#fff; --surface-2:#f6f8fa; --surface-3:#eef2f6;
  --ink:#15212c; --ink-soft:#5b6b7b; --ink-faint:#8697a6;
  --line:#ccd7e0; --line-soft:#e2e9ef;
  --acento:#1b5a78; --acento-viva:#24789e; --acento-tenue:#e2eef3;
  --aviso:#8a5a00; --aviso-fondo:#fbf0d5; --aviso-linea:#e0c37a;
  --error:#96242a; --error-fondo:#fae6e6; --error-linea:#dba3a3;
  --ok:#1d6644; --ok-fondo:#e2f0e8; --ok-linea:#9ac7b0;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:4px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#0e151c; --surface:#161f29; --surface-2:#1b2732; --surface-3:#22303d;
    --ink:#e4ecf3; --ink-soft:#9aabbb; --ink-faint:#71879a;
    --line:#2e3f4f; --line-soft:#24323f;
    --acento:#5aa8c8; --acento-viva:#7cc0dc; --acento-tenue:#17303c;
    --aviso:#e0b45c; --aviso-fondo:#33290f; --aviso-linea:#6b551f;
    --error:#e89a9a; --error-fondo:#38191a; --error-linea:#6e3234;
    --ok:#83c9a5; --ok-fondo:#13301f; --ok-linea:#32603f;
  }
}
*{box-sizing:border-box}
/* El atributo hidden debe ganar a cualquier display propio (por ejemplo .usuario{display:flex}). */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acento-viva);outline-offset:2px}

.barra{
  position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);
}
.marca{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.marca b{font-size:15px;letter-spacing:-.01em}
.marca span{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em}
.usuario{display:flex;align-items:center;gap:9px}
.usuario img{width:28px;height:28px;border-radius:50%;border:1px solid var(--line)}
.usuario .datos{display:flex;flex-direction:column;line-height:1.25;text-align:right}
.usuario .datos b{font-size:12.5px}
.usuario .datos span{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
@media (max-width:620px){ .usuario .datos{display:none} }

.lienzo{max-width:1180px;margin:0 auto;padding:16px;padding-bottom:calc(74px + env(safe-area-inset-bottom, 0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
.panel-cab h2{font-size:15px;margin-right:auto}
.panel-cuerpo{padding:16px}

.etq{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);font-weight:600}

.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
  cursor:pointer;font-size:13px;font-weight:500;transition:background .12s,border-color .12s;
}
.btn:hover:not(:disabled){background:var(--surface-3);border-color:var(--ink-faint)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primario{background:var(--acento);border-color:var(--acento);color:#fff}
.btn.primario:hover:not(:disabled){background:var(--acento-viva);border-color:var(--acento-viva)}
.btn.peligro{color:var(--error);border-color:var(--error-linea)}
.btn.peligro:hover:not(:disabled){background:var(--error-fondo)}
.btn.volver{padding:5px 11px;font-size:12.5px;color:var(--ink-soft)}
.barra-acciones{display:flex;flex-wrap:wrap;gap:8px}

.centro{display:flex;justify-content:center;padding:36px 16px}
.acceso{width:100%;max-width:430px;text-align:center}
.acceso .sello{
  width:52px;height:52px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;
  background:var(--acento);color:#fff;font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.04em;
}
.acceso h2{font-size:19px;margin-bottom:4px}
.acceso p{color:var(--ink-soft);margin-bottom:20px;font-size:13px}
#gbtn{display:flex;justify-content:center;min-height:44px}

.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.campo label{font-size:12px;font-weight:600;color:var(--ink-soft)}
select,input[type=text],input[type=number],textarea{
  font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);color:var(--ink);width:100%;
}
textarea{font-family:var(--mono);font-size:12px;resize:vertical;min-height:150px}
.fila-campos{display:flex;flex-wrap:wrap;gap:12px}
.fila-campos .campo{flex:1 1 140px;margin-bottom:0}

/* ---------- área de pegado con aspecto de hoja de cálculo ---------- */
.hoja{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);
  min-height:220px;position:relative;overflow:hidden;
}
.hoja:focus-visible{outline:2px solid var(--acento-viva);outline-offset:2px}
.hoja.encima{border-color:var(--acento);background:var(--acento-tenue)}
.hoja-vacia{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;text-align:center;
  color:var(--ink-faint);
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),
                   linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
  background-size:100% 30px,116px 100%;
}
.hoja-vacia b{font-size:14px;color:var(--ink-soft)}
.hoja-vacia small{font-size:12px;font-family:var(--mono)}
.hoja-scroll{max-height:420px;overflow:auto}
.hoja table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
.hoja th,.hoja td{
  border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  padding:4px 8px;white-space:nowrap;background:var(--surface);
  max-width:260px;overflow:hidden;text-overflow:ellipsis;
}
/* Cabeceras de columna (A, B, C…) y de fila (1, 2, 3…), como en una hoja */
.hoja thead th{
  position:sticky;top:0;z-index:2;
  background:var(--surface-3);color:var(--ink-faint);
  font-family:var(--mono);font-size:11px;font-weight:600;text-align:center;
  letter-spacing:0;text-transform:none;
}
.hoja tbody th{
  position:sticky;left:0;z-index:1;
  background:var(--surface-3);color:var(--ink-faint);
  font-family:var(--mono);font-size:11px;font-weight:600;text-align:right;
  width:44px;min-width:44px;
}
.hoja thead th:first-child{left:0;z-index:3;width:44px;min-width:44px}
.hoja tr.fila-cabecera td{
  background:var(--acento-tenue);color:var(--acento);font-weight:600;
}
.hoja td.vacia{color:var(--ink-faint)}
.hoja-pie{
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  margin-top:7px;font-size:12px;color:var(--ink-soft);
}
.hoja-pie .dato{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}

.tabla-caja{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{
  text-align:left;padding:8px 10px;background:var(--surface-3);border-bottom:1px solid var(--line);
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);white-space:nowrap;font-weight:600;
}
td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
.num,.cod{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
.num{text-align:right;white-space:nowrap}
tr.pulsable{cursor:pointer}
tr.pulsable:hover td{background:var(--surface-2)}
tr.sel td{background:var(--acento-tenue)}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--acento)}

.pill{display:inline-block;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.sin{background:var(--surface-3);color:var(--ink-soft);border-color:var(--line)}
.pill.borrador{background:var(--aviso-fondo);color:var(--aviso);border-color:var(--aviso-linea)}
.pill.registrado{background:var(--ok-fondo);color:var(--ok);border-color:var(--ok-linea)}
.pill.bloqueado{background:var(--error-fondo);color:var(--error);border-color:var(--error-linea)}
.marca-c{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:10px;font-weight:700}
.marca-c.intl{background:var(--acento-tenue);color:var(--acento);border:1px solid var(--acento)}
.marca-c.fus{background:var(--ok-fondo);color:var(--ok);border:1px solid var(--ok-linea)}
.marca-c.des{background:var(--surface-3);color:var(--ink-soft);border:1px solid var(--line)}


.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.resumen div{background:var(--surface);padding:9px 11px}
.resumen dt{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600;margin-bottom:2px}
.resumen dd{margin:0;font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.resumen div.alerta dd{color:var(--aviso)}

.bloque{border:1px solid var(--line-soft);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.bloque-cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center;width:100%;padding:9px 12px;background:var(--surface-2);border:0;border-bottom:1px solid var(--line-soft);cursor:pointer;text-align:left}
.bloque-cab:hover{background:var(--surface-3)}
.bloque-cab b{font-size:13px}
.bloque-cab .tot{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bloque-cab .chev{font-size:10px;color:var(--ink-faint);width:11px}
.bloque[data-abierto=no] .bloque-cab{border-bottom:0}
.bloque[data-abierto=no] .tabla-caja{display:none}
.bloque .tabla-caja{border:0;border-radius:0}
.bloque table{table-layout:fixed;min-width:760px}
.bloque td{overflow-wrap:anywhere}
.bloque th:nth-child(1),.bloque td:nth-child(1){width:74px}
.bloque th:nth-child(2),.bloque td:nth-child(2){width:98px}
.bloque th:nth-child(4),.bloque td:nth-child(4){width:64px}
.bloque th:nth-child(5),.bloque td:nth-child(5){width:52px}
.bloque th:nth-child(6),.bloque td:nth-child(6){width:52px}
.bloque th:nth-child(7),.bloque td:nth-child(7){width:64px}
.bloque th:nth-child(8),.bloque td:nth-child(8){width:74px}
.bloque th:nth-child(9),.bloque td:nth-child(9){width:148px}

dialog{border:1px solid var(--line);border-radius:6px;padding:0;background:var(--surface);color:var(--ink);width:min(580px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(8,16,24,.55)}
.dlg-cab{padding:14px 18px;border-bottom:1px solid var(--line-soft)}
.dlg-cab h3{font-size:16px}
.dlg-cuerpo{padding:14px 18px;max-height:min(56vh,460px);overflow-y:auto}
.dlg-pie{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line-soft);background:var(--surface-2)}

.nota{padding:9px 11px;border-radius:var(--r);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line-soft)}
.nota+.nota{margin-top:8px}
.nota.aviso{background:var(--aviso-fondo);border-color:var(--aviso-linea);color:var(--aviso)}
.nota.error{background:var(--error-fondo);border-color:var(--error-linea);color:var(--error)}
.nota.ok{background:var(--ok-fondo);border-color:var(--ok-linea);color:var(--ok)}
.cita{font-size:12.5px;line-height:1.55;padding:10px 12px;border-left:3px solid var(--acento);background:var(--surface-2);border-radius:0 var(--r) var(--r) 0}

.lista-err{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:12px;max-height:280px;overflow-y:auto}
.lista-err li{display:flex;gap:8px;padding:5px 8px;border-radius:3px;background:var(--error-fondo);border:1px solid var(--error-linea);color:var(--error)}
.lista-err .cod{font-weight:700;min-width:32px;flex:none}
.lista-adv li{background:var(--aviso-fondo);border-color:var(--aviso-linea);color:var(--aviso)}

.brindis{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,calc(100vw - 32px))}
.brindis div{background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:100px;font-size:12.5px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.22)}

.menu{display:grid;gap:8px}
.menu-op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer}
.menu-op:hover:not(:disabled){border-color:var(--acento);background:var(--acento-tenue)}
.menu-op:disabled{opacity:.45;cursor:not-allowed}
.menu-op b{font-size:14px}
.menu-op small{display:block;color:var(--ink-soft);font-size:12px}

.zona-archivo{
  border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;
  background:var(--surface-2);cursor:pointer;transition:border-color .12s,background .12s;
}
.zona-archivo:hover,.zona-archivo.encima{border-color:var(--acento);background:var(--acento-tenue)}
.zona-archivo b{display:block;font-size:14px;margin-bottom:3px}
.zona-archivo small{color:var(--ink-soft)}

.reloj{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.reloj.poco{color:var(--error);font-weight:700}

.pasos-guia{counter-reset:g;list-style:none;margin:10px 0 0;padding:0;display:grid;gap:9px}
.pasos-guia li{counter-increment:g;display:flex;gap:10px;font-size:13px;line-height:1.5}
.pasos-guia li::before{
  content:counter(g);flex:none;width:20px;height:20px;border-radius:50%;margin-top:1px;
  background:var(--acento);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;
}
code{font-family:var(--mono);font-size:12px;background:var(--surface-3);padding:1px 5px;border-radius:3px}

/* Barra de marca anclada al pie del viewport: no se mueve al cambiar de vista. */
.pie-marca{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--surface);border-top:1px solid var(--line);
  padding:7px 16px calc(7px + env(safe-area-inset-bottom, 0px));
}
.pie-marca .interior{
  max-width:1180px;margin:0 auto;
  display:flex;align-items:center;gap:10px;justify-content:flex-end;
}
.pie-marca .txt{font-size:11.5px;color:var(--ink-faint)}
.pie-marca .txt b{color:var(--ink-soft);font-weight:600}

/* ---------- añadidos de la versión en Apps Script ---------- */
/* Barra de actividad mientras el servidor responde. */
.cargando{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;overflow:hidden;background:var(--acento-tenue)}
.cargando::before{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--acento-viva);animation:cargando 1.1s ease-in-out infinite}
@keyframes cargando{from{left:-30%}to{left:100%}}
@media (prefers-reduced-motion:reduce){.cargando::before{animation:none;left:0;width:100%;opacity:.6}}
body.ocupado .lienzo{pointer-events:none;cursor:progress}
#avisos-tablero{margin-bottom:12px}
.fila-tablero{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}

/* ---------- CU-002: Carga de Docentes ---------- */
.conmutador-vistas{background:var(--fondo-suave);border:1px solid var(--line);border-radius:6px;padding:2px}
.conmutador-vistas .btn{border:none;background:transparent;padding:6px 12px;font-size:12.5px;border-radius:4px;color:var(--ink-soft);box-shadow:none}
.conmutador-vistas .btn.activo{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,0.06)}

.resumen-docentes{display:grid;grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));gap:10px}
.tarjeta-metrica{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column}
.tarjeta-metrica small{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.5px}
.tarjeta-metrica b{font-size:20px;font-weight:700;color:var(--ink);margin-top:2px}
.tarjeta-metrica.con-alerta b{color:var(--peligro, #b91c1c)}

.panel-alertas-docentes{background:var(--aviso-fondo, #fffbeb);border:1px solid var(--aviso-borde, #fef08a);border-radius:6px;padding:12px;margin-bottom:14px}
.panel-alertas-docentes ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-soft)}
.panel-alertas-docentes li{margin-bottom:4px}

.badge-doc{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600}
.badge-doc.alerta{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.badge-doc.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.badge-doc.pendiente{background:#fef9c3;color:#854d0e;border:1px solid #fef08a}
.badge-doc.condicion{background:var(--fondo-suave);color:var(--ink-soft);border:1px solid var(--line)}

.chip-curso{display:inline-block;background:var(--fondo-suave);border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin:2px;font-size:11.5px}
.chip-curso.teoria{border-left:3px solid #2563eb}
.chip-curso.practica{border-left:3px solid #10b981}
</style>
