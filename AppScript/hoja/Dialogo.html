<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --azul: #1F3A5F; --texto: #1F2933; --tenue: #5F6B7A; --borde: #D5DBE3; --gris: #F4F6F9;
          --error: #B3261E; --error-claro: #FCE8E6; --adv: #8A6100; --adv-claro: #FEF7E0; --obs: #0B57D0; --obs-claro: #EDF3FC;
          --ok: #1E6B34; --ok-claro: #E6F4EA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--texto); font: 13px/1.45 Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 16px 20px 8px; border-bottom: 1px solid var(--borde); }
  h1 { margin: 0; font-size: 16px; font-weight: 700; color: var(--azul); }
  .lead { color: var(--tenue); margin: 0; }
  h1 + .lead { margin-top: 4px; }
  .lead a { color: var(--azul); }
  main { flex: 1; overflow: auto; padding: 14px 20px; }
  .grupo { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 12px 14px; margin-bottom: 10px;
    border: 1px solid var(--borde); border-left: 4px solid var(--c); border-radius: 6px; cursor: pointer; }
  .grupo.sel { background: var(--gris); }
  .grupo.off { opacity: .55; cursor: default; }
  .grupo input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--azul); cursor: inherit; }
  .titulo b { font-size: 14px; }
  .titulo span { color: var(--tenue); font-size: 12px; margin-left: 6px; }
  .etiquetas { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 2px; }
  .etq { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: var(--gris); color: var(--tenue); border: 1px solid var(--borde); }
  .etq.error { background: var(--error-claro); color: var(--error); border-color: #F4C7C3; }
  .etq.advertencia, .etq.cambio { background: var(--adv-claro); color: var(--adv); border-color: #FCE29A; }
  .etq.observacion { background: var(--obs-claro); color: var(--obs); border-color: #C6DAF7; }
  .etq.ok { background: var(--ok-claro); color: var(--ok); border-color: #B7DFC1; }
  .nota { font-size: 12px; color: var(--tenue); }
  .conflicto { font-size: 12px; color: var(--adv); margin-top: 4px; }
  .muestras { margin: 6px 0 0; padding: 0 0 0 16px; }
  .muestras li { font-size: 12px; margin: 2px 0; }
  .muestras .ref { font-weight: 700; }
  .muestras .error .ref { color: var(--error); } .muestras .advertencia .ref { color: var(--adv); } .muestras .observacion .ref { color: var(--obs); }
  footer { padding: 12px 20px 14px; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--borde); }
  footer .resumen { flex: 1; color: var(--tenue); font-size: 12px; }
  footer .resumen.error { color: var(--error); }
  button { border: 1px solid var(--azul); border-radius: 6px; padding: 9px 16px; font: 500 13px Roboto, Arial, sans-serif; cursor: pointer; background: var(--azul); color: #fff; }
  button.sec { background: #fff; color: var(--azul); }
  button:disabled { opacity: .5; cursor: default; }
  .carga { position: fixed; inset: 0; display: none; place-items: center; background: rgba(255,255,255,.94); z-index: 5; text-align: center; }
  .carga.on { display: grid; }
  .barra { width: 260px; height: 4px; background: #E8ECF2; border-radius: 2px; overflow: hidden; margin: 0 auto 14px; }
  .barra i { display: block; width: 40%; height: 100%; background: var(--azul); animation: avance 1.2s ease-in-out infinite; }
  @keyframes avance { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  .paso { font-weight: 500; color: var(--azul); }
  .sub { color: var(--tenue); font-size: 12px; margin-top: 4px; }
  .hechos { list-style: none; padding: 0; margin: 0; }
  .hechos li { padding: 10px 12px; border: 1px solid var(--borde); border-left: 4px solid var(--c); border-radius: 6px; margin-bottom: 8px; white-space: pre-line; }
  .hechos li.ok { --c: var(--ok); } .hechos li.mal { --c: var(--error); }
  .hechos b { display: block; margin-bottom: 2px; }
  .hechos a { color: var(--azul); }
  @media (prefers-reduced-motion: reduce) { .barra i { animation: none; width: 100%; } }
</style>
</head>
<body data-modo="<?= modo ?>">
<header>
  <h1 id="titulo" hidden></h1>
  <p class="lead" id="lead">Revisando los datos…</p>
</header>
<main id="cuerpo"></main>
<footer>
  <span class="resumen" id="resumen"></span>
  <button class="sec" onclick="google.script.host.close()" id="cerrar">Cancelar</button>
  <button id="accion" disabled></button>
</footer>
<div class="carga on" id="carga"><div><div class="barra"><i></i></div><div class="paso" id="paso">Revisando los datos…</div><div class="sub" id="subpaso"></div></div></div>
<script>
  var MODO = document.body.dataset.modo, datos = null, elegidos = {}, temporizador = null;
  var PASOS = {
    leer: ["Revisando los datos…"],
    traer: ["Abriendo la carpeta…", "Convirtiendo los archivos…", "Copiando las pestañas…", "Revisando las advertencias…"],
    enviar: ["Preparando los archivos…", "Exportando a .xlsx…", "Guardando en la carpeta…", "Moviendo los anteriores a «Anteriores»…"]
  };
  var NOMBRE = { error: "Error", advertencia: "Advertencia", observacion: "Observación" };
  function cargando(on, tipo) {
    document.getElementById("carga").classList.toggle("on", on);
    clearInterval(temporizador);
    if (!on) return;
    var i = 0, p = PASOS[tipo] || PASOS.leer, el = document.getElementById("paso");
    el.textContent = p[0];
    document.getElementById("subpaso").textContent = tipo === "leer" ? "" : "No cierres esta ventana. El proceso tarda unos segundos por archivo.";
    temporizador = setInterval(function () { i = Math.min(i + 1, p.length - 1); el.textContent = p[i]; }, 4000);
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }

  function pintar(d) {
    datos = d; cargando(false);
    document.getElementById("lead").innerHTML = MODO === "traer"
      ? "Copia al Centro los archivos de la carpeta <a href='" + esc(d.carpeta.url) + "' target='_blank'>" + esc(d.carpeta.nombre) + "</a> y la pestaña Usuarios de la BD. Las pestañas de los grupos elegidos se reemplazan."
      : "Solo se envía lo que cambió desde que se trajo. Cada archivo vuelve a la carpeta <a href='" + esc(d.carpeta.url) + "' target='_blank'>" + esc(d.carpeta.nombre) + "</a> como un .xlsx nuevo; el anterior pasa a «Anteriores».";
    var cuerpo = document.getElementById("cuerpo"); cuerpo.innerHTML = "";
    d.grupos.forEach(function (g) {
      elegidos[g.id] = g.disponible;
      var c = g.cuentas || { error: 0, advertencia: 0, observacion: 0 };
      var etq = [];
      if (MODO === "traer") {
        if (g.archivo) etq.push("<span class='etq'>" + esc(g.archivo.nombre) + ", modificado el " + esc(g.archivo.modificado) + "</span>");
        if (g.pestanas) etq.push("<span class='etq'>Traído el " + esc(g.traido) + "</span>");
        if (g.editado) etq.push("<span class='etq cambio'>Tiene cambios sin enviar, que se perderán</span>");
      } else {
        if (g.editado) etq.push("<span class='etq cambio'>Con cambios</span>");
        if (c.error) etq.push("<span class='etq error'>" + plural(c.error, "error", "errores") + "</span>");
        if (c.advertencia) etq.push("<span class='etq advertencia'>" + plural(c.advertencia, "advertencia", "advertencias") + "</span>");
        if (c.observacion) etq.push("<span class='etq observacion'>" + plural(c.observacion, "observación", "observaciones") + "</span>");
        if (g.pestanas && !c.error && !c.advertencia && !c.observacion) etq.push("<span class='etq ok'>Sin advertencias</span>");
      }
      var div = document.createElement("label");
      div.className = "grupo" + (g.disponible ? " sel" : " off");
      div.style.setProperty("--c", g.color);
      div.innerHTML = "<input type='checkbox' " + (g.disponible ? "checked" : "disabled") + ">" +
        "<div><div class='titulo'><b>" + esc(g.etiqueta) + "</b><span>" + esc(g.fuente) + (g.pestanas ? ", " + plural(g.pestanas, "pestaña", "pestañas") : "") + "</span></div>" +
        (etq.length ? "<div class='etiquetas'>" + etq.join("") + "</div>" : "") +
        (g.motivo ? "<div class='nota'>" + esc(g.motivo) + "</div>" : "") +
        (g.conflicto ? "<div class='conflicto'>" + esc(g.conflicto) + (MODO === "enviar" ? " Si envías, tu versión lo reemplaza." : " Tráelo de nuevo para ver la versión actual.") + "</div>" : "") +
        (MODO === "enviar" && g.muestras.length && g.disponible ? "<ul class='muestras'>" + g.muestras.map(function (m) {
          return "<li class='" + m.nivel + "'><span class='ref'>" + NOMBRE[m.nivel] + ", " + esc(m.hoja + "!" + m.a1) + ":</span> " + esc(m.mensaje) + "</li>"; }).join("") + "</ul>" : "") +
        "</div>";
      var caja = div.querySelector("input");
      caja.addEventListener("change", function () { elegidos[g.id] = caja.checked; div.classList.toggle("sel", caja.checked); resumen(); });
      cuerpo.appendChild(div);
    });
    resumen();
  }

  function resumen() {
    var ids = Object.keys(elegidos).filter(function (k) { return elegidos[k]; });
    var boton = document.getElementById("accion");
    boton.disabled = !ids.length;
    boton.textContent = (MODO === "traer" ? "Traer" : "Enviar") + " (" + ids.length + ")";
    var c = { error: 0, advertencia: 0 };
    datos.grupos.forEach(function (g) { if (elegidos[g.id]) { c.error += g.cuentas.error; c.advertencia += g.cuentas.advertencia; } });
    var r = document.getElementById("resumen");
    r.className = "resumen" + (MODO === "enviar" && c.error ? " error" : "");
    r.textContent = MODO === "enviar"
      ? (c.error ? "Lo seleccionado tiene " + plural(c.error, "error", "errores") + ": la app rechazará o descartará esos datos." : c.advertencia ? plural(c.advertencia, "advertencia", "advertencias") + " por revisar; la app las acepta." : ids.length ? "Sin errores ni advertencias." : "No hay cambios que enviar.")
      : (ids.length ? "Se reemplazarán " + plural(ids.length, "grupo", "grupos") + " de pestañas." : "");
  }

  document.getElementById("accion").addEventListener("click", function () {
    var ids = Object.keys(elegidos).filter(function (k) { return elegidos[k]; });
    if (!ids.length) return;
    cargando(true, MODO);
    google.script.run.withSuccessHandler(resultado).withFailureHandler(fallo)[MODO](ids);
  });

  function resultado(r) {
    cargando(false);
    var ok = r.hechos.filter(function (h) { return h.ok; }).length;
    document.getElementById("titulo").hidden = false;
    document.getElementById("titulo").textContent = ok === r.hechos.length
      ? (MODO === "traer" ? "Datos traídos correctamente" : "Cambios enviados correctamente")
      : "El proceso terminó con errores";
    document.getElementById("lead").textContent = MODO === "traer"
      ? "Las pestañas ya están en el Centro con su revisión. El panel de advertencias muestra el detalle."
      : "Los archivos nuevos ya están en la carpeta. En la app, «Releer Excel» los lee de inmediato.";
    var nombres = {}; datos.grupos.forEach(function (g) { nombres[g.id] = g.etiqueta; });
    document.getElementById("cuerpo").innerHTML = "<ul class='hechos'>" + r.hechos.map(function (h) {
      return "<li class='" + (h.ok ? "ok" : "mal") + "'><b>" + esc(nombres[h.id] || h.id) + (h.ok ? "" : ": error") + "</b>" + esc(h.texto) +
        (h.url ? " <a href='" + esc(h.url) + "' target='_blank'>Abrir</a>" : "") + "</li>"; }).join("") + "</ul>";
    document.getElementById("accion").style.display = "none";
    document.getElementById("resumen").textContent = "";
    document.getElementById("cerrar").textContent = "Cerrar";
  }
  function fallo(e) { cargando(false); var r = document.getElementById("resumen"); r.className = "resumen error"; r.textContent = "Error: " + e.message; }

  cargando(true, "leer");
  google.script.run.withSuccessHandler(pintar).withFailureHandler(function (e) { cargando(false); document.getElementById("lead").textContent = "Error: " + e.message; }).datosDialogo(MODO);
</script>
</body>
</html>
